name: Build Ardour (Windows / MSVC)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Waf build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

      vcpkg_ref:
        description: "Optional vcpkg commit/tag to pin"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: windows-2022

    env:
      VCPKG_HOME: C:\vcpkg
      VCPKG_ROOT: C:\vcpkg
      VCPKG_TRIPLET: x64-windows
      INSTALL_DIR: ${{ github.workspace }}\dist

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Ardour
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          submodules: recursive


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # MSVC
      # ============================================================

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64


      # ============================================================
      # LLVM
      # ============================================================

      - name: Install LLVM 18
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"
          directory: ${{ runner.temp }}\llvm

      - name: Add LLVM to PATH
        shell: pwsh
        run: |
          $llvmBin = "${{ runner.temp }}\llvm\bin"

          if (-not (Test-Path $llvmBin)) {
            throw "LLVM bin directory does not exist: $llvmBin"
          }

          Add-Content $env:GITHUB_PATH $llvmBin

          Write-Host "LLVM added to PATH:"
          Write-Host $llvmBin


      # ============================================================
      # PERL
      # ============================================================

      - name: Add Strawberry Perl to PATH
        shell: pwsh
        run: |
          $perlPaths = @(
            "C:\Strawberry\perl\bin",
            "C:\Strawberry\perl\site\bin",
            "C:\Strawberry\c\bin"
          )

          foreach ($path in $perlPaths) {
            if (Test-Path $path) {
              Add-Content $env:GITHUB_PATH $path
              Write-Host "Added: $path"
            }
          }


      # ============================================================
      # SHOW TOOLCHAIN
      # ============================================================

      - name: Show MSVC environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "MSVC TOOLCHAIN"
          Write-Host "============================================================"

          Write-Host "VCToolsVersion:      $env:VCToolsVersion"
          Write-Host "VCToolsInstallDir:   $env:VCToolsInstallDir"
          Write-Host "VSCMD_VER:           $env:VSCMD_VER"
          Write-Host "Platform:            $env:Platform"
          Write-Host "VSCMD_ARG_HOST_ARCH: $env:VSCMD_ARG_HOST_ARCH"
          Write-Host "VSCMD_ARG_TGT_ARCH:  $env:VSCMD_ARG_TGT_ARCH"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VCPKG"
          Write-Host "============================================================"

          Write-Host "VCPKG_HOME:          $env:VCPKG_HOME"
          Write-Host "VCPKG_ROOT:          $env:VCPKG_ROOT"
          Write-Host "VCPKG_TRIPLET:       $env:VCPKG_TRIPLET"

          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            Write-Error "vcpkg.exe was not found at $env:VCPKG_ROOT\vcpkg.exe"
            exit 1
          }

          Write-Host ""
          Write-Host "vcpkg version:"
          & "$env:VCPKG_ROOT\vcpkg.exe" version

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg version command failed."
          }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "LLVM"
          Write-Host "============================================================"

          Write-Host "clang-cl:"
          where.exe clang-cl

          Write-Host ""
          clang-cl --version

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "PATH CHECK"
          Write-Host "============================================================"

          where.exe cl
          where.exe link
          where.exe python
          where.exe perl
          where.exe ninja

          Write-Host ""
          Write-Host "Environment check complete."


      # ============================================================
      # VCPKG
      # ============================================================

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg
          key: ardour-vcpkg-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            ardour-vcpkg-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-
            ardour-vcpkg-${{ runner.os }}-


      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgRoot = "C:\vcpkg"
          $vcpkgExe = "$vcpkgRoot\vcpkg.exe"

          Write-Host "vcpkg root: $vcpkgRoot"

          if (-not (Test-Path $vcpkgRoot)) {
            New-Item -ItemType Directory -Path $vcpkgRoot -Force | Out-Null
          }

          if (-not (Test-Path $vcpkgExe)) {
            Write-Host "Bootstrapping vcpkg..."

            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot

            Push-Location $vcpkgRoot

            .\bootstrap-vcpkg.bat -disableMetrics

            Pop-Location
          }
          else {
            Write-Host "vcpkg already exists."
          }

          if (-not (Test-Path $vcpkgExe)) {
            throw "vcpkg.exe was not created."
          }

          Write-Host ""
          Write-Host "vcpkg version:"
          & $vcpkgExe version

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg version failed."
          }


      # ============================================================
      # OPTIONAL VCPKG PIN
      # ============================================================

      - name: Pin vcpkg revision
        if: ${{ inputs.vcpkg_ref != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Push-Location C:\vcpkg

          git fetch --all --tags --prune

          git checkout "${{ inputs.vcpkg_ref }}"

          Write-Host ""
          Write-Host "Pinned vcpkg revision:"
          git rev-parse HEAD

          Pop-Location

          if (-not (Test-Path "C:\vcpkg\vcpkg.exe")) {
            Write-Host "Rebuilding vcpkg after checkout..."

            Push-Location C:\vcpkg
            .\bootstrap-vcpkg.bat -disableMetrics
            Pop-Location
          }


      # ============================================================
      # VERIFY VCPKG
      # ============================================================

      - name: Verify vcpkg installation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkg = "C:\vcpkg\vcpkg.exe"

          if (-not (Test-Path $vcpkg)) {
            throw "Missing $vcpkg"
          }

          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET"
          Write-Host "VCPKG_DEFAULT_HOST_TRIPLET=$env:VCPKG_DEFAULT_HOST_TRIPLET"

          & $vcpkg version


      # ============================================================
      # DOWNLOAD ARDOUR DEPENDENCY HELPER
      # ============================================================

      - name: Download Ardour dependency helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://raw.githubusercontent.com/EZ4Stephen/testardourdeps/main/vcpkg-build/InstallDependencies.vcpkg.py"
          $output = "$env:RUNNER_TEMP\InstallDependencies.vcpkg.py"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $output

          if (-not (Test-Path $output)) {
            throw "Failed to download dependency helper."
          }

          Write-Host "Downloaded:"
          Write-Host $output


      # ============================================================
      # PATCH DEPENDENCY HELPER
      # ============================================================

      - name: Patch dependency helper for standalone vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "$env:RUNNER_TEMP\InstallDependencies.vcpkg.py"

          if (-not (Test-Path $file)) {
            throw "Dependency helper not found: $file"
          }

          $text = Get-Content $file -Raw

          # --------------------------------------------------------
          # Force the helper to use our standalone vcpkg installation.
          # --------------------------------------------------------

          $text = $text -replace `
            '_vcpkg_dir = _script_dir / "vcpkg"', `
            '_vcpkg_dir = Path(r"C:\vcpkg")'

          # --------------------------------------------------------
          # The original helper uses shell=True with a list.
          # This is unnecessary and can cause Windows quoting/path
          # problems. Use normal subprocess execution instead.
          # --------------------------------------------------------

          $text = $text -replace `
            'subprocess\.run\(cmd, cwd=cwd, shell=True\)', `
            'subprocess.run(cmd, cwd=cwd)'

          Set-Content `
            -Path $file `
            -Value $text `
            -Encoding UTF8

          Write-Host ""
          Write-Host "Patched dependency helper:"
          Write-Host $file

          Write-Host ""
          Write-Host "Relevant configuration:"
          Select-String `
            -Path $file `
            -Pattern "_vcpkg_dir|subprocess.run" `
            -Context 0,1


      # ============================================================
      # VCPKG DEPENDENCIES
      # ============================================================

      - name: Install Ardour dependencies
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkg = "C:\vcpkg\vcpkg.exe"
          $overlay = "C:\vcpkg\overlay_ports"

          Write-Host "============================================================"
          Write-Host "VCPKG DEPENDENCY INSTALLATION"
          Write-Host "============================================================"

          Write-Host "VCPKG_ROOT:             $env:VCPKG_ROOT"
          Write-Host "VCPKG_DEFAULT_TRIPLET:  $env:VCPKG_DEFAULT_TRIPLET"
          Write-Host "VCPKG_DEFAULT_HOST:     $env:VCPKG_DEFAULT_HOST_TRIPLET"
          Write-Host "Overlay:                $overlay"

          if (-not (Test-Path $vcpkg)) {
            throw "vcpkg.exe does not exist: $vcpkg"
          }

          if (-not (Test-Path $overlay)) {
            New-Item -ItemType Directory -Path $overlay -Force | Out-Null
          }

          Write-Host ""
          Write-Host "vcpkg version:"
          & $vcpkg version

          Write-Host ""
          Write-Host "Running vcpkg with --debug..."

          & $vcpkg --debug install `
            --overlay-ports="$overlay" `
            --triplet=x64-windows `
            --host-triplet=x64-windows `
            boost-ptr-container `
            glib `
            libsndfile `
            curl `
            libarchive `
            liblo `
            taglib `
            vamp-sdk `
            libusb `
            rubberband `
            jack2 `
            pthreads `
            "fftw3[threads]" `
            "aubio[core]" `
            libpng `
            pango `
            lv2 `
            libxml2 `
            cppunit `
            libwebsockets `
            "portaudio[asio]" `
            libsamplerate `
            serd `
            sord `
            sratom `
            lilv `
            boost-uuid `
            boost-tokenizer `
            boost-multiprecision `
            boost-pool `
            boost-algorithm `
            boost-property-tree `
            boost-multi-array `
            getopt `
            libjpeg-turbo `
            readline `
            libsigcpp `
            glibmm `
            cairomm `
            pangomm

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg dependency installation failed with exit code $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VCPKG INSTALL COMPLETE"
          Write-Host "============================================================"


      # ============================================================
      # PKG-CONFIG
      # ============================================================

      - name: Configure pkg-config
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgBin = "C:\vcpkg"

          $pkgconf = Get-ChildItem `
            -Path $vcpkgBin `
            -Filter "pkgconf.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $pkgconf) {
            Write-Host "pkgconf.exe not found under C:\vcpkg."
            Write-Host "Searching PATH..."

            $pkgconfCommand = Get-Command pkgconf.exe -ErrorAction SilentlyContinue

            if ($pkgconfCommand) {
              $pkgconf = $pkgconfCommand.Source
            }
          }

          if (-not $pkgconf) {
            throw "Could not locate pkgconf.exe."
          }

          Write-Host "pkgconf:"
          Write-Host $pkgconf

          $pkgconfDir = Split-Path $pkgconf -Parent

          Add-Content $env:GITHUB_PATH $pkgconfDir

          $pkgConfigExe = Join-Path $pkgconfDir "pkg-config.exe"

          if (-not (Test-Path $pkgConfigExe)) {
            Copy-Item `
              $pkgconf `
              $pkgConfigExe `
              -Force
          }

          Write-Host ""
          Write-Host "pkg-config:"
          & $pkgConfigExe --version

          $pkgRoot = "C:\vcpkg\installed\x64-windows"

          $pkgPaths = @(
            "$pkgRoot\lib\pkgconfig",
            "$pkgRoot\share\pkgconfig"
          )

          $existingPkgPath = $env:PKG_CONFIG_PATH

          if ($existingPkgPath) {
            $pkgPaths += $existingPkgPath
          }

          $env:PKG_CONFIG_PATH = ($pkgPaths -join ";")

          Add-Content `
            $env:GITHUB_ENV `
            "PKG_CONFIG_PATH=$env:PKG_CONFIG_PATH"

          Write-Host ""
          Write-Host "PKG_CONFIG_PATH:"
          Write-Host $env:PKG_CONFIG_PATH


      # ============================================================
      # PREPARE INCLUDE PATHS
      # ============================================================

      - name: Prepare MSVC include paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\vcpkg\installed\x64-windows"

          $includeDirs = @(
            "$root\include",
            "$root\include\cairo",
            "$root\include\cairomm-1.0",
            "$root\include\fribidi",
            "$root\include\giomm-2.4",
            "$root\include\glib-2.0",
            "$root\include\glibmm-2.4",
            "$root\include\harfbuzz",
            "$root\include\libpng16",
            "$root\include\libusb-1.0",
            "$root\include\libxml2",
            "$root\include\pango-1.0",
            "$root\include\pixman-1",
            "$root\include\sigc++-2.0",
            "$root\lib\cairomm-1.0\include",
            "$root\lib\giomm-2.4\include",
            "$root\lib\glib-2.0\include",
            "$root\lib\glibmm-2.4\include"
          )

          $validDirs = @()

          foreach ($dir in $includeDirs) {
            if (Test-Path $dir) {
              $validDirs += $dir
            }
            else {
              Write-Warning "Missing include directory: $dir"
            }
          }

          Write-Host ""
          Write-Host "MSVC include directories:"

          foreach ($dir in $validDirs) {
            Write-Host "  $dir"
          }

          # Preserve the Visual Studio include paths already supplied
          # by msvc-dev-cmd instead of replacing them.

          $existingInclude = $env:INCLUDE

          if ($existingInclude) {
            $allInclude = $existingInclude + ";" + ($validDirs -join ";")
          }
          else {
            $allInclude = $validDirs -join ";"
          }

          Add-Content `
            $env:GITHUB_ENV `
            "INCLUDE=$allInclude"

          # CFLAGS / CXXFLAGS are also preserved.

          $vcpkgFlagString = ($validDirs | ForEach-Object {
            "/I`"$_`""
          }) -join " "

          $existingCFlags = $env:CFLAGS
          $existingCxxFlags = $env:CXXFLAGS

          if ($existingCFlags) {
            $newCFlags = "$existingCFlags $vcpkgFlagString"
          }
          else {
            $newCFlags = $vcpkgFlagString
          }

          if ($existingCxxFlags) {
            $newCxxFlags = "$existingCxxFlags $vcpkgFlagString"
          }
          else {
            $newCxxFlags = $vcpkgFlagString
          }

          Add-Content `
            $env:GITHUB_ENV `
            "CFLAGS=$newCFlags"

          Add-Content `
            $env:GITHUB_ENV `
            "CXXFLAGS=$newCxxFlags"

          Write-Host ""
          Write-Host "Include path configuration complete."


      # ============================================================
      # VERIFY IMPORTANT HEADERS
      # ============================================================

      - name: Verify dependency headers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $headers = @(
            "C:\vcpkg\installed\x64-windows\include\glib.h",
            "C:\vcpkg\installed\x64-windows\include\glibmm-2.4\glibmm.h",
            "C:\vcpkg\installed\x64-windows\include\sigc++-2.0\sigc++\trackable.h",
            "C:\vcpkg\installed\x64-windows\include\libxml2\libxml\parser.h",
            "C:\vcpkg\installed\x64-windows\include\libusb-1.0\libusb.h"
          )

          Write-Host "Checking required headers..."

          foreach ($header in $headers) {
            if (Test-Path $header) {
              Write-Host "OK: $header"
            }
            else {
              Write-Error "MISSING: $header"
              exit 1
            }
          }

          Write-Host ""
          Write-Host "All required headers are present."


      # ============================================================
      # FETCH ARDOUR UPSTREAM TAGS
      # ============================================================

      - name: Fetch Ardour upstream tags
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $hasUpstream = git remote | Select-String "^upstream$"

          if (-not $hasUpstream) {
            git remote add upstream https://github.com/Ardour/ardour.git
          }

          git fetch upstream --tags --force --prune

          Write-Host ""
          Write-Host "Git description:"
          git describe HEAD

          if ($LASTEXITCODE -ne 0) {
            throw "git describe HEAD failed."
          }


      # ============================================================
      # PATCH LUASESSION GETOPT LINKING
      # ============================================================

      - name: Patch luasession getopt for MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "luasession\wscript"

          if (-not (Test-Path $file)) {
            throw "Could not find $file"
          }

          $text = Get-Content $file -Raw

          $marker = "obj.source       = 'luasession.cc'"

          if (-not $text.Contains($marker)) {
            throw "Could not find luasession source declaration."
          }

          $addition = @"

      # MSVC:
      # Build Ardour's getopt implementation directly into
      # ardour9-lua so getopt_long_a resolves reliably.

      if bld.env['build_target'] == 'msvc':
          obj.source += [
              '../libs/pbd/msvc/getopt.c',
              '../libs/pbd/msvc/getopt_long.c',
          ]
"@

          if ($text -notmatch "libs/pbd/msvc/getopt_long\.c") {
            $text = $text.Replace(
              $marker,
              $marker + $addition
            )

            Set-Content `
              -Path $file `
              -Value $text `
              -Encoding UTF8

            Write-Host "Patched $file"
          }
          else {
            Write-Host "$file already contains the MSVC getopt patch."
          }

          Write-Host ""
          Write-Host "Relevant section:"
          Select-String `
            -Path $file `
            -Pattern "getopt.c|getopt_long.c" `
            -Context 3,3


      # ============================================================
      # CLEAN STALE WAF CACHE
      # ============================================================

      - name: Clean stale Waf configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path ".waf3") {
            Write-Host "Removing .waf3..."
            Remove-Item ".waf3" -Recurse -Force
          }

          if (Test-Path "build") {
            Write-Host "Removing old build directory..."
            Remove-Item "build" -Recurse -Force
          }

          Write-Host "Stale Waf configuration removed."


      # ============================================================
      # CONFIGURE
      # ============================================================

      - name: Configure Ardour
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows
        run: |
          $ErrorActionPreference = "Stop"

          $buildType = "${{ inputs.build_type }}"

          Write-Host "============================================================"
          Write-Host "ARDOUR CONFIGURATION"
          Write-Host "============================================================"

          Write-Host "Build type: $buildType"
          Write-Host "VCPKG_ROOT: $env:VCPKG_ROOT"
          Write-Host "Triplet:    $env:VCPKG_DEFAULT_TRIPLET"
          Write-Host "Install:    $env:INSTALL_DIR"

          if ($buildType -eq "Debug") {
            $optimization = "--debug"
          }
          else {
            $optimization = "--optimize"
          }

          Write-Host ""
          Write-Host "Running Waf configure..."

          python waf configure `
            --prefix="$env:INSTALL_DIR" `
            --configdir=share `
            --ptformat `
            --dist-target=msvc `
            --also-include="C:\vcpkg\installed\x64-windows\include" `
            --also-libdir="C:\vcpkg\installed\x64-windows\lib" `
            --cxx17 `
            --use-lld `
            $optimization

          if ($LASTEXITCODE -ne 0) {
            throw "Waf configure failed with exit code $LASTEXITCODE"
          }


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Ardour
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cpuCount = [Environment]::ProcessorCount

          # Don't overwhelm the GitHub runner.
          $jobs = [Math]::Min($cpuCount, 4)

          Write-Host "============================================================"
          Write-Host "BUILDING ARDOUR"
          Write-Host "============================================================"

          Write-Host "CPU cores: $cpuCount"
          Write-Host "Build jobs: $jobs"

          python waf build -j $jobs

          if ($LASTEXITCODE -ne 0) {
            throw "Waf build failed with exit code $LASTEXITCODE"
          }


      # ============================================================
      # INSTALL
      # ============================================================

      - name: Install Ardour
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "INSTALLING ARDOUR"
          Write-Host "============================================================"

          python waf install

          if ($LASTEXITCODE -ne 0) {
            throw "Waf install failed with exit code $LASTEXITCODE"
          }


      # ============================================================
      # SHOW OUTPUT
      # ============================================================

      - name: Show build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "BUILD OUTPUT"
          Write-Host "============================================================"

          if (-not (Test-Path "$env:INSTALL_DIR")) {
            throw "Install directory does not exist: $env:INSTALL_DIR"
          }

          Get-ChildItem `
            -Path "$env:INSTALL_DIR" `
            -Recurse |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Installed files:"
          (Get-ChildItem "$env:INSTALL_DIR" -Recurse -File).Count


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload Ardour build
        uses: actions/upload-artifact@v4
        with:
          name: ardour-windows-msvc-${{ inputs.build_type }}
          path: ${{ env.INSTALL_DIR }}
          if-no-files-found: error
          compression-level: 6