name: Build Ardour (Windows / MSVC)

# Manual trigger only, as requested. The inputs let you tweak a run
# without editing this file every time.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "waf build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      vcpkg_ref:
        description: "vcpkg commit/tag to pin (blank = latest)"
        required: false
        default: ""

env:
  VCPKG_TRIPLET: x64-windows
  INSTALL_DIR: ${{ github.workspace }}\dist

jobs:
  build:
    runs-on: windows-2022
    steps:
      # filter: blob:none = blobless partial clone. Still fetches every
      # commit and tag (git describe HEAD in wscript needs those for the
      # version string) but skips downloading historical file contents,
      # which is most of the transfer cost on a repo with this much history.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Puts cl.exe / link.exe / ml64.exe on PATH so waf's MSVC autodetect
      # can find them without hardcoding a toolset version.
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Needed to generate .def files for symbols MSVC can't auto-export.
      - name: Install LLVM (for llvm-nm)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"

      - name: Ensure Strawberry Perl is on PATH
        run: echo "C:\Strawberry\perl\bin" >> $env:GITHUB_PATH
        shell: pwsh

      # ---------------------------------------------------------------
      # Dependencies via vcpkg.
      # ASSUMPTION: this package list is a best-effort guess based on
      # Ardour's known dependency set (see wscript / `waf configure
      # --help`). Run `waf configure` once, see what it says is missing,
      # and add/remove packages here accordingly. If your fork already
      # ships a vcpkg.json manifest, replace this block with
      # `vcpkg install --triplet ${{ env.VCPKG_TRIPLET }}` in manifest mode
      # instead of listing packages by hand.
      # ---------------------------------------------------------------

      # Single source of truth for the package list. The installed-package
      # cache key below hashes this file, so adding/removing a package
      # automatically invalidates the right cache entry — no more manually
      # bumping a "-v2" suffix and hoping nobody forgets.
      - name: Write vcpkg package manifest
        run: |
          @'
          boost-format
          boost-optional
          boost-smart-ptr
          glib
          glibmm
          gtkmm
          cairomm
          pangomm
          libsigcpp
          libsndfile
          libsamplerate
          aubio
          taglib
          curl
          liblo
          fftw3
          libflac
          rubberband
          lilv
          serd
          sord
          sratom
          lv2
          pthreads
          portaudio
          '@ | Set-Content -Path vcpkg-packages.txt
        shell: pwsh

      # Caches the vcpkg TOOL itself (its git checkout + built vcpkg.exe),
      # separately from the packages it installs. Without this, every run
      # re-clones the whole vcpkg repo and rebuilds vcpkg.exe from source
      # via bootstrap-vcpkg.bat before installing a single package.
      # Key includes run_id so an unpinned ("latest") run always misses on
      # its own key and re-saves; restore-keys still matches the most
      # recent prior cache to seed it, then the Bootstrap step below does
      # a cheap incremental `git pull` to bring it current.
      - name: Restore vcpkg tool cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg
          key: vcpkg-tool-${{ runner.os }}-${{ inputs.vcpkg_ref != '' && inputs.vcpkg_ref || github.run_id }}
          restore-keys: |
            vcpkg-tool-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          if (!(Test-Path "C:\vcpkg")) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          }
          Push-Location C:\vcpkg
          git fetch origin --tags --quiet
          if ("${{ inputs.vcpkg_ref }}" -ne "") {
            git checkout ${{ inputs.vcpkg_ref }}
          } else {
            git checkout master --quiet
            git pull --ff-only origin master
          }
          Pop-Location
          # No-ops quickly if vcpkg.exe is already up to date with this checkout.
          C:\vcpkg\bootstrap-vcpkg.bat
        shell: pwsh

      # Cache of the already-built packages themselves. Keyed on the
      # manifest file's hash (see "Write vcpkg package manifest" above),
      # with a prefix restore-key fallback: even after the package list
      # changes, a near-miss still restores most of the tree, and `vcpkg
      # install` only builds what's actually missing rather than starting
      # from zero.
      - name: Restore vcpkg installed-packages cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-installed-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg-packages.txt') }}
          restore-keys: |
            vcpkg-installed-${{ env.VCPKG_TRIPLET }}-

      - name: Install dependencies via vcpkg
        run: |
          $packages = Get-Content vcpkg-packages.txt | Where-Object { $_.Trim() -ne '' }
          C:\vcpkg\vcpkg.exe install @packages --triplet $env:VCPKG_TRIPLET
        shell: pwsh

      - name: Point pkg-config / PATH at vcpkg
        run: |
          $vcpkgInstalled = "C:\vcpkg\installed\$env:VCPKG_TRIPLET"
          echo "PKG_CONFIG_PATH=$vcpkgInstalled\lib\pkgconfig" >> $env:GITHUB_ENV
          echo "$vcpkgInstalled\tools\pkgconf" >> $env:GITHUB_PATH
          echo "$vcpkgInstalled\bin" >> $env:GITHUB_PATH
        shell: pwsh

      # ---------------------------------------------------------------
      # Known wscript version-pin mismatches between stock Ardour and
      # current vcpkg package versions (per the Ardour MSVC build thread).
      # DELETE this step if your fork's MSVCMixbus3 / MSVCardour3 /
      # msvc_extra_headers setup already accounts for this.
      # ---------------------------------------------------------------
      - name: Patch wscript library version pins
        run: |
          (Get-Content wscript) `
            -replace 'glibmm-2\.4','glibmm-2.68' `
            -replace 'giomm-2\.4','giomm-2.68' `
            | Set-Content wscript
          (Get-Content libs/tk/ztkmm/wscript) `
            -replace 'sigc\+\+-2\.0','sigc++-3.0' `
            | Set-Content libs/tk/ztkmm/wscript
          (Get-Content libs/tk/ydkmm/wscript) `
            -replace 'cairomm-1\.0','cairomm-1.16' `
            -replace 'pangomm-1\.4','pangomm-2.48' `
            | Set-Content libs/tk/ydkmm/wscript
        shell: pwsh

      # --dist-target defaults to 'auto', which on Windows resolves to a
      # bare CPU-architecture string (e.g. 'x86_64'), never to 'msvc'.
      # wscript only skips its POSIX-only dlopen/dlfcn.h probe (and several
      # other Windows-specific code paths — MSVC tool loading, pthreadVC3
      # linkage, the portaudio backend) when dist_target is exactly 'msvc'.
      - name: waf configure
        run: python waf configure --dist-target=msvc --prefix="$env:INSTALL_DIR" --optimize
        shell: pwsh

      # -j scales to whatever the runner actually has instead of a
      # hardcoded guess, so this stays correct if you ever move to a
      # larger/self-hosted runner.
      - name: waf build
        run: python waf build -j $env:NUMBER_OF_PROCESSORS
        shell: pwsh

      - name: waf install
        run: python waf install
        shell: pwsh

      # Ardour's .exe won't find its runtime DLLs unless vcpkg's own
      # bin folder is copied alongside the installed binaries.
      - name: Bundle runtime DLLs
        run: |
          Copy-Item "C:\vcpkg\installed\$env:VCPKG_TRIPLET\bin\*.dll" -Destination "$env:INSTALL_DIR" -Force
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ardour-windows-msvc-${{ github.run_number }}
          path: ${{ env.INSTALL_DIR }}
          retention-days: 14
