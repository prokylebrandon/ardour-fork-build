name: Build Ardour (Windows / MSVC)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "waf build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

      vcpkg_ref:
        description: "Optional vcpkg commit/tag to pin"
        required: false
        default: ""
        type: string

env:
  VCPKG_HOME: C:\vcpkg
  VCPKG_ROOT: C:\vcpkg
  VCPKG_TRIPLET: x64-windows
  INSTALL_DIR: ${{ github.workspace }}\dist

jobs:
  build:
    name: Build Ardour
    runs-on: windows-2022

    steps:
      # ------------------------------------------------------------
      # Checkout Ardour
      # ------------------------------------------------------------
      - name: Checkout Ardour
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          submodules: recursive

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------
      # MSVC
      # ------------------------------------------------------------
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ------------------------------------------------------------
      # LLVM
      # ------------------------------------------------------------
      - name: Setup LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"
          directory: ${{ runner.temp }}\llvm

      # ------------------------------------------------------------
      # Perl
      # ------------------------------------------------------------
      - name: Add Strawberry Perl to PATH
        shell: pwsh
        run: |
          $perl = "C:\Strawberry\perl\bin"
          $cbin = "C:\Strawberry\c\bin"

          if (Test-Path $perl) {
            Add-Content $env:GITHUB_PATH $perl
          }

          if (Test-Path $cbin) {
            Add-Content $env:GITHUB_PATH $cbin
          }

      # ------------------------------------------------------------
      # Fetch official Ardour tags
      # ------------------------------------------------------------
      - name: Fetch Ardour upstream tags
        shell: pwsh
        run: |
          git remote remove upstream 2>$null

          git remote add upstream https://github.com/Ardour/ardour.git

          git fetch upstream --tags --force --prune

          Write-Host "Git version:"
          git describe HEAD

      # ------------------------------------------------------------
      # Cache vcpkg
      # ------------------------------------------------------------
      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg
          key: windows-2022-vcpkg-${{ runner.arch }}-${{ hashFiles('**/InstallDependencies.vcpkg.py') }}

      # ------------------------------------------------------------
      # Install standalone vcpkg
      # ------------------------------------------------------------
      - name: Install vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if (Test-Path "C:\vcpkg") {
            Remove-Item "C:\vcpkg" -Recurse -Force
          }

          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg

          Set-Location C:\vcpkg

          .\bootstrap-vcpkg.bat -disableMetrics

      # ------------------------------------------------------------
      # Optional vcpkg pin
      # ------------------------------------------------------------
      - name: Pin vcpkg revision
        if: inputs.vcpkg_ref != ''
        shell: pwsh
        run: |
          Set-Location C:\vcpkg

          git fetch --all --tags

          git checkout "${{ inputs.vcpkg_ref }}"

          .\bootstrap-vcpkg.bat -disableMetrics

      # ------------------------------------------------------------
      # Verify vcpkg environment
      # ------------------------------------------------------------
      - name: Verify vcpkg
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"

          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "VCPKG_HOME=$env:VCPKG_HOME"
          Write-Host "VCPKG_TRIPLET=$env:VCPKG_TRIPLET"

          if (-not (Test-Path "C:\vcpkg\vcpkg.exe")) {
            Write-Error "C:\vcpkg\vcpkg.exe does not exist."
            exit 1
          }

          & "C:\vcpkg\vcpkg.exe" version

          if ($LASTEXITCODE -ne 0) {
            Write-Error "vcpkg version command failed."
            exit $LASTEXITCODE
          }

      # ------------------------------------------------------------
      # Download dependency helper
      # ------------------------------------------------------------
      - name: Download Ardour MSVC dependency helper
        shell: pwsh
        run: |
          $helper = "$env:RUNNER_TEMP\InstallDependencies.vcpkg.py"

          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/EZ4Stephen/testardourdeps/main/vcpkg-build/InstallDependencies.vcpkg.py" `
            -OutFile $helper

          if (-not (Test-Path $helper)) {
            Write-Error "Dependency helper was not downloaded."
            exit 1
          }

          Write-Host "Downloaded:"
          Write-Host $helper

      # ------------------------------------------------------------
      # Patch dependency helper
      #
      # 1. Force it to use C:\vcpkg
      # 2. Remove shell=True from subprocess.run()
      # ------------------------------------------------------------
      - name: Patch dependency helper
        shell: pwsh
        run: |
          $file = "$env:RUNNER_TEMP\InstallDependencies.vcpkg.py"

          $text = Get-Content $file -Raw

          # Force the helper to use our standalone vcpkg.
          $oldVcpkg = '_vcpkg_dir = _script_dir / "vcpkg"'
          $newVcpkg = '_vcpkg_dir = Path(r"C:\vcpkg")'

          if ($text.Contains($oldVcpkg)) {
            $text = $text.Replace($oldVcpkg, $newVcpkg)
          }
          elseif (-not $text.Contains($newVcpkg)) {
            Write-Error "Could not find the helper's vcpkg directory definition."
            exit 1
          }

          # Use normal subprocess execution rather than shell=True.
          #
          # The upstream helper currently does:
          #
          #   subprocess.run(cmd, cwd=cwd, shell=True)
          #
          # while cmd is a list. On Windows this can cause command
          # parsing/path handling problems.
          $oldRun = 'result = subprocess.run(cmd, cwd=cwd, shell=True)'
          $newRun = 'result = subprocess.run(cmd, cwd=cwd)'

          if ($text.Contains($oldRun)) {
            $text = $text.Replace($oldRun, $newRun)
          }
          elseif (-not $text.Contains($newRun)) {
            Write-Error "Could not find the helper subprocess invocation."
            exit 1
          }

          Set-Content `
            -Path $file `
            -Value $text `
            -Encoding UTF8

          Write-Host ""
          Write-Host "Dependency helper patched successfully."
          Write-Host ""

          Write-Host "Relevant configuration:"
          $text -split "`n" |
            Select-String -Pattern "_vcpkg_dir|subprocess.run" |
            ForEach-Object {
              Write-Host $_.Line
            }

      # ------------------------------------------------------------
      # Install Ardour dependencies
      # ------------------------------------------------------------
      - name: Install Ardour dependencies
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows
        run: |
          $ErrorActionPreference = "Stop"

          $env:VCPKG_ROOT = "C:\vcpkg"

          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"

          if (-not (Test-Path "C:\vcpkg\vcpkg.exe")) {
            Write-Error "vcpkg.exe is missing."
            exit 1
          }

          python "$env:RUNNER_TEMP\InstallDependencies.vcpkg.py"

      # ------------------------------------------------------------
      # Ensure pkgconf is available
      # ------------------------------------------------------------
      - name: Configure pkg-config
        shell: pwsh
        run: |
          $pkgconfDir = "C:\vcpkg\installed\x64-windows\tools\pkgconf"
          $pkgconfExe = Join-Path $pkgconfDir "pkgconf.exe"
          $pkgconfigExe = Join-Path $pkgconfDir "pkg-config.exe"

          if (-not (Test-Path $pkgconfExe)) {
            Write-Error "pkgconf.exe was not installed."
            exit 1
          }

          if (-not (Test-Path $pkgconfigExe)) {
            Copy-Item $pkgconfExe $pkgconfigExe
          }

          Add-Content $env:GITHUB_PATH $pkgconfDir

          $pcPath = "C:\vcpkg\installed\x64-windows\lib\pkgconfig"

          Add-Content $env:GITHUB_ENV "PKG_CONFIG_PATH=$pcPath"

          Write-Host "pkg-config directory:"
          Write-Host $pkgconfDir

          Write-Host ""
          Write-Host "pkg-config version:"
          & $pkgconfigExe --version

      # ------------------------------------------------------------
      # Configure include paths
      # ------------------------------------------------------------
      - name: Configure MSVC include paths
        shell: pwsh
        run: |
          $installed = "C:\vcpkg\installed\x64-windows"

          $includeDirs = @(
            "$installed\include",
            "$installed\include\glib-2.0",
            "$installed\lib\glib-2.0\include",
            "$installed\include\libxml2",
            "$installed\include\libusb-1.0",
            "$installed\include\pthread",
            "$installed\include\glibmm-2.4",
            "$installed\lib\glibmm-2.4\include",
            "$installed\include\giomm-2.4",
            "$installed\include\sigc++-3.0",
            "$installed\lib\sigc++-3.0\include",
            "$installed\include\sigc++-2.0",
            "$installed\lib\sigc++-2.0\include",
            "$installed\include\cairomm-1.0",
            "$installed\include\pangomm-2.48",
            "$installed\include\pango-1.0",
            "$installed\include\harfbuzz",
            "$installed\include\cairo",
            "$installed\include\pixman-1",
            "$installed\include\freetype2"
          )

          $packages = @(
            "glib-2.0",
            "glibmm-2.4",
            "gio-2.0",
            "giomm-2.4",
            "gthread-2.0",
            "libxml-2.0",
            "libusb-1.0",
            "sigc++-3.0",
            "cairo",
            "cairomm-1.0",
            "pango",
            "pangomm-2.48"
          )

          foreach ($pkg in $packages) {
            try {
              $result = & pkg-config --cflags-only-I $pkg 2>$null

              if ($LASTEXITCODE -eq 0 -and $result) {
                foreach ($token in ($result -split '\s+')) {
                  if ($token -match '^-I(.+)$') {
                    $path = $Matches[1].Trim('"')

                    if ($path -and (Test-Path $path)) {
                      $includeDirs += $path
                    }
                  }
                }
              }
            }
            catch {
              Write-Host "pkg-config lookup failed for $pkg"
            }
          }

          $includeDirs = $includeDirs |
            Where-Object { $_ -and (Test-Path $_) } |
            Sort-Object -Unique

          Write-Host ""
          Write-Host "MSVC include directories:"
          foreach ($dir in $includeDirs) {
            Write-Host "  $dir"
          }

          $flags = ($includeDirs | ForEach-Object {
            '/I"{0}"' -f $_
          }) -join ' '

          Add-Content $env:GITHUB_ENV "ARDOUR_EXTRA_INCLUDE_FLAGS=$flags"

          # Preserve Visual Studio's existing INCLUDE paths and append
          # the vcpkg paths rather than replacing them.
          $existingInclude = $env:INCLUDE

          if ($existingInclude) {
            $newInclude = "$existingInclude;$($includeDirs -join ';')"
          }
          else {
            $newInclude = $includeDirs -join ';'
          }

          Add-Content $env:GITHUB_ENV "INCLUDE=$newInclude"

          # Do not destroy MSVC defaults. Append vcpkg flags.
          $existingCFlags = $env:CFLAGS
          $existingCxxFlags = $env:CXXFLAGS

          if ($existingCFlags) {
            $finalCFlags = "$existingCFlags $flags"
          }
          else {
            $finalCFlags = $flags
          }

          if ($existingCxxFlags) {
            $finalCxxFlags = "$existingCxxFlags $flags"
          }
          else {
            $finalCxxFlags = $flags
          }

          Add-Content $env:GITHUB_ENV "CFLAGS=$finalCFlags"
          Add-Content $env:GITHUB_ENV "CXXFLAGS=$finalCxxFlags"

      # ------------------------------------------------------------
      # Verify required headers
      # ------------------------------------------------------------
      - name: Verify dependency headers
        shell: pwsh
        run: |
          $installed = "C:\vcpkg\installed\x64-windows"

          $headers = @(
            "$installed\include\glib-2.0\glib.h",
            "$installed\include\libxml2\libxml\parser.h",
            "$installed\include\libusb-1.0\libusb.h"
          )

          foreach ($header in $headers) {
            if (-not (Test-Path $header)) {
              Write-Error "Missing required header: $header"
              exit 1
            }

            Write-Host "Found: $header"
          }

      # ------------------------------------------------------------
      # Patch luasession getopt linkage
      # ------------------------------------------------------------
      - name: Patch luasession getopt linkage for MSVC
        shell: pwsh
        run: |
          $file = Join-Path $env:GITHUB_WORKSPACE "luasession\wscript"

          if (-not (Test-Path $file)) {
            Write-Error "Could not find luasession\wscript"
            exit 1
          }

          $text = Get-Content $file -Raw

          # Do not apply the patch twice.
          if ($text.Contains("../libs/pbd/msvc/getopt.c")) {
            Write-Host "getopt MSVC patch is already present."
            exit 0
          }

          $old = @"
          obj.source       = 'luasession.cc'
          obj.target       = 'luasession'
          "@

          $new = @"
          obj.source       = 'luasession.cc'

          if bld.env['build_target'] == 'msvc':
              obj.source += [
                  '../libs/pbd/msvc/getopt.c',
                  '../libs/pbd/msvc/getopt_long.c',
              ]

          obj.target       = 'luasession'
          "@

          if (-not $text.Contains($old)) {
            Write-Error "Expected luasession source block was not found."
            exit 1
          }

          $text = $text.Replace($old, $new)

          Set-Content `
            -Path $file `
            -Value $text `
            -Encoding UTF8

          Write-Host "luasession getopt patch applied."

      # ------------------------------------------------------------
      # Configure Waf
      # ------------------------------------------------------------
      - name: Configure Ardour
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $args = @(
            "configure",
            "--prefix=$env:INSTALL_DIR",
            "--configdir=share",
            "--ptformat",
            "--dist-target=msvc",
            "--also-include=C:\vcpkg\installed\x64-windows\include",
            "--also-libdir=C:\vcpkg\installed\x64-windows\lib",
            "--cxx17",
            "--use-lld"
          )

          if ("${{ inputs.build_type }}" -eq "Release") {
            $args += "--optimize"
          }
          else {
            $args += "--debug"
          }

          Write-Host "Running:"
          Write-Host "python waf $($args -join ' ')"

          python waf @args

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build Ardour
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $jobs = [Environment]::ProcessorCount

          if ($jobs -gt 4) {
            $jobs = 4
          }

          Write-Host "Building with $jobs parallel jobs."

          python waf build -j $jobs

      # ------------------------------------------------------------
      # Install
      # ------------------------------------------------------------
      - name: Install Ardour
        shell: pwsh
        run: |
          python waf install

      # ------------------------------------------------------------
      # Show final output
      # ------------------------------------------------------------
      - name: Show build output
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "============================================"
          Write-Host "Ardour build output"
          Write-Host "============================================"
          Write-Host ""

          if (Test-Path "$env:INSTALL_DIR") {
            Get-ChildItem "$env:INSTALL_DIR" -Recurse -File |
              Select-Object FullName, Length |
              Format-Table -AutoSize
          }
          else {
            Write-Error "Install directory does not exist."
            exit 1
          }

      # ------------------------------------------------------------
      # Upload artifact
      # ------------------------------------------------------------
      - name: Upload Ardour artifact
        uses: actions/upload-artifact@v4
        with:
          name: ardour-windows-msvc-${{ inputs.build_type }}
          path: ${{ env.INSTALL_DIR }}
          if-no-files-found: error
          compression-level: 6