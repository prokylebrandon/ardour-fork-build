name: Build Ardour (Windows / MSVC)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "waf build type"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

      vcpkg_ref:
        description: "vcpkg commit/tag to pin (blank = latest)"
        required: false
        default: ""
        type: string

env:
  VCPKG_HOME: C:\vcpkg
  VCPKG_TRIPLET: x64-windows
  INSTALL_DIR: ${{ github.workspace }}\dist

jobs:
  build:
    runs-on: windows-2022

    steps:

      # ================================================================
      # 1. SOURCE
      # ================================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: recursive

      # ================================================================
      # 2. TOOLCHAIN
      # ================================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"

      - name: Ensure Strawberry Perl is on PATH
        shell: pwsh
        run: |
          if (Test-Path "C:\Strawberry\perl\bin") {
            "C:\Strawberry\perl\bin" | Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append
          }

      # ================================================================
      # 3. VCPKG TOOL CACHE
      # ================================================================
      - name: Restore vcpkg tool cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg
          key: vcpkg-tool-${{ runner.os }}-${{ inputs.vcpkg_ref != '' && inputs.vcpkg_ref || 'latest' }}
          restore-keys: |
            vcpkg-tool-${{ runner.os }}-

      # ================================================================
      # 4. SET UP STANDALONE VCPKG
      # ================================================================
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkg = "C:\vcpkg"

          Write-Host "Using standalone vcpkg at: $vcpkg"

          # Never trust the runner's VCPKG_ROOT environment variable.
          # Visual Studio may set it to its own bundled vcpkg.
          Remove-Item Env:VCPKG_ROOT -ErrorAction SilentlyContinue

          if (!(Test-Path "$vcpkg\.git")) {

            if (Test-Path $vcpkg) {
              Write-Host "Existing C:\vcpkg is not a Git repository. Removing it..."
              Remove-Item $vcpkg -Recurse -Force
            }

            Write-Host "Cloning standalone vcpkg..."
            git clone https://github.com/microsoft/vcpkg.git $vcpkg
          }

          Push-Location $vcpkg

          git fetch origin --tags --quiet

          if ("${{ inputs.vcpkg_ref }}" -ne "") {
            Write-Host "Checking out pinned vcpkg ref: ${{ inputs.vcpkg_ref }}"
            git checkout "${{ inputs.vcpkg_ref }}"
          }
          else {
            Write-Host "Using latest vcpkg master"
            git checkout master --quiet
            git pull --ff-only origin master
          }

          Pop-Location

          if (!(Test-Path "$vcpkg\bootstrap-vcpkg.bat")) {
            throw "bootstrap-vcpkg.bat was not found at $vcpkg"
          }

          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics

          if (!(Test-Path "$vcpkg\vcpkg.exe")) {
            throw "vcpkg.exe was not created."
          }

          Write-Host "vcpkg is ready."

      # ================================================================
      # 5. PACKAGE LIST
      # ================================================================
      - name: Write vcpkg package manifest
        shell: pwsh
        run: |
          @'
          boost
          glibmm
          libsigcpp
          cairomm
          pangomm
          libsndfile
          libsamplerate
          aubio
          taglib
          curl
          liblo
          fftw3
          libflac
          rubberband
          lilv
          serd
          sord
          sratom
          lv2
          pthreads
          portaudio
          '@ | Set-Content -Path vcpkg-packages.txt

      # ================================================================
      # 6. DEPENDENCY CACHE
      # ================================================================
      - name: Restore vcpkg dependency cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\downloads
          key: >-
            ardour-vcpkg-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-
            ${{ hashFiles('vcpkg-packages.txt') }}-
            ${{ inputs.vcpkg_ref != '' && inputs.vcpkg_ref || 'floating' }}
          restore-keys: |
            ardour-vcpkg-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-

      # ================================================================
      # 7. INSTALL DEPENDENCIES
      # ================================================================
      - name: Install dependencies via vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $packages = Get-Content vcpkg-packages.txt |
            Where-Object { $_.Trim() -ne "" }

          & "C:\vcpkg\vcpkg.exe" install @packages `
            --triplet $env:VCPKG_TRIPLET `
            --no-print-usage

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg dependency installation failed."
          }

      # ================================================================
      # 8. BUILD ENVIRONMENT
      # ================================================================
      - name: Configure build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installed = "C:\vcpkg\installed\$env:VCPKG_TRIPLET"
          $pkgconfDir = "$installed\tools\pkgconf"
          $pkgconfExe = "$pkgconfDir\pkgconf.exe"

          if (!(Test-Path $installed)) {
            throw "vcpkg installed directory not found: $installed"
          }

          Write-Host "vcpkg installed tree: $installed"

          # Make the path available to every later GitHub Actions step.
          "VCPKG_INSTALLED=$installed" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          # Compiler search paths.
          "INCLUDE=$installed\include;$env:INCLUDE" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "LIB=$installed\lib;$env:LIB" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          # pkg-config databases.
          "PKG_CONFIG_PATH=$installed\lib\pkgconfig;$installed\share\pkgconfig" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          # pkgconf.
          if (Test-Path $pkgconfExe) {
            "PKG_CONFIG=$pkgconfExe" |
              Out-File $env:GITHUB_ENV -Encoding utf8 -Append

            "$pkgconfDir" |
              Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          }
          else {
            Write-Warning "pkgconf.exe not found at $pkgconfExe"
          }

          "$installed\bin" |
            Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      # ================================================================
      # 9. VERIFY BOOST
      # ================================================================
      - name: Verify Boost
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:VCPKG_INSTALLED

          $requiredHeaders = @(
            "$root\include\boost\version.hpp",
            "$root\include\boost\ptr_container\ptr_list.hpp"
          )

          foreach ($header in $requiredHeaders) {
            if (!(Test-Path $header)) {
              throw "Missing Boost header: $header"
            }

            Write-Host "FOUND: $header"
          }

          Write-Host ""
          Write-Host "Boost version:"
          Select-String `
            -Path "$root\include\boost\version.hpp" `
            -Pattern "BOOST_VERSION"

          Write-Host ""
          Write-Host "Boost libraries:"
          Get-ChildItem "$root\lib" -Filter "*boost*.lib" |
            Select-Object -First 20 |
            ForEach-Object {
              Write-Host "  $($_.Name)"
            }

      # ================================================================
      # 10. DETECT GTKMM FAMILY
      # ================================================================
      - name: Detect library API versions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pc = $env:PKG_CONFIG

          if (!$pc -or !(Test-Path $pc)) {
            $pc = "pkg-config"
          }

          function Find-PkgName {
            param([string[]] $Candidates)

            foreach ($name in $Candidates) {
              $null = & $pc --exists $name 2>&1

              if ($LASTEXITCODE -eq 0) {
                return $name
              }
            }

            return $null
          }

          $glibmm  = Find-PkgName @("glibmm-2.68", "glibmm-2.4")
          $giomm   = Find-PkgName @("giomm-2.68", "giomm-2.4")
          $sigc    = Find-PkgName @("sigc++-3.0", "sigc++-2.0")
          $cairomm = Find-PkgName @("cairomm-1.16", "cairomm-1.0")
          $pangomm = Find-PkgName @("pangomm-2.48", "pangomm-1.4")

          Write-Host "Detected packages:"
          Write-Host "  glibmm  = $glibmm"
          Write-Host "  giomm   = $giomm"
          Write-Host "  sigc++  = $sigc"
          Write-Host "  cairomm = $cairomm"
          Write-Host "  pangomm = $pangomm"

          if (!$glibmm -or !$giomm -or !$sigc -or !$cairomm -or !$pangomm) {
            throw "One or more GTKmm-family pkg-config packages are missing."
          }

          # Top-level Ardour Waf script.
          $content = Get-Content wscript -Raw

          if ($glibmm -and $glibmm -ne "glibmm-2.4") {
            $content = $content -replace `
              [regex]::Escape("glibmm-2.4"), `
              $glibmm
          }

          if ($giomm -and $giomm -ne "giomm-2.4") {
            $content = $content -replace `
              [regex]::Escape("giomm-2.4"), `
              $giomm
          }

          Set-Content wscript $content -NoNewline

          if (Test-Path "libs/tk/ztkmm/wscript") {
            $ztk = Get-Content "libs/tk/ztkmm/wscript" -Raw

            if ($sigc -and $sigc -ne "sigc++-2.0") {
              $ztk = $ztk -replace `
                [regex]::Escape("sigc++-2.0"), `
                $sigc
            }

            Set-Content `
              "libs/tk/ztkmm/wscript" `
              $ztk `
              -NoNewline
          }

          if (Test-Path "libs/tk/ydkmm/wscript") {
            $ydk = Get-Content "libs/tk/ydkmm/wscript" -Raw

            if ($cairomm -and $cairomm -ne "cairomm-1.0") {
              $ydk = $ydk -replace `
                [regex]::Escape("cairomm-1.0"), `
                $cairomm
            }

            if ($pangomm -and $pangomm -ne "pangomm-1.4") {
              $ydk = $ydk -replace `
                [regex]::Escape("pangomm-1.4"), `
                $pangomm
            }

            Set-Content `
              "libs/tk/ydkmm/wscript" `
              $ydk `
              -NoNewline
          }

      # ================================================================
      # 11. PRE-CONFIGURE CHECK
      # ================================================================
      - name: Pre-configure dependency check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:VCPKG_INSTALLED
          $pc = $env:PKG_CONFIG

          if (!$pc -or !(Test-Path $pc)) {
            $pc = "pkg-config"
          }

          $failed = @()

          function Check-Header {
            param([string] $Path)

            if (Test-Path "$root\include\$Path") {
              Write-Host "OK header: $Path"
            }
            else {
              Write-Warning "MISSING header: $Path"
              $script:failed += "header: $Path"
            }
          }

          function Check-Pkg {
            param([string] $Name)

            $null = & $pc --exists $Name 2>&1

            if ($LASTEXITCODE -eq 0) {
              $version = (& $pc --modversion $Name 2>&1) -join ""
              Write-Host "OK pkg: $Name ($version)"
            }
            else {
              Write-Warning "MISSING pkg-config package: $Name"
              $script:failed += "pkg: $Name"
            }
          }

          Write-Host "=== Headers ==="

          Check-Header "boost/version.hpp"
          Check-Header "boost/ptr_container/ptr_list.hpp"
          Check-Header "glib.h"
          Check-Header "sndfile.h"
          Check-Header "samplerate.h"
          Check-Header "fftw3.h"
          Check-Header "FLAC/stream_encoder.h"
          Check-Header "lilv/lilv.h"
          Check-Header "lo/lo.h"
          Check-Header "portaudio.h"
          Check-Header "rubberband/RubberBandStretcher.h"
          Check-Header "aubio/aubio.h"
          Check-Header "pthread.h"

          Write-Host ""
          Write-Host "=== pkg-config ==="

          Check-Pkg "glib-2.0"
          Check-Pkg "sndfile"
          Check-Pkg "samplerate"
          Check-Pkg "fftw3"
          Check-Pkg "flac"
          Check-Pkg "lilv-0"
          Check-Pkg "rubberband"
          Check-Pkg "liblo"
          Check-Pkg "portaudio-2.0"
          Check-Pkg "aubio"

          if ($failed.Count -gt 0) {
            Write-Error "Dependency check failed:"
            $failed | ForEach-Object {
              Write-Error "  $_"
            }

            exit 1
          }

          Write-Host ""
          Write-Host "All pre-configure dependency checks passed."

      # ================================================================
      # 12. WAF CONFIGURE
      # ================================================================
      - name: waf configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installed = $env:VCPKG_INSTALLED

          $args = @(
            "waf",
            "configure",
            "--dist-target=msvc",
            "--prefix=$env:INSTALL_DIR",
            "--also-include=$installed\include",
            "--also-libdir=$installed\lib"
          )

          if ("${{ inputs.build_type }}" -eq "Release") {
            $args += "--optimize"
          }
          else {
            $args += "--debug"
          }

          Write-Host "Running:"
          Write-Host "python $($args -join ' ')"

          python @args

      # ================================================================
      # 13. CONFIGURE LOGS
      # ================================================================
      - name: Upload configure logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: configure-logs-${{ github.run_number }}
          path: |
            ${{ github.workspace }}\build\config.log
            ${{ github.workspace }}\build\config.errors
          if-no-files-found: warn
          retention-days: 14

      # ================================================================
      # 14. BUILD
      # ================================================================
      - name: waf build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $jobs = [Environment]::ProcessorCount

          Write-Host "Building with $jobs parallel jobs."

          python waf build -j $jobs

      # ================================================================
      # 15. BUILD LOGS
      # ================================================================
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            ${{ github.workspace }}\build
          if-no-files-found: warn
          retention-days: 14

      # ================================================================
      # 16. INSTALL
      # ================================================================
      - name: waf install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python waf install

      # ================================================================
      # 17. BUNDLE DLLS
      # ================================================================
      - name: Bundle runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgBin = "$env:VCPKG_INSTALLED\bin"
          $install = $env:INSTALL_DIR

          if (!(Test-Path $vcpkgBin)) {
            throw "vcpkg runtime directory not found: $vcpkgBin"
          }

          $executables = Get-ChildItem `
            -Path $install `
            -Recurse `
            -Filter "*.exe" `
            -File

          if ($executables.Count -eq 0) {
            throw "No executable was installed under $install"
          }

          $dirs = $executables |
            Select-Object -ExpandProperty DirectoryName -Unique

          $dlls = Get-ChildItem `
            -Path $vcpkgBin `
            -Filter "*.dll" `
            -File

          if ($dlls.Count -eq 0) {
            throw "No vcpkg DLLs found in $vcpkgBin"
          }

          foreach ($dir in $dirs) {
            Write-Host "Bundling $($dlls.Count) DLLs -> $dir"

            Copy-Item `
              -Path $dlls.FullName `
              -Destination $dir `
              -Force
          }

      # ================================================================
      # 18. VALIDATE
      # ================================================================
      - name: Validate build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $executables = Get-ChildItem `
            -Path $env:INSTALL_DIR `
            -Recurse `
            -Filter "*.exe" `
            -File

          if ($executables.Count -eq 0) {
            throw "No Ardour executable was found."
          }

          Write-Host "Installed executables:"
          $executables | ForEach-Object {
            Write-Host "  $($_.FullName)"
          }

          Write-Host ""
          Write-Host "Build validation passed."

      # ================================================================
      # 19. ARTIFACT
      # ================================================================
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ardour-windows-msvc-${{ inputs.build_type }}-${{ github.run_number }}
          path: ${{ env.INSTALL_DIR }}
          if-no-files-found: error
          retention-days: 14
