name: Build Ardour (Windows / MSVC)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "waf build type"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

      vcpkg_ref:
        description: "vcpkg commit/tag to pin (blank = latest master)"
        required: false
        default: ""
        type: string

env:
  # Use our own standalone vcpkg. Do not use VCPKG_ROOT because
  # Visual Studio on the GitHub runner already defines that variable.
  VCPKG_HOME: C:\vcpkg
  VCPKG_TRIPLET: x64-windows
  INSTALL_DIR: ${{ github.workspace }}\dist

jobs:
  build:
    runs-on: windows-2022

    steps:

      # ================================================================
      # 1. SOURCE
      # ================================================================
      - name: Checkout Ardour
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: recursive

      # ================================================================
      # 2. TOOLCHAIN
      # ================================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"

      - name: Ensure Strawberry Perl is on PATH
        shell: pwsh
        run: |
          if (Test-Path "C:\Strawberry\perl\bin") {
            "C:\Strawberry\perl\bin" |
              Out-File `
                -FilePath $env:GITHUB_PATH `
                -Encoding utf8 `
                -Append
          }

      # ================================================================
      # 3. VCPKG TOOL CACHE
      # ================================================================
      - name: Restore vcpkg tool cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg
          key: >-
            ardour-vcpkg-tool-${{ runner.os }}-
            ${{ inputs.vcpkg_ref != '' && inputs.vcpkg_ref || 'latest' }}
          restore-keys: |
            ardour-vcpkg-tool-${{ runner.os }}-

      # ================================================================
      # 4. STANDALONE VCPKG
      # ================================================================
      - name: Set up standalone vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Do not let Visual Studio's bundled vcpkg interfere.
          Remove-Item Env:VCPKG_ROOT -ErrorAction SilentlyContinue

          $vcpkg = $env:VCPKG_HOME

          Write-Host "Using standalone vcpkg: $vcpkg"

          if (!(Test-Path "$vcpkg\.git")) {

            if (Test-Path $vcpkg) {
              Write-Host "C:\vcpkg exists but is not a Git repository."
              Write-Host "Removing it..."

              Remove-Item `
                -Path $vcpkg `
                -Recurse `
                -Force
            }

            git clone `
              https://github.com/microsoft/vcpkg.git `
              $vcpkg
          }

          Push-Location $vcpkg

          git fetch origin --tags --quiet

          if ("${{ inputs.vcpkg_ref }}" -ne "") {
            Write-Host "Using pinned vcpkg ref: ${{ inputs.vcpkg_ref }}"

            git checkout "${{ inputs.vcpkg_ref }}"
          }
          else {
            Write-Host "Using latest vcpkg master"

            git checkout master --quiet
            git pull --ff-only origin master
          }

          Pop-Location

          if (!(Test-Path "$vcpkg\bootstrap-vcpkg.bat")) {
            throw "bootstrap-vcpkg.bat not found at $vcpkg"
          }

          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics

          if (!(Test-Path "$vcpkg\vcpkg.exe")) {
            throw "vcpkg.exe was not created."
          }

          Write-Host "Standalone vcpkg is ready."

      # ================================================================
      # 5. DEPENDENCY CACHE
      # ================================================================
      - name: Restore vcpkg dependency cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\downloads
            C:\vcpkg\buildtrees
          key: >-
            ardour-deps-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-
            ${{ inputs.vcpkg_ref != '' && inputs.vcpkg_ref || 'floating' }}
          restore-keys: |
            ardour-deps-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-

      # ================================================================
      # 6. ARDOUR MSVC DEPENDENCY HELPER
      # ================================================================
      - name: Download Ardour dependency helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://raw.githubusercontent.com/EZ4Stephen/testardourdeps/main/vcpkg-build/InstallDependencies.vcpkg.py"
          $file = "$env:GITHUB_WORKSPACE\InstallDependencies.vcpkg.py"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $file

          if (!(Test-Path $file)) {
            throw "Failed to download Ardour dependency helper."
          }

          Write-Host "Downloaded Ardour dependency helper."

      # ================================================================
      # 7. USE OUR C:\VCPKG
      # ================================================================
      - name: Configure dependency helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "$env:GITHUB_WORKSPACE\InstallDependencies.vcpkg.py"

          $text = Get-Content `
            -Path $file `
            -Raw

          # The published helper expects a vcpkg checkout next to itself.
          # Replace ONLY that path with our standalone cached vcpkg.
          $old = '_vcpkg_dir = _script_dir / "vcpkg"'
          $new = '_vcpkg_dir = Path(r"C:\vcpkg")'

          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
          }
          else {
            Write-Host "Helper already appears to use an external vcpkg path."
          }

          Set-Content `
            -Path $file `
            -Value $text `
            -Encoding utf8

      # ================================================================
      # 8. INSTALL ARDOUR DEPENDENCIES
      # ================================================================
      - name: Install Ardour dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python "$env:GITHUB_WORKSPACE\InstallDependencies.vcpkg.py"

          if (!(Test-Path "$env:VCPKG_HOME\installed\$env:VCPKG_TRIPLET")) {
            throw "Expected vcpkg installed tree was not created."
          }

          Write-Host "Ardour dependency helper completed."

      # ================================================================
      # 9. CONFIGURE VCPKG ENVIRONMENT
      # ================================================================
      - name: Configure vcpkg environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installed = "$env:VCPKG_HOME\installed\$env:VCPKG_TRIPLET"
          $pkgconfDir = "$installed\tools\pkgconf"
          $pkgconfExe = "$pkgconfDir\pkgconf.exe"

          if (!(Test-Path $installed)) {
            throw "Installed vcpkg tree does not exist: $installed"
          }

          if (!(Test-Path $pkgconfExe)) {
            throw "pkgconf.exe not found: $pkgconfExe"
          }

          "VCPKG_INSTALLED=$installed" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          # vcpkg first.
          "INCLUDE=$installed\include;$env:INCLUDE" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "LIB=$installed\lib;$env:LIB" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "PKG_CONFIG_PATH=$installed\lib\pkgconfig;$installed\share\pkgconfig" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "PKG_CONFIG=$pkgconfExe" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "$pkgconfDir" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          "$installed\bin" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

      # ================================================================
      # 10. SELF-HEAL KNOWN MISSING VCPKG PACKAGES
      # ================================================================
      # This does NOT install random packages based on arbitrary words
      # in a Waf error. Instead it checks the known Ardour MSVC package
      # set and installs missing ports automatically.
      #
      # The Ardour MSVC documentation lists this family of packages,
      # including aubio[core], libarchive, vamp-sdk, libusb, jack2,
      # web sockets, multiple Boost components, etc.
      # ================================================================
      - name: Self-heal missing dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkg = "$env:VCPKG_HOME\vcpkg.exe"
          $triplet = $env:VCPKG_TRIPLET

          $packages = @(
            "boost-ptr-container",
            "boost-uuid",
            "boost-tokenizer",
            "boost-multiprecision",
            "boost-pool",
            "boost-algorithm",
            "boost-property-tree",
            "boost-multi-array",
            "glib",
            "libsndfile",
            "curl",
            "libarchive",
            "liblo",
            "taglib",
            "vamp-sdk",
            "libusb",
            "rubberband",
            "jack2",
            "pthreads",
            "fftw3[threads]",
            "aubio[core]",
            "libpng",
            "pango",
            "lv2",
            "libxml2",
            "cppunit",
            "libwebsockets",
            "portaudio[asio]",
            "libsamplerate",
            "serd",
            "sord",
            "sratom",
            "lilv",
            "getopt"
          )

          Write-Host "Checking the Ardour MSVC dependency package set..."

          # Ask vcpkg which packages are already installed.
          $installedList = & $vcpkg list

          $missingPorts = @()

          foreach ($package in $packages) {

            # Strip feature syntax for the package-name lookup.
            $base = $package.Split("[")[0]

            $found = $false

            foreach ($line in $installedList) {
              if ($line -match "^\s*$base") {
                $found = $true
                break
              }
            }

            if ($found) {
              Write-Host "OK      $package"
            }
            else {
              Write-Warning "MISSING $package"
              $missingPorts += $package
            }
          }

          if ($missingPorts.Count -gt 0) {

            Write-Host ""
            Write-Host "Installing missing packages:"
            $missingPorts | ForEach-Object {
              Write-Host "  $_"
            }

            & $vcpkg install `
              @missingPorts `
              --triplet $triplet `
              --no-print-usage

            if ($LASTEXITCODE -ne 0) {
              throw "Automatic installation of one or more missing vcpkg packages failed."
            }

            Write-Host "Missing package installation completed."
          }
          else {
            Write-Host "All known Ardour MSVC vcpkg packages are already installed."
          }

      # ================================================================
      # 11. RUN ARDOUR HELPER AGAIN
      # ================================================================
      # This matters because the helper creates/fixes metadata such as
      # aubio.pc and other Windows-specific dependency details.
      # ================================================================
      - name: Re-apply Ardour dependency fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python "$env:GITHUB_WORKSPACE\InstallDependencies.vcpkg.py"

          Write-Host "Ardour dependency fixes re-applied."

      # ================================================================
      # 12. VERIFY DEPENDENCIES
      # ================================================================
      - name: Verify dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:VCPKG_INSTALLED
          $pc = $env:PKG_CONFIG

          if (!$pc -or !(Test-Path $pc)) {
            throw "PKG_CONFIG is not valid: $pc"
          }

          function Require-Header {
            param([string]$Path)

            $full = "$root\include\$Path"

            if (Test-Path $full) {
              Write-Host "OK HEADER  $Path"
            }
            else {
              throw "Missing required header: $Path"
            }
          }

          function Require-Pkg {
            param([string]$Name)

            $null = & $pc --exists $Name 2>&1

            if ($LASTEXITCODE -eq 0) {
              $version = (& $pc --modversion $Name 2>&1) -join ""
              Write-Host "OK PKG     $Name ($version)"
            }
            else {
              throw "Missing required pkg-config package: $Name"
            }
          }

          Write-Host ""
          Write-Host "=== Core headers ==="

          Require-Header "boost/version.hpp"
          Require-Header "boost/ptr_container/ptr_list.hpp"
          Require-Header "sndfile.h"
          Require-Header "samplerate.h"
          Require-Header "fftw3.h"
          Require-Header "FLAC/stream_encoder.h"
          Require-Header "lo/lo.h"
          Require-Header "portaudio.h"
          Require-Header "rubberband/RubberBandStretcher.h"
          Require-Header "aubio/aubio.h"
          Require-Header "pthread.h"

          Write-Host ""
          Write-Host "=== Core pkg-config packages ==="

          Require-Pkg "glib-2.0"
          Require-Pkg "sndfile"
          Require-Pkg "samplerate"
          Require-Pkg "fftw3"
          Require-Pkg "flac"
          Require-Pkg "lilv-0"
          Require-Pkg "rubberband"
          Require-Pkg "liblo"
          Require-Pkg "portaudio-2.0"
          Require-Pkg "aubio"

          Write-Host ""
          Write-Host "=== GTKmm-compatible packages ==="

          Require-Pkg "glibmm-2.4"
          Require-Pkg "giomm-2.4"
          Require-Pkg "sigc++-2.0"
          Require-Pkg "cairomm-1.0"
          Require-Pkg "pangomm-1.4"

          Write-Host ""
          Write-Host "All dependency verification checks passed."

      # ================================================================
      # 13. DETECT GTKMM PACKAGE NAMES
      # ================================================================
      - name: Detect GTKmm package names
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pc = $env:PKG_CONFIG

          function Find-PackageName {
            param([string[]]$Candidates)

            foreach ($name in $Candidates) {
              $null = & $pc --exists $name 2>&1

              if ($LASTEXITCODE -eq 0) {
                return $name
              }
            }

            return $null
          }

          $glibmm = Find-PackageName @(
            "glibmm-2.4",
            "glibmm-2.68"
          )

          $giomm = Find-PackageName @(
            "giomm-2.4",
            "giomm-2.68"
          )

          $sigc = Find-PackageName @(
            "sigc++-2.0",
            "sigc++-3.0"
          )

          $cairomm = Find-PackageName @(
            "cairomm-1.0",
            "cairomm-1.16"
          )

          $pangomm = Find-PackageName @(
            "pangomm-1.4",
            "pangomm-2.48"
          )

          Write-Host "glibmm : $glibmm"
          Write-Host "giomm  : $giomm"
          Write-Host "sigc++ : $sigc"
          Write-Host "cairomm: $cairomm"
          Write-Host "pangomm: $pangomm"

          if (!$glibmm -or !$giomm -or !$sigc -or !$cairomm -or !$pangomm) {
            throw "Unable to resolve the GTKmm dependency names."
          }

          # Top-level Waf.
          $wscript = Get-Content "wscript" -Raw

          if ($glibmm -ne "glibmm-2.4") {
            $wscript = $wscript -replace `
              [regex]::Escape("glibmm-2.4"), `
              $glibmm
          }

          if ($giomm -ne "giomm-2.4") {
            $wscript = $wscript -replace `
              [regex]::Escape("giomm-2.4"), `
              $giomm
          }

          Set-Content `
            "wscript" `
            $wscript `
            -NoNewline

          # ztkmm.
          if (Test-Path "libs/tk/ztkmm/wscript") {
            $ztk = Get-Content "libs/tk/ztkmm/wscript" -Raw

            if ($sigc -ne "sigc++-2.0") {
              $ztk = $ztk -replace `
                [regex]::Escape("sigc++-2.0"), `
                $sigc
            }

            Set-Content `
              "libs/tk/ztkmm/wscript" `
              $ztk `
              -NoNewline
          }

          # ydkmm.
          if (Test-Path "libs/tk/ydkmm/wscript") {
            $ydk = Get-Content "libs/tk/ydkmm/wscript" -Raw

            if ($cairomm -ne "cairomm-1.0") {
              $ydk = $ydk -replace `
                [regex]::Escape("cairomm-1.0"), `
                $cairomm
            }

            if ($pangomm -ne "pangomm-1.4") {
              $ydk = $ydk -replace `
                [regex]::Escape("pangomm-1.4"), `
                $pangomm
            }

            Set-Content `
              "libs/tk/ydkmm/wscript" `
              $ydk `
              -NoNewline
          }

      # ================================================================
      # 14. WAF CONFIGURE
      # ================================================================
      - name: waf configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installed = $env:VCPKG_INSTALLED

          $args = @(
            "configure",
            "--prefix=$env:INSTALL_DIR",
            "--configdir=share",
            "--dist-target=msvc",
            "--also-include=$installed\include",
            "--also-include=$installed\include\pthread",
            "--also-libdir=$installed\lib",
            "--cxx17"
          )

          if ("${{ inputs.build_type }}" -eq "Release") {
            $args += "--optimize"
          }
          else {
            $args += "--debug"
          }

          Write-Host "Running:"
          Write-Host "python waf $($args -join ' ')"

          python waf @args

      # ================================================================
      # 15. CONFIGURE LOGS
      # ================================================================
      - name: Upload configure logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ardour-config-${{ github.run_number }}
          path: |
            ${{ github.workspace }}\build\config.log
            ${{ github.workspace }}\build\config.summary
            ${{ github.workspace }}\build\config.errors
          if-no-files-found: warn
          retention-days: 14

      # ================================================================
      # 16. BUILD
      # ================================================================
      - name: waf build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $jobs = [Environment]::ProcessorCount

          Write-Host "Building with $jobs parallel jobs."

          python waf build -j $jobs

      # ================================================================
      # 17. BUILD LOGS
      # ================================================================
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ardour-build-${{ github.run_number }}
          path: |
            ${{ github.workspace }}\build
          if-no-files-found: warn
          retention-days: 14

      # ================================================================
      # 18. INSTALL
      # ================================================================
      - name: waf install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python waf install

      # ================================================================
      # 19. BUNDLE DLLS
      # ================================================================
      - name: Bundle runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgBin = "$env:VCPKG_INSTALLED\bin"
          $installRoot = "$env:INSTALL_DIR"

          if (!(Test-Path $vcpkgBin)) {
            throw "vcpkg runtime directory not found: $vcpkgBin"
          }

          $executables = Get-ChildItem `
            -Path $installRoot `
            -Recurse `
            -Filter "*.exe" `
            -File

          if ($executables.Count -eq 0) {
            throw "No executable files were installed."
          }

          $dlls = Get-ChildItem `
            -Path $vcpkgBin `
            -Filter "*.dll" `
            -File

          if ($dlls.Count -eq 0) {
            throw "No vcpkg runtime DLLs were found."
          }

          $directories = $executables |
            Select-Object `
              -ExpandProperty DirectoryName `
              -Unique

          foreach ($directory in $directories) {
            Write-Host "Copying $($dlls.Count) DLLs to $directory"

            Copy-Item `
              -Path $dlls.FullName `
              -Destination $directory `
              -Force
          }

      # ================================================================
      # 20. VALIDATE
      # ================================================================
      - name: Validate installed build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $executables = Get-ChildItem `
            -Path $env:INSTALL_DIR `
            -Recurse `
            -Filter "*.exe" `
            -File

          if ($executables.Count -eq 0) {
            throw "No executable was found after installation."
          }

          Write-Host ""
          Write-Host "Installed executables:"

          $executables | ForEach-Object {
            Write-Host "  $($_.FullName)"
          }

          Write-Host ""
          Write-Host "Ardour build validation passed."

      # ================================================================
      # 21. ARTIFACT
      # ================================================================
      - name: Upload Ardour artifact
        uses: actions/upload-artifact@v4
        with:
          name: ardour-windows-msvc-${{ inputs.build_type }}-${{ github.run_number }}
          path: ${{ env.INSTALL_DIR }}
          if-no-files-found: error
          retention-days: 14
