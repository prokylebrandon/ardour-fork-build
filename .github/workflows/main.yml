name: Build Ardour (Windows / MSVC)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

      vcpkg_ref:
        description: "Optional vcpkg commit/tag. Leave blank for latest."
        required: false
        default: ""
        type: string

env:
  VCPKG_HOME: C:\vcpkg
  VCPKG_ROOT: C:\vcpkg
  VCPKG_TRIPLET: x64-windows
  INSTALL_DIR: ${{ github.workspace }}\dist

jobs:
  build:
    runs-on: windows-2022

    steps:
      # ------------------------------------------------------------
      # Checkout Ardour
      # ------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          submodules: recursive

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------
      # MSVC
      # ------------------------------------------------------------
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ------------------------------------------------------------
      # LLVM
      # ------------------------------------------------------------
      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"
          directory: ${{ runner.temp }}/llvm

      # ------------------------------------------------------------
      # Perl
      # ------------------------------------------------------------
      - name: Add Strawberry Perl to PATH
        shell: powershell
        run: |
          $perlPaths = @(
            "C:\Strawberry\perl\bin",
            "C:\Strawberry\c\bin"
          )

          foreach ($path in $perlPaths) {
            if (Test-Path $path) {
              Add-Content $env:GITHUB_PATH $path
            }
          }

          perl --version

      # ------------------------------------------------------------
      # vcpkg cache
      # ------------------------------------------------------------
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg
            C:\Users\runneradmin\AppData\Local\vcpkg
          key: >-
            windows-2022-vcpkg-${{ runner.arch }}-${{ hashFiles('**/vcpkg.json') }}-${{
              github.event.inputs.vcpkg_ref
            }}
          restore-keys: |
            windows-2022-vcpkg-${{ runner.arch }}-

      # ------------------------------------------------------------
      # Install / bootstrap vcpkg
      # ------------------------------------------------------------
      - name: Prepare vcpkg
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgRoot = "C:\vcpkg"
          $vcpkgExe = "$vcpkgRoot\vcpkg.exe"

          New-Item -ItemType Directory -Force -Path $vcpkgRoot | Out-Null

          if (-not (Test-Path $vcpkgExe)) {
            Write-Host "vcpkg.exe not found. Cloning vcpkg..."

            if (Test-Path "$vcpkgRoot\.git") {
              Push-Location $vcpkgRoot
              git fetch --all --tags --force
              Pop-Location
            }
            else {
              Remove-Item -Recurse -Force $vcpkgRoot -ErrorAction SilentlyContinue

              git clone `
                --depth=1 `
                https://github.com/microsoft/vcpkg.git `
                $vcpkgRoot
            }

            Push-Location $vcpkgRoot

            if (Test-Path ".\bootstrap-vcpkg.bat") {
              & .\bootstrap-vcpkg.bat -disableMetrics
            }
            else {
              throw "bootstrap-vcpkg.bat was not found."
            }

            Pop-Location
          }

          if ("${{ github.event.inputs.vcpkg_ref }}" -ne "") {
            Write-Host "Pinning vcpkg to ${{ github.event.inputs.vcpkg_ref }}"

            Push-Location $vcpkgRoot

            git fetch --all --tags --force
            git checkout --force "${{ github.event.inputs.vcpkg_ref }}"

            & .\bootstrap-vcpkg.bat -disableMetrics

            Pop-Location
          }

          & $vcpkgExe version

          # Make absolutely sure these are available to every step.
          Add-Content $env:GITHUB_ENV "VCPKG_ROOT=C:\vcpkg"
          Add-Content $env:GITHUB_ENV "VCPKG_DEFAULT_TRIPLET=x64-windows"

          Add-Content $env:GITHUB_PATH "C:\vcpkg"

      # ------------------------------------------------------------
      # Download Ardour's dependency helper
      # ------------------------------------------------------------
      - name: Download Ardour dependency helper
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $helperDir = "$env:RUNNER_TEMP\ardour-deps"
          $helper = "$helperDir\InstallDependencies.vcpkg.py"

          New-Item -ItemType Directory -Force -Path $helperDir | Out-Null

          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/EZ4Stephen/testardourdeps/main/vcpkg-build/InstallDependencies.vcpkg.py" `
            -OutFile $helper

          Write-Host "Downloaded:"
          Get-Item $helper | Format-List FullName,Length

      # ------------------------------------------------------------
      # Patch dependency helper so it uses C:\vcpkg
      #
      # Original helper assumes its own local ./vcpkg directory.
      # We force it to use the actual cached C:\vcpkg installation.
      # ------------------------------------------------------------
      - name: Patch dependency helper
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $helper = "$env:RUNNER_TEMP\ardour-deps\InstallDependencies.vcpkg.py"

          $text = Get-Content $helper -Raw

          $old = '_vcpkg_dir = _script_dir / "vcpkg"'

          $new = '_vcpkg_dir = Path(os.environ.get("VCPKG_ROOT", r"C:\vcpkg"))'

          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
            Write-Host "Patched helper vcpkg directory."
          }
          else {
            Write-Host "Expected vcpkg path line was not found."
            Write-Host "Continuing without that replacement."
          }

          Set-Content `
            -Path $helper `
            -Value $text `
            -Encoding UTF8

          Get-Content $helper | Select-String "_vcpkg_dir"

      # ------------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------------
      - name: Install Ardour dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $helper = "$env:RUNNER_TEMP\ardour-deps\InstallDependencies.vcpkg.py"

          $env:VCPKG_ROOT = "C:\vcpkg"
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows"

          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET"

          python $helper

      # ------------------------------------------------------------
      # Locate pkg-config / pkgconf
      # ------------------------------------------------------------
      - name: Prepare pkg-config
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgRoot = "C:\vcpkg"
          $installed = "$vcpkgRoot\installed\x64-windows"

          $pkgconfCandidates = @(
            "$vcpkgRoot\downloads\tools\pkgconf\*\pkgconf.exe",
            "$vcpkgRoot\installed\x64-windows\tools\pkgconf\pkgconf.exe",
            "$vcpkgRoot\installed\x64-windows\tools\pkgconf\pkg-config.exe"
          )

          $pkgconf = $null

          foreach ($pattern in $pkgconfCandidates) {
            $found = Get-ChildItem `
              -Path $pattern `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $pkgconf = $found.FullName
              break
            }
          }

          if (-not $pkgconf) {
            $found = Get-ChildItem `
              -Path $vcpkgRoot `
              -Recurse `
              -Filter "pkgconf.exe" `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $pkgconf = $found.FullName
            }
          }

          if (-not $pkgconf) {
            throw "Could not find pkgconf.exe."
          }

          Write-Host "Found pkgconf: $pkgconf"

          $pkgconfDir = Split-Path $pkgconf -Parent

          if (-not (Test-Path "$pkgconfDir\pkg-config.exe")) {
            Copy-Item `
              $pkgconf `
              "$pkgconfDir\pkg-config.exe"
          }

          Add-Content $env:GITHUB_PATH $pkgconfDir

          $pkgConfigDirs = @()

          $libDir = "$installed\lib"
          $shareDir = "$installed\share"

          if (Test-Path $libDir) {
            $pcFiles = Get-ChildItem `
              -Path $libDir `
              -Recurse `
              -Filter "*.pc" `
              -File `
              -ErrorAction SilentlyContinue

            foreach ($pc in $pcFiles) {
              $dir = $pc.Directory.FullName

              if ($pkgConfigDirs -notcontains $dir) {
                $pkgConfigDirs += $dir
              }
            }
          }

          if (Test-Path $shareDir) {
            $pcFiles = Get-ChildItem `
              -Path $shareDir `
              -Recurse `
              -Filter "*.pc" `
              -File `
              -ErrorAction SilentlyContinue

            foreach ($pc in $pcFiles) {
              $dir = $pc.Directory.FullName

              if ($pkgConfigDirs -notcontains $dir) {
                $pkgConfigDirs += $dir
              }
            }
          }

          if ($pkgConfigDirs.Count -gt 0) {
            $pkgPath = $pkgConfigDirs -join ";"

            Add-Content `
              $env:GITHUB_ENV `
              "PKG_CONFIG_PATH=$pkgPath"

            Write-Host "PKG_CONFIG_PATH=$pkgPath"
          }

          pkg-config --version

      # ------------------------------------------------------------
      # Prepare MSVC include / lib paths
      #
      # IMPORTANT:
      # We do NOT set LD_LIBRARY_PATH or DYLD_LIBRARY_PATH here.
      # Those are Unix/macOS variables and were causing a suspicious
      # Windows environment such as DYLD_LIBRARY_PATH=...;undefined.
      # ------------------------------------------------------------
      - name: Prepare compiler environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgRoot = "C:\vcpkg"
          $triplet = "x64-windows"

          $include = "$vcpkgRoot\installed\$triplet\include"
          $lib = "$vcpkgRoot\installed\$triplet\lib"
          $bin = "$vcpkgRoot\installed\$triplet\bin"

          if (-not (Test-Path $include)) {
            throw "vcpkg include directory does not exist: $include"
          }

          if (-not (Test-Path $lib)) {
            throw "vcpkg lib directory does not exist: $lib"
          }

          $currentInclude = $env:INCLUDE
          $newInclude = "$include;$currentInclude"

          Add-Content `
            $env:GITHUB_ENV `
            "INCLUDE=$newInclude"

          $currentLib = $env:LIB
          $newLib = "$lib;$currentLib"

          Add-Content `
            $env:GITHUB_ENV `
            "LIB=$newLib"

          $currentPath = $env:PATH
          $newPath = "$bin;$currentPath"

          Add-Content `
            $env:GITHUB_ENV `
            "PATH=$newPath"

          # These help Waf / pkg-config based detection.
          Add-Content `
            $env:GITHUB_ENV `
            "CFLAGS=/I`"$include`""

          Add-Content `
            $env:GITHUB_ENV `
            "CXXFLAGS=/I`"$include`""

          Write-Host "INCLUDE configured."
          Write-Host "LIB configured."
          Write-Host "PATH configured."

          Write-Host ""
          Write-Host "Checking important directories:"
          Write-Host "  include = $include"
          Write-Host "  lib     = $lib"
          Write-Host "  bin     = $bin"

      # ------------------------------------------------------------
      # Verify important headers
      # ------------------------------------------------------------
      - name: Verify vcpkg headers
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $include = "C:\vcpkg\installed\x64-windows\include"

          $headers = @(
            "glib.h",
            "glibmm.h",
            "sigc++\sigc++.h",
            "libxml2\libxml\parser.h",
            "libusb-1.0\libusb.h",
            "curl\curl.h",
            "sndfile.h",
            "taglib\tag.h",
            "fftw3.h"
          )

          foreach ($header in $headers) {
            $path = Join-Path $include $header

            if (Test-Path $path) {
              Write-Host "[OK] $header"
            }
            else {
              Write-Host "[MISSING] $header"
            }
          }

      # ------------------------------------------------------------
      # Fetch Ardour tags
      #
      # git describe HEAD previously failed because the checkout did
      # not contain enough tag information.
      # ------------------------------------------------------------
      - name: Fetch Ardour tags
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $remotes = git remote

          if ($remotes -contains "upstream") {
            git remote remove upstream
          }

          git remote add upstream https://github.com/Ardour/ardour.git

          git fetch `
            upstream `
            --tags `
            --force `
            --prune

          Write-Host ""
          Write-Host "Git description:"
          git describe --tags --always --dirty

      # ------------------------------------------------------------
      # Patch luasession getopt linking
      #
      # Ardour's libpbd contains getopt.c/getopt_long.c for MSVC,
      # but ardour9-lua can still end up with:
      #
      #   unresolved external symbol __imp_getopt_long_a
      #
      # We compile the MSVC getopt sources directly into the
      # luasession target so the symbols are available there.
      # ------------------------------------------------------------
      - name: Patch luasession MSVC getopt
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $file = "luasession\wscript"

          if (-not (Test-Path $file)) {
            throw "$file was not found."
          }

          $text = Get-Content $file -Raw

          $marker = "      obj.source       = 'luasession.cc'"

          $replacement = @"
      obj.source       = 'luasession.cc'

      if bld.env['build_target'] == 'msvc':
          obj.source += [
              '../libs/pbd/msvc/getopt.c',
              '../libs/pbd/msvc/getopt_long.c',
          ]
"@

          if ($text.Contains($marker)) {
            if (-not $text.Contains("../libs/pbd/msvc/getopt_long.c")) {
              $text = $text.Replace($marker, $replacement)
              Set-Content -Path $file -Value $text -Encoding UTF8

              Write-Host "Added MSVC getopt sources to luasession."
            }
            else {
              Write-Host "luasession getopt patch already exists."
            }
          }
          else {
            throw "Could not find expected luasession source marker."
          }

          Write-Host ""
          Write-Host "Resulting section:"
          Get-Content $file |
            Select-String -Pattern "getopt|obj.source" -Context 2,2

      # ------------------------------------------------------------
      # Clean previous Waf build state
      #
      # This makes debugging reliable. It is slower than incremental
      # builds, but avoids stale Waf/MSVC configuration.
      # ------------------------------------------------------------
      - name: Clean Waf build state
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path ".waf3") {
            Remove-Item -Recurse -Force ".waf3"
          }

          if (Test-Path "build") {
            Remove-Item -Recurse -Force "build"
          }

          Write-Host "Waf build state cleaned."

      # ------------------------------------------------------------
      # Configure Ardour
      # ------------------------------------------------------------
      - name: Configure Ardour
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $env:VCPKG_ROOT = "C:\vcpkg"

          $prefix = "$env:GITHUB_WORKSPACE\dist"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $prefix | Out-Null

          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "INSTALL_DIR=$prefix"
          Write-Host ""

          Write-Host "Compiler:"
          where.exe cl.exe
          cl.exe 2>&1 | Select-Object -First 5

          Write-Host ""
          Write-Host "Python:"
          python --version

          Write-Host ""
          Write-Host "Waf:"
          python waf --version

          Write-Host ""
          Write-Host "Git:"
          git describe --tags --always --dirty

          Write-Host ""
          Write-Host "LLVM:"
          if ($env:LLVM_PATH) {
            Write-Host "LLVM_PATH=$env:LLVM_PATH"
          }

          $args = @(
            "configure",
            "--prefix=$prefix",
            "--configdir=share",
            "--ptformat",
            "--dist-target=msvc",
            "--also-include=C:\vcpkg\installed\x64-windows\include",
            "--also-libdir=C:\vcpkg\installed\x64-windows\lib",
            "--cxx17",
            "--use-lld",
            "--optimize"
          )

          if ("${{ github.event.inputs.build_type }}" -eq "Debug") {
            $args += "--debug"
          }

          Write-Host ""
          Write-Host "Running:"
          Write-Host "python waf $($args -join ' ')"
          Write-Host ""

          python waf @args

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build Ardour
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # GitHub's Windows runner has multiple CPU cores.
          # 4 is conservative and avoids making the runner
          # completely memory-starved.
          $jobs = [Math]::Min(
            [Environment]::ProcessorCount,
            4
          )

          Write-Host "CPU cores: $([Environment]::ProcessorCount)"
          Write-Host "Waf jobs: $jobs"
          Write-Host ""

          python waf build -j $jobs

      # ------------------------------------------------------------
      # Install
      # ------------------------------------------------------------
      - name: Install Ardour
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $prefix = "$env:GITHUB_WORKSPACE\dist"

          if (Test-Path $prefix) {
            Remove-Item `
              -Recurse `
              -Force `
              $prefix
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $prefix | Out-Null

          python waf install

      # ------------------------------------------------------------
      # Show final build contents
      # ------------------------------------------------------------
      - name: Verify installed files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $prefix = "$env:GITHUB_WORKSPACE\dist"

          Write-Host ""
          Write-Host "Installed files:"
          Write-Host "----------------"

          Get-ChildItem `
            -Path $prefix `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          $exe = Get-ChildItem `
            -Path $prefix `
            -Recurse `
            -Filter "ardour*.exe" `
            -File `
            -ErrorAction SilentlyContinue

          if ($exe) {
            Write-Host ""
            Write-Host "Found Ardour executables:"
            $exe | ForEach-Object {
              Write-Host $_.FullName
            }
          }
          else {
            Write-Host ""
            Write-Host "WARNING: No Ardour executable was found in dist."
          }

      # ------------------------------------------------------------
      # Package artifact
      # ------------------------------------------------------------
      - name: Upload Ardour artifact
        uses: actions/upload-artifact@v4
        with:
          name: ardour-windows-msvc-${{ github.event.inputs.build_type }}
          path: |
            dist/**
          if-no-files-found: error
          retention-days: 14