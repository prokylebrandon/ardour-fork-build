name: Build Ardour (Windows / MSVC)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "waf build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

      vcpkg_ref:
        description: "Optional vcpkg commit/tag to pin"
        required: false
        default: ""
        type: string

env:
  VCPKG_HOME: C:\vcpkg
  VCPKG_TRIPLET: x64-windows
  INSTALL_DIR: ${{ github.workspace }}\dist

jobs:
  build:
    name: Build Ardour
    runs-on: windows-2022

    steps:
      # ------------------------------------------------------------
      # Checkout Ardour
      # ------------------------------------------------------------
      - name: Checkout Ardour
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          submodules: recursive

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------
      # MSVC
      # ------------------------------------------------------------
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ------------------------------------------------------------
      # LLVM
      # ------------------------------------------------------------
      - name: Setup LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"
          directory: ${{ runner.temp }}\llvm

      # ------------------------------------------------------------
      # Perl
      # ------------------------------------------------------------
      - name: Add Strawberry Perl to PATH
        shell: pwsh
        run: |
          $perl = "C:\Strawberry\perl\bin"
          $cbin = "C:\Strawberry\c\bin"

          if (Test-Path $perl) {
            Add-Content $env:GITHUB_PATH $perl
          }

          if (Test-Path $cbin) {
            Add-Content $env:GITHUB_PATH $cbin
          }

      # ------------------------------------------------------------
      # Git / Ardour version information
      #
      # Ardour's Waf build uses:
      #
      #     git describe HEAD
      #
      # The fork may not have Ardour's upstream tags, so explicitly
      # fetch them from the official Ardour repository.
      # ------------------------------------------------------------
      - name: Fetch Ardour upstream tags
        shell: pwsh
        run: |
          git remote remove upstream 2>$null

          git remote add upstream https://github.com/Ardour/ardour.git

          git fetch upstream --tags --force --prune

          Write-Host "Git version:"
          git describe HEAD

      # ------------------------------------------------------------
      # vcpkg
      # ------------------------------------------------------------
      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg
          key: windows-2022-vcpkg-${{ runner.arch }}-${{ hashFiles('**/InstallDependencies.vcpkg.py') }}

      - name: Install vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if (Test-Path "C:\vcpkg") {
            Remove-Item "C:\vcpkg" -Recurse -Force
          }

          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg

          Set-Location C:\vcpkg

          .\bootstrap-vcpkg.bat

      # ------------------------------------------------------------
      # Optional vcpkg pin
      # ------------------------------------------------------------
      - name: Pin vcpkg revision
        if: inputs.vcpkg_ref != ''
        shell: pwsh
        run: |
          Set-Location C:\vcpkg

          git fetch --all --tags

          git checkout "${{ inputs.vcpkg_ref }}"

          .\bootstrap-vcpkg.bat

      # ------------------------------------------------------------
      # Do NOT let vcpkg's environment integration override the
      # standalone C:\vcpkg installation.
      # ------------------------------------------------------------
      - name: Configure vcpkg environment
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_ENV "VCPKG_ROOT="

          $env:VCPKG_ROOT = $null

          Write-Host "VCPKG_HOME=$env:VCPKG_HOME"
          Write-Host "VCPKG_TRIPLET=$env:VCPKG_TRIPLET"

      # ------------------------------------------------------------
      # Download Ardour's MSVC dependency helper
      # ------------------------------------------------------------
      - name: Download Ardour MSVC dependency helper
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/EZ4Stephen/testardourdeps/main/vcpkg-build/InstallDependencies.vcpkg.py" `
            -OutFile "$env:RUNNER_TEMP\InstallDependencies.vcpkg.py"

          Write-Host "Dependency helper downloaded."

      # ------------------------------------------------------------
      # Patch dependency helper to use our standalone vcpkg
      # ------------------------------------------------------------
      - name: Patch dependency helper
        shell: pwsh
        run: |
          $file = "$env:RUNNER_TEMP\InstallDependencies.vcpkg.py"

          $text = Get-Content $file -Raw

          $old = '_vcpkg_dir = _script_dir / "vcpkg"'
          $new = '_vcpkg_dir = Path(r"C:\vcpkg")'

          if (-not $text.Contains($old)) {
            Write-Host "Expected vcpkg path line was not found."
            Write-Host "Searching for vcpkg_dir definitions:"
            $text -split "`n" |
              Where-Object { $_ -match "vcpkg_dir" } |
              ForEach-Object { Write-Host $_ }

            exit 1
          }

          $text = $text.Replace($old, $new)

          Set-Content `
            -Path $file `
            -Value $text `
            -Encoding UTF8

          Write-Host "Dependency helper patched to use C:\vcpkg."

      # ------------------------------------------------------------
      # Install Ardour dependencies
      # ------------------------------------------------------------
      - name: Install Ardour dependencies
        shell: pwsh
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows
        run: |
          python "$env:RUNNER_TEMP\InstallDependencies.vcpkg.py"

      # ------------------------------------------------------------
      # Add vcpkg tools to PATH
      # ------------------------------------------------------------
      - name: Configure vcpkg tools
        shell: pwsh
        run: |
          $installed = "C:\vcpkg\installed\x64-windows"

          $pkgconfig = "C:\vcpkg\installed\x64-windows\tools\pkgconf"

          if (Test-Path $pkgconfig) {
            Add-Content $env:GITHUB_PATH $pkgconfig
          }

          Add-Content $env:GITHUB_PATH "C:\vcpkg"

          Write-Host "Installed prefix:"
          Write-Host $installed

      # ------------------------------------------------------------
      # Configure include paths
      #
      # Some dependencies expose their headers correctly through
      # pkg-config, but MSVC/Waf does not always propagate those
      # include directories to every target.
      # ------------------------------------------------------------
      - name: Configure MSVC include paths
        shell: pwsh
        run: |
          $installed = "C:\vcpkg\installed\x64-windows"

          $includeDirs = @(
            "$installed\include",
            "$installed\include\glib-2.0",
            "$installed\lib\glib-2.0\include",
            "$installed\include\libxml2",
            "$installed\include\libusb-1.0",
            "$installed\include\pthread",
            "$installed\include\glibmm-2.4",
            "$installed\lib\glibmm-2.4\include",
            "$installed\include\giomm-2.4",
            "$installed\include\sigc++-3.0",
            "$installed\lib\sigc++-3.0\include",
            "$installed\include\cairomm-1.0",
            "$installed\include\pangomm-2.48",
            "$installed\include\pango-1.0",
            "$installed\include\harfbuzz",
            "$installed\include\cairo",
            "$installed\include\pixman-1",
            "$installed\include\freetype2"
          )

          # Add include directories reported by pkg-config.
          $packages = @(
            "glib-2.0",
            "glibmm-2.4",
            "gio-2.0",
            "giomm-2.4",
            "gthread-2.0",
            "libxml-2.0",
            "libusb-1.0",
            "sigc++-3.0",
            "cairo",
            "cairomm-1.0",
            "pango",
            "pangomm-2.48"
          )

          foreach ($pkg in $packages) {
            try {
              $result = & pkgconf --cflags-only-I $pkg 2>$null

              if ($LASTEXITCODE -eq 0 -and $result) {
                foreach ($token in ($result -split '\s+')) {
                  if ($token -match '^-I(.+)$') {
                    $path = $Matches[1].Trim('"')

                    if ($path -and (Test-Path $path)) {
                      $includeDirs += $path
                    }
                  }
                }
              }
            }
            catch {
              Write-Host "pkgconf lookup failed for $pkg"
            }
          }

          $includeDirs = $includeDirs |
            Where-Object { $_ -and (Test-Path $_) } |
            Sort-Object -Unique

          Write-Host "MSVC include directories:"
          $includeDirs | ForEach-Object {
            Write-Host "  $_"
          }

          $flags = ($includeDirs | ForEach-Object {
            '/I"{0}"' -f $_
          }) -join ' '

          Add-Content $env:GITHUB_ENV "ARDOUR_EXTRA_INCLUDE_FLAGS=$flags"

          Add-Content $env:GITHUB_ENV "INCLUDE=$($includeDirs -join ';')"

          Add-Content $env:GITHUB_ENV "CFLAGS=$flags"
          Add-Content $env:GITHUB_ENV "CXXFLAGS=$flags"

      # ------------------------------------------------------------
      # Verify important headers before starting the large build.
      # ------------------------------------------------------------
      - name: Verify dependency headers
        shell: pwsh
        run: |
          $installed = "C:\vcpkg\installed\x64-windows"

          $headers = @(
            "$installed\include\glib-2.0\glib.h",
            "$installed\include\libxml2\libxml\parser.h",
            "$installed\include\libusb-1.0\libusb.h"
          )

          foreach ($header in $headers) {
            if (-not (Test-Path $header)) {
              Write-Error "Missing required header: $header"
              exit 1
            }

            Write-Host "Found: $header"
          }

      # ------------------------------------------------------------
      # IMPORTANT FIX:
      #
      # ardour9-lua directly references getopt_long_a on MSVC.
      #
      # libpbd contains the getopt implementation, but the symbol
      # isn't being pulled into the Lua executable correctly.
      #
      # Compile the MSVC getopt implementation directly into the
      # luasession target.
      # ------------------------------------------------------------
      - name: Patch luasession getopt linkage for MSVC
        shell: pwsh
        run: |
          $file = Join-Path $env:GITHUB_WORKSPACE "luasession\wscript"

          if (-not (Test-Path $file)) {
            Write-Error "Could not find luasession\wscript"
            exit 1
          }

          $text = Get-Content $file -Raw

          $old = @"
          obj.source       = 'luasession.cc'
          obj.target       = 'luasession'
          "@

          $new = @"
          obj.source       = 'luasession.cc'

          if bld.env['build_target'] == 'msvc':
              obj.source += [
                  '../libs/pbd/msvc/getopt.c',
                  '../libs/pbd/msvc/getopt_long.c',
              ]

          obj.target       = 'luasession'
          "@

          if (-not $text.Contains($old)) {
            Write-Host "Expected luasession source block was not found."

            Write-Host ""
            Write-Host "Relevant section of luasession/wscript:"
            Write-Host ""

            $text -split "`n" |
              Select-String -Pattern "obj.source|obj.target" |
              ForEach-Object {
                Write-Host $_.Line
              }

            exit 1
          }

          $text = $text.Replace($old, $new)

          Set-Content `
            -Path $file `
            -Value $text `
            -Encoding UTF8

          Write-Host ""
          Write-Host "Successfully patched luasession/wscript."
          Write-Host ""
          Write-Host "MSVC getopt sources added:"
          Write-Host "  ../libs/pbd/msvc/getopt.c"
          Write-Host "  ../libs/pbd/msvc/getopt_long.c"
          Write-Host ""

          Write-Host "Patched section:"
          Write-Host ""

          $lines = Get-Content $file

          $start = 0

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "obj.source\s*=\s*'luasession.cc'") {
              $start = [Math]::Max(0, $i - 2)
              break
            }
          }

          $end = [Math]::Min($lines.Count - 1, $start + 15)

          for ($i = $start; $i -le $end; $i++) {
            Write-Host $lines[$i]
          }

      # ------------------------------------------------------------
      # Waf configure
      # ------------------------------------------------------------
      - name: Configure Ardour
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $args = @(
            "configure",
            "--prefix=$env:INSTALL_DIR",
            "--configdir=share",
            "--dist-target=msvc",
            "--also-include=C:\vcpkg\installed\x64-windows\include",
            "--also-libdir=C:\vcpkg\installed\x64-windows\lib",
            "--cxx17"
          )

          if ("${{ inputs.build_type }}" -eq "Release") {
            $args += "--optimize"
          }
          else {
            $args += "--debug"
          }

          Write-Host "Running:"
          Write-Host "python waf $($args -join ' ')"

          python waf @args

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build Ardour
        shell: pwsh
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows
        run: |
          $ErrorActionPreference = "Stop"

          $jobs = [Environment]::ProcessorCount

          # Avoid an excessive number of simultaneous MSVC processes.
          # 4 is generally a good balance for GitHub-hosted Windows
          # runners.
          if ($jobs -gt 4) {
            $jobs = 4
          }

          Write-Host "Building with $jobs parallel jobs."

          python waf build -j $jobs

      # ------------------------------------------------------------
      # Install / package
      # ------------------------------------------------------------
      - name: Install Ardour
        shell: pwsh
        run: |
          python waf install

      # ------------------------------------------------------------
      # Show resulting binaries
      # ------------------------------------------------------------
      - name: Show build output
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "============================================"
          Write-Host "Ardour build output"
          Write-Host "============================================"
          Write-Host ""

          if (Test-Path "$env:INSTALL_DIR") {
            Get-ChildItem "$env:INSTALL_DIR" -Recurse -File |
              Select-Object FullName, Length |
              Format-Table -AutoSize
          }
          else {
            Write-Host "Install directory does not exist."
          }

      # ------------------------------------------------------------
      # Upload build artifact
      # ------------------------------------------------------------
      - name: Upload Ardour artifact
        uses: actions/upload-artifact@v4
        with:
          name: ardour-windows-msvc-${{ inputs.build_type }}
          path: ${{ env.INSTALL_DIR }}
          if-no-files-found: error
          compression-level: 6