name: Build Ardour (Windows / MSVC)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "waf build type"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

      vcpkg_ref:
        description: "vcpkg commit/tag to pin (blank = latest master)"
        required: false
        default: ""
        type: string

env:
  # IMPORTANT:
  # Do NOT use VCPKG_ROOT here. Visual Studio on the GitHub runner
  # already defines VCPKG_ROOT and points it at VS's bundled vcpkg.
  VCPKG_HOME: C:\vcpkg
  VCPKG_TRIPLET: x64-windows
  INSTALL_DIR: ${{ github.workspace }}\dist

jobs:
  build:
    runs-on: windows-2022

    steps:

      # ================================================================
      # 1. SOURCE
      # ================================================================
      - name: Checkout Ardour
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          submodules: recursive

      # ================================================================
      # 2. FETCH ARDOUR UPSTREAM TAGS
      # ================================================================
      # Ardour's wscript uses `git describe HEAD` to determine the
      # Ardour version. A fork can have complete Git history but still
      # lack reachable Ardour release tags.
      #
      # Fetch the official Ardour tags explicitly before configuring.
      # This also performs an early diagnostic so we don't waste a
      # long build if the checked-out commit cannot be described.
      # ================================================================
      - name: Fetch Ardour upstream tags
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Fetching Ardour upstream tags..."

          $existingRemote = git remote get-url upstream 2>$null

          if ($LASTEXITCODE -ne 0) {
            git remote add upstream https://github.com/Ardour/ardour.git
          }
          else {
            Write-Host "Upstream remote already exists:"
            Write-Host $existingRemote
          }

          git fetch upstream --tags --force --prune

          Write-Host ""
          Write-Host "Recent Ardour tags:"
          git tag --sort=-version:refname |
            Select-Object -First 20

          Write-Host ""
          Write-Host "Tags reachable from HEAD:"

          $reachableTags = @(
            git tag --merged HEAD
          )

          if ($reachableTags.Count -eq 0) {
            Write-Host ""
            Write-Host "No tags are reachable from the checked-out HEAD."
            Write-Host ""
            Write-Host "Current HEAD:"
            git log -1 --oneline --decorate
            Write-Host ""
            Write-Host "This usually means the fork branch contains commits that are"
            Write-Host "not descendants of an official Ardour tagged commit."

            throw "No Ardour release tag is reachable from HEAD."
          }

          $reachableTags |
            Select-Object -Last 20

          Write-Host ""
          Write-Host "Testing git describe HEAD..."

          $describe = git describe HEAD 2>&1

          if ($LASTEXITCODE -ne 0) {
            Write-Error ($describe -join "`n")
            throw "git describe HEAD failed even after fetching Ardour tags."
          }

          Write-Host "git describe HEAD = $($describe -join '')"

      # ================================================================
      # 3. TOOLCHAIN
      # ================================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"

      - name: Ensure Strawberry Perl is on PATH
        shell: pwsh
        run: |
          if (Test-Path "C:\Strawberry\perl\bin") {
            "C:\Strawberry\perl\bin" |
              Out-File `
                -FilePath $env:GITHUB_PATH `
                -Encoding utf8 `
                -Append
          }

      # ================================================================
      # 4. VCPKG TOOL CACHE
      # ================================================================
      - name: Restore vcpkg tool cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg
          key: >-
            ardour-vcpkg-tool-${{ runner.os }}-
            ${{ inputs.vcpkg_ref != '' && inputs.vcpkg_ref || 'latest' }}
          restore-keys: |
            ardour-vcpkg-tool-${{ runner.os }}-

      # ================================================================
      # 5. STANDALONE VCPKG
      # ================================================================
      - name: Set up standalone vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Visual Studio defines this itself. Remove it so child
          # processes cannot accidentally select VS's bundled vcpkg.
          Remove-Item Env:VCPKG_ROOT -ErrorAction SilentlyContinue

          $vcpkg = $env:VCPKG_HOME

          Write-Host "Using standalone vcpkg: $vcpkg"

          if (!(Test-Path "$vcpkg\.git")) {

            if (Test-Path $vcpkg) {
              Write-Host "Existing C:\vcpkg is not a Git repository."
              Write-Host "Removing it before cloning a clean copy."

              Remove-Item `
                -Path $vcpkg `
                -Recurse `
                -Force
            }

            Write-Host "Cloning standalone vcpkg..."

            git clone `
              https://github.com/microsoft/vcpkg.git `
              $vcpkg
          }

          Push-Location $vcpkg

          git fetch origin --tags --quiet

          if ("${{ inputs.vcpkg_ref }}" -ne "") {
            Write-Host "Using pinned vcpkg ref: ${{ inputs.vcpkg_ref }}"

            git checkout "${{ inputs.vcpkg_ref }}"
          }
          else {
            Write-Host "Using latest vcpkg master"

            git checkout master --quiet
            git pull --ff-only origin master
          }

          Pop-Location

          if (!(Test-Path "$vcpkg\bootstrap-vcpkg.bat")) {
            throw "bootstrap-vcpkg.bat not found at $vcpkg"
          }

          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics

          if (!(Test-Path "$vcpkg\vcpkg.exe")) {
            throw "vcpkg.exe was not created."
          }

          Write-Host "Standalone vcpkg is ready."

      # ================================================================
      # 6. VCPKG DEPENDENCY CACHE
      # ================================================================
      - name: Restore vcpkg dependency cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\downloads
            C:\vcpkg\buildtrees
          key: >-
            ardour-deps-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-
            ${{ inputs.vcpkg_ref != '' && inputs.vcpkg_ref || 'floating' }}
          restore-keys: |
            ardour-deps-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-

      # ================================================================
      # 7. DOWNLOAD ARDOUR MSVC DEPENDENCY HELPER
      # ================================================================
      - name: Download Ardour dependency helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://raw.githubusercontent.com/EZ4Stephen/testardourdeps/main/vcpkg-build/InstallDependencies.vcpkg.py"
          $file = "$env:GITHUB_WORKSPACE\InstallDependencies.vcpkg.py"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $file

          if (!(Test-Path $file)) {
            throw "Failed to download Ardour dependency helper."
          }

          Write-Host "Downloaded Ardour dependency helper."

      # ================================================================
      # 8. POINT DEPENDENCY HELPER AT OUR VCPKG
      # ================================================================
      - name: Configure dependency helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "$env:GITHUB_WORKSPACE\InstallDependencies.vcpkg.py"

          $text = Get-Content `
            -Path $file `
            -Raw

          $old = '_vcpkg_dir = _script_dir / "vcpkg"'
          $new = '_vcpkg_dir = Path(r"C:\vcpkg")'

          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
          }
          else {
            Write-Host "Dependency helper already appears to use an external vcpkg path."
          }

          Set-Content `
            -Path $file `
            -Value $text `
            -Encoding utf8

          Write-Host "Dependency helper configured."

      # ================================================================
      # 9. INSTALL ARDOUR DEPENDENCIES
      # ================================================================
      - name: Install Ardour dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python "$env:GITHUB_WORKSPACE\InstallDependencies.vcpkg.py"

          if (!(Test-Path "$env:VCPKG_HOME\installed\$env:VCPKG_TRIPLET")) {
            throw "Expected vcpkg installed tree was not created."
          }

          Write-Host "Ardour dependency installation completed."

      # ================================================================
      # 10. CONFIGURE VCPKG BUILD ENVIRONMENT
      # ================================================================
      - name: Configure build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installed = "$env:VCPKG_HOME\installed\$env:VCPKG_TRIPLET"
          $pkgconfDir = "$installed\tools\pkgconf"
          $pkgconfExe = "$pkgconfDir\pkgconf.exe"

          if (!(Test-Path $installed)) {
            throw "Installed dependency tree not found: $installed"
          }

          if (!(Test-Path $pkgconfExe)) {
            throw "pkgconf.exe not found: $pkgconfExe"
          }

          "VCPKG_INSTALLED=$installed" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          # Make vcpkg headers/libs visible to MSVC and Waf.
          "INCLUDE=$installed\include;$env:INCLUDE" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "LIB=$installed\lib;$env:LIB" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          # Make pkg-config see both standard vcpkg databases.
          "PKG_CONFIG_PATH=$installed\lib\pkgconfig;$installed\share\pkgconfig" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "PKG_CONFIG=$pkgconfExe" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "$pkgconfDir" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          "$installed\bin" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          Write-Host "vcpkg build environment configured."

      # ================================================================
      # 11. SELF-HEAL KNOWN DEPENDENCIES
      # ================================================================
      - name: Self-heal missing dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkg = "$env:VCPKG_HOME\vcpkg.exe"
          $triplet = $env:VCPKG_TRIPLET
          $root = $env:VCPKG_INSTALLED
          $pc = $env:PKG_CONFIG

          # Known Ardour/MSVC dependency set.
          $packages = @(
            "boost-ptr-container",
            "boost-uuid",
            "boost-tokenizer",
            "boost-multiprecision",
            "boost-pool",
            "boost-algorithm",
            "boost-property-tree",
            "boost-multi-array",
            "glib",
            "glibmm",
            "libsigcpp",
            "cairomm",
            "pangomm",
            "libsndfile",
            "libsamplerate",
            "curl",
            "libarchive",
            "liblo",
            "taglib",
            "vamp-sdk",
            "libusb",
            "rubberband",
            "jack2",
            "pthreads",
            "fftw3[threads]",
            "aubio[core]",
            "libpng",
            "pango",
            "lv2",
            "libxml2",
            "cppunit",
            "libwebsockets",
            "portaudio[asio]",
            "serd",
            "sord",
            "sratom",
            "lilv",
            "libflac",
            "getopt"
          )

          Write-Host ""
          Write-Host "==============================================================="
          Write-Host "Checking known Ardour MSVC dependency ports"
          Write-Host "==============================================================="

          $installedList = @(
            & $vcpkg list
          )

          $missing = @()

          foreach ($package in $packages) {

            $base = $package.Split("[")[0]

            $found = $false

            foreach ($line in $installedList) {
              if ($line -match "^\s*$([regex]::Escape($base))\s*:") {
                $found = $true
                break
              }
            }

            if ($found) {
              Write-Host "OK      $package"
            }
            else {
              Write-Warning "MISSING $package"
              $missing += $package
            }
          }

          if ($missing.Count -gt 0) {

            Write-Host ""
            Write-Host "Installing missing dependency ports..."

            $missing | ForEach-Object {
              Write-Host "  $_"
            }

            & $vcpkg install `
              @missing `
              --triplet $triplet `
              --no-print-usage

            if ($LASTEXITCODE -ne 0) {
              throw "One or more missing dependency ports could not be installed."
            }
          }
          else {
            Write-Host "All known dependency ports are installed."
          }

      # ================================================================
      # 12. RE-APPLY ARDOUR WINDOWS FIXES
      # ================================================================
      # Important because the helper may create aubio.pc and fix
      # Windows-specific .pc and library names after installation.
      # ================================================================
      - name: Re-apply Ardour dependency fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python "$env:GITHUB_WORKSPACE\InstallDependencies.vcpkg.py"

          Write-Host "Ardour dependency fixes applied."

      # ================================================================
      # 13. VERIFY DEPENDENCIES
      # ================================================================
      - name: Verify dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:VCPKG_INSTALLED
          $pc = $env:PKG_CONFIG

          function Require-Header {
            param([string]$Path)

            $full = "$root\include\$Path"

            if (Test-Path $full) {
              Write-Host "OK HEADER  $Path"
            }
            else {
              throw "Missing required header: $Path"
            }
          }

          function Require-Pkg {
            param([string]$Name)

            $null = & $pc --exists $Name 2>&1

            if ($LASTEXITCODE -ne 0) {
              throw "Missing required pkg-config package: $Name"
            }

            $version = (& $pc --modversion $Name 2>&1) -join ""

            Write-Host "OK PKG     $Name ($version)"
          }

          Write-Host ""
          Write-Host "=== Required headers ==="

          Require-Header "boost/version.hpp"
          Require-Header "boost/ptr_container/ptr_list.hpp"
          Require-Header "sndfile.h"
          Require-Header "samplerate.h"
          Require-Header "fftw3.h"
          Require-Header "FLAC/stream_encoder.h"
          Require-Header "lo/lo.h"
          Require-Header "portaudio.h"
          Require-Header "rubberband/RubberBandStretcher.h"
          Require-Header "aubio/aubio.h"
          Require-Header "pthread.h"

          Write-Host ""
          Write-Host "=== Required pkg-config packages ==="

          Require-Pkg "glib-2.0"
          Require-Pkg "sndfile"
          Require-Pkg "samplerate"
          Require-Pkg "fftw3"
          Require-Pkg "flac"
          Require-Pkg "lilv-0"
          Require-Pkg "rubberband"
          Require-Pkg "liblo"
          Require-Pkg "portaudio-2.0"
          Require-Pkg "aubio"

          Write-Host ""
          Write-Host "=== GTKmm family ==="

          Require-Pkg "glibmm-2.4"
          Require-Pkg "giomm-2.4"
          Require-Pkg "sigc++-2.0"
          Require-Pkg "cairomm-1.0"
          Require-Pkg "pangomm-1.4"

          Write-Host ""
          Write-Host "All dependency checks passed."

      # ================================================================
      # 14. WAF CONFIGURE
      # ================================================================
      - name: waf configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installed = $env:VCPKG_INSTALLED

          $args = @(
            "configure",
            "--prefix=$env:INSTALL_DIR",
            "--configdir=share",
            "--dist-target=msvc",
            "--also-include=$installed\include",
            "--also-include=$installed\include\pthread",
            "--also-libdir=$installed\lib",
            "--cxx17"
          )

          if ("${{ inputs.build_type }}" -eq "Release") {
            $args += "--optimize"
          }
          else {
            $args += "--debug"
          }

          Write-Host ""
          Write-Host "Running:"
          Write-Host "python waf $($args -join ' ')"
          Write-Host ""

          python waf @args

      # ================================================================
      # 15. CONFIGURE LOGS
      # ================================================================
      - name: Upload configure logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ardour-config-${{ github.run_number }}
          path: |
            ${{ github.workspace }}\build\config.log
            ${{ github.workspace }}\build\config.summary
            ${{ github.workspace }}\build\config.errors
          if-no-files-found: warn
          retention-days: 14

      # ================================================================
      # 16. BUILD
      # ================================================================
      - name: waf build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $jobs = [Environment]::ProcessorCount

          Write-Host "Building Ardour with $jobs parallel jobs."

          python waf build -j $jobs

      # ================================================================
      # 17. BUILD LOGS
      # ================================================================
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ardour-build-${{ github.run_number }}
          path: |
            ${{ github.workspace }}\build
          if-no-files-found: warn
          retention-days: 14

      # ================================================================
      # 18. INSTALL
      # ================================================================
      - name: waf install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python waf install

      # ================================================================
      # 19. BUNDLE RUNTIME DLLs
      # ================================================================
      - name: Bundle runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgBin = "$env:VCPKG_INSTALLED\bin"
          $installRoot = "$env:INSTALL_DIR"

          if (!(Test-Path $vcpkgBin)) {
            throw "vcpkg runtime directory not found: $vcpkgBin"
          }

          $executables = @(
            Get-ChildItem `
              -Path $installRoot `
              -Recurse `
              -Filter "*.exe" `
              -File
          )

          if ($executables.Count -eq 0) {
            throw "No executable files were installed under $installRoot"
          }

          $dlls = @(
            Get-ChildItem `
              -Path $vcpkgBin `
              -Filter "*.dll" `
              -File
          )

          if ($dlls.Count -eq 0) {
            throw "No vcpkg DLLs found in $vcpkgBin"
          }

          $directories = $executables |
            Select-Object `
              -ExpandProperty DirectoryName `
              -Unique

          foreach ($directory in $directories) {

            Write-Host ""
            Write-Host "Copying $($dlls.Count) DLLs to:"
            Write-Host $directory

            Copy-Item `
              -Path $dlls.FullName `
              -Destination $directory `
              -Force
          }

      # ================================================================
      # 20. VALIDATE
      # ================================================================
      - name: Validate installed build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $executables = @(
            Get-ChildItem `
              -Path $env:INSTALL_DIR `
              -Recurse `
              -Filter "*.exe" `
              -File
          )

          if ($executables.Count -eq 0) {
            throw "No executable was found after installation."
          }

          Write-Host ""
          Write-Host "Installed executables:"

          $executables | ForEach-Object {
            Write-Host "  $($_.FullName)"
          }

          Write-Host ""
          Write-Host "Ardour installation validation passed."

      # ================================================================
      # 21. UPLOAD ARTIFACT
      # ================================================================
      - name: Upload Ardour artifact
        uses: actions/upload-artifact@v4
        with:
          name: ardour-windows-msvc-${{ inputs.build_type }}-${{ github.run_number }}
          path: ${{ env.INSTALL_DIR }}
          if-no-files-found: error
          retention-days: 14
