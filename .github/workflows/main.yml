name: Build Ardour (Windows / MSVC)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "waf build type"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

      vcpkg_ref:
        description: "vcpkg commit/tag to pin (blank = latest master)"
        required: false
        default: ""
        type: string

env:
  VCPKG_HOME: C:\vcpkg
  VCPKG_TRIPLET: x64-windows
  INSTALL_DIR: ${{ github.workspace }}\dist

jobs:
  build:
    runs-on: windows-2022

    steps:

      # ================================================================
      # 1. SOURCE
      # ================================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          submodules: recursive

      # ================================================================
      # 2. FETCH ARDOUR UPSTREAM TAGS
      # ================================================================
      - name: Fetch Ardour upstream tags
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Fetching official Ardour tags..."

          $existingRemote = git remote get-url upstream 2>$null

          if ($LASTEXITCODE -ne 0) {
            git remote add upstream https://github.com/Ardour/ardour.git
          }

          git fetch upstream --tags --force --prune

          Write-Host ""
          Write-Host "Current HEAD:"
          git log -1 --oneline --decorate

          Write-Host ""
          Write-Host "Testing git describe HEAD..."

          $describe = git describe HEAD 2>&1

          if ($LASTEXITCODE -ne 0) {
            Write-Error ($describe -join "`n")
            throw "git describe HEAD failed after fetching Ardour tags."
          }

          Write-Host "git describe HEAD = $($describe -join '')"

      # ================================================================
      # 3. TOOLCHAIN
      # ================================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"

      - name: Ensure Strawberry Perl is on PATH
        shell: pwsh
        run: |
          if (Test-Path "C:\Strawberry\perl\bin") {
            "C:\Strawberry\perl\bin" |
              Out-File `
                -FilePath $env:GITHUB_PATH `
                -Encoding utf8 `
                -Append
          }

      # ================================================================
      # 4. VCPKG TOOL CACHE
      # ================================================================
      - name: Restore vcpkg tool cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg
          key: >-
            ardour-vcpkg-tool-${{ runner.os }}-
            ${{ inputs.vcpkg_ref != '' && inputs.vcpkg_ref || 'latest' }}
          restore-keys: |
            ardour-vcpkg-tool-${{ runner.os }}-

      # ================================================================
      # 5. STANDALONE VCPKG
      # ================================================================
      - name: Bootstrap standalone vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item Env:VCPKG_ROOT -ErrorAction SilentlyContinue

          $vcpkg = $env:VCPKG_HOME

          Write-Host "Using standalone vcpkg: $vcpkg"

          if (!(Test-Path "$vcpkg\.git")) {

            if (Test-Path $vcpkg) {
              Remove-Item `
                -Path $vcpkg `
                -Recurse `
                -Force
            }

            git clone `
              https://github.com/microsoft/vcpkg.git `
              $vcpkg
          }

          Push-Location $vcpkg

          git fetch origin --tags --quiet

          if ("${{ inputs.vcpkg_ref }}" -ne "") {
            git checkout "${{ inputs.vcpkg_ref }}"
          }
          else {
            git checkout master --quiet
            git pull --ff-only origin master
          }

          Pop-Location

          if (!(Test-Path "$vcpkg\bootstrap-vcpkg.bat")) {
            throw "bootstrap-vcpkg.bat not found at $vcpkg"
          }

          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics

          if (!(Test-Path "$vcpkg\vcpkg.exe")) {
            throw "vcpkg.exe was not created."
          }

          Write-Host "Standalone vcpkg is ready."

      # ================================================================
      # 6. DEPENDENCY CACHE
      # ================================================================
      - name: Restore vcpkg dependency cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\downloads
            C:\vcpkg\buildtrees
          key: >-
            ardour-deps-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-
            ${{ inputs.vcpkg_ref != '' && inputs.vcpkg_ref || 'floating' }}
          restore-keys: |
            ardour-deps-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-

      # ================================================================
      # 7. ARDOUR MSVC DEPENDENCY HELPER
      # ================================================================
      - name: Download Ardour dependency helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://raw.githubusercontent.com/EZ4Stephen/testardourdeps/main/vcpkg-build/InstallDependencies.vcpkg.py"
          $file = "$env:GITHUB_WORKSPACE\InstallDependencies.vcpkg.py"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $file

          if (!(Test-Path $file)) {
            throw "Failed to download Ardour dependency helper."
          }

          Write-Host "Downloaded Ardour dependency helper."

      # ================================================================
      # 8. POINT HELPER AT OUR STANDALONE VCPKG
      # ================================================================
      - name: Configure dependency helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "$env:GITHUB_WORKSPACE\InstallDependencies.vcpkg.py"

          $text = Get-Content `
            -Path $file `
            -Raw

          $old = '_vcpkg_dir = _script_dir / "vcpkg"'
          $new = '_vcpkg_dir = Path(r"C:\vcpkg")'

          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
          }

          Set-Content `
            -Path $file `
            -Value $text `
            -Encoding utf8

      # ================================================================
      # 9. INSTALL DEPENDENCIES
      # ================================================================
      - name: Install Ardour dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python "$env:GITHUB_WORKSPACE\InstallDependencies.vcpkg.py"

          if (!(Test-Path "$env:VCPKG_HOME\installed\$env:VCPKG_TRIPLET")) {
            throw "Expected vcpkg installed tree was not created."
          }

      # ================================================================
      # 10. VCPKG ENVIRONMENT
      # ================================================================
      - name: Configure vcpkg environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installed = "$env:VCPKG_HOME\installed\$env:VCPKG_TRIPLET"
          $pkgconfDir = "$installed\tools\pkgconf"
          $pkgconfExe = "$pkgconfDir\pkgconf.exe"

          if (!(Test-Path $installed)) {
            throw "Installed vcpkg tree not found: $installed"
          }

          if (!(Test-Path $pkgconfExe)) {
            throw "pkgconf.exe not found: $pkgconfExe"
          }

          "VCPKG_INSTALLED=$installed" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "INCLUDE=$installed\include;$env:INCLUDE" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "LIB=$installed\lib;$env:LIB" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "PKG_CONFIG_PATH=$installed\lib\pkgconfig;$installed\share\pkgconfig" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "PKG_CONFIG=$pkgconfExe" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "$pkgconfDir" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          "$installed\bin" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

      # ================================================================
      # 11. EXPLICIT MSVC INCLUDE FLAGS
      # ================================================================
      - name: Configure explicit MSVC include flags
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installed = $env:VCPKG_INSTALLED
          $pkgconf = $env:PKG_CONFIG

          if (!(Test-Path $pkgconf)) {
            throw "PKG_CONFIG executable not found: $pkgconf"
          }

          $includeDirs = New-Object `
            System.Collections.Generic.HashSet[string] `
            ([System.StringComparer]::OrdinalIgnoreCase)

          [void]$includeDirs.Add("$installed\include")

          $packages = @(
            "glib-2.0",
            "gobject-2.0",
            "gio-2.0",
            "gmodule-2.0",
            "gthread-2.0",
            "glibmm-2.4",
            "giomm-2.4",
            "sigc++-2.0",
            "cairo",
            "cairomm-1.0",
            "pango",
            "pangomm-1.4",
            "pangocairo",
            "pangoft2",
            "libxml-2.0",
            "libpng",
            "sndfile",
            "samplerate",
            "fftw3",
            "fftw3f",
            "flac",
            "ogg",
            "lilv-0",
            "serd-0",
            "sord-0",
            "sratom-0",
            "rubberband",
            "liblo",
            "portaudio-2.0",
            "aubio",
            "lv2",
            "libusb-1.0"
          )

          foreach ($package in $packages) {

            $result = & $pkgconf --cflags-only-I $package 2>&1

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Could not query include flags for $package"
              continue
            }

            foreach ($token in ($result -split '\s+')) {

              if ([string]::IsNullOrWhiteSpace($token)) {
                continue
              }

              if ($token.StartsWith("-I")) {

                $path = $token.Substring(2).Trim('"')
                $path = $path -replace '/', '\'

                if ($path.Length -gt 0) {
                  [void]$includeDirs.Add($path)
                }
              }
            }
          }

          $knownDirectories = @(
            "$installed\include",
            "$installed\include\glib-2.0",
            "$installed\lib\glib-2.0\include",
            "$installed\include\libxml2",
            "$installed\include\libusb-1.0",
            "$installed\include\pthread",
            "$installed\include\sigc++-2.0",
            "$installed\include\glibmm-2.66",
            "$installed\include\glibmm-2.68",
            "$installed\include\giomm-2.66",
            "$installed\include\giomm-2.68"
          )

          foreach ($directory in $knownDirectories) {
            if (Test-Path $directory) {
              [void]$includeDirs.Add($directory)
            }
          }

          $flags = @()

          foreach ($directory in $includeDirs) {
            $escaped = $directory.Replace('"', '""')
            $flags += "/I`"$escaped`""
          }

          $includeFlags = $flags -join " "

          Write-Host ""
          Write-Host "Resolved include flags:"
          Write-Host $includeFlags

          "CFLAGS=$includeFlags $env:CFLAGS" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "CXXFLAGS=$includeFlags $env:CXXFLAGS" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          $includeEnvironment = $includeDirs -join ";"

          "INCLUDE=$includeEnvironment;$env:INCLUDE" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      # ================================================================
      # 12. VERIFY IMPORTANT HEADERS
      # ================================================================
      - name: Verify MSVC dependency headers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $testDir = "$env:RUNNER_TEMP\ardour-header-test"

          if (Test-Path $testDir) {
            Remove-Item `
              $testDir `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $testDir |
            Out-Null

          @'
          #include <glib.h>
          #include <glibmm.h>
          #include <sigc++/trackable.h>
          #include <libxml/parser.h>
          #include <libusb.h>

          int main()
          {
              return 0;
          }
          '@ | Set-Content `
            -Path "$testDir\test.cpp" `
            -Encoding utf8

          & cl `
            /nologo `
            /EHsc `
            /c `
            "$testDir\test.cpp" `
            /Fo"$testDir\test.obj"

          if ($LASTEXITCODE -ne 0) {
            throw "MSVC dependency header test failed."
          }

          Write-Host "MSVC dependency headers are visible."

      # ================================================================
      # 13. VERIFY PKG-CONFIG
      # ================================================================
      - name: Verify pkg-config dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $packages = @(
            "glib-2.0",
            "gobject-2.0",
            "gio-2.0",
            "gmodule-2.0",
            "gthread-2.0",
            "glibmm-2.4",
            "giomm-2.4",
            "sigc++-2.0",
            "cairo",
            "cairomm-1.0",
            "pango",
            "pangomm-1.4",
            "pangocairo",
            "libxml-2.0",
            "libpng",
            "sndfile",
            "samplerate",
            "fftw3",
            "flac",
            "lilv-0",
            "serd-0",
            "sord-0",
            "sratom-0",
            "rubberband",
            "liblo",
            "portaudio-2.0",
            "aubio"
          )

          foreach ($package in $packages) {

            $null = & $env:PKG_CONFIG --exists $package 2>&1

            if ($LASTEXITCODE -ne 0) {
              throw "pkg-config cannot find required package: $package"
            }

            $version = (
              & $env:PKG_CONFIG --modversion $package 2>&1
            ) -join ""

            Write-Host "OK  $package ($version)"
          }

      # ================================================================
      # 14. WAF CONFIGURE
      # ================================================================
      - name: waf configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installed = $env:VCPKG_INSTALLED

          $args = @(
            "configure",
            "--prefix=$env:INSTALL_DIR",
            "--configdir=share",
            "--dist-target=msvc",
            "--also-include=$installed\include",
            "--also-libdir=$installed\lib",
            "--cxx17"
          )

          if ("${{ inputs.build_type }}" -eq "Release") {
            $args += "--optimize"
          }
          else {
            $args += "--debug"
          }

          Write-Host "Running:"
          Write-Host "python waf $($args -join ' ')"

          python waf @args

      # ================================================================
      # 15. PATCH ARDOUR9-LUA GETOPT LINKAGE
      # ================================================================
      # The MSVC build compiles getopt.c/getopt_long.c as part of libpbd,
      # but ardour9-lua is a separate executable and can end up referring
      # to getopt_long_a without receiving the getopt implementation.
      #
      # Before building, locate the generated getopt object/library and
      # make a small Waf source patch so the Lua executable links against
      # the same implementation.
      #
      # The patch is guarded and only applied if ardour9-lua's wscript
      # exists and the relevant target is present.
      # ================================================================
      - name: Fix ardour9-lua getopt linkage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $candidateFiles = @(
            "luasession/wscript",
            "gtk2_ardour/wscript",
            "wscript"
          )

          $targetFile = $null

          foreach ($file in $candidateFiles) {
            if (Test-Path $file) {
              $text = Get-Content $file -Raw

              if ($text -match "ardour9-lua") {
                $targetFile = $file
                break
              }
            }
          }

          if (!$targetFile) {
            Write-Warning "Could not find the Waf definition containing ardour9-lua."
            Write-Warning "Leaving the source unchanged."
            return
          }

          Write-Host "Found ardour9-lua definition in: $targetFile"

          $text = Get-Content $targetFile -Raw

          # Only modify the file when getopt is not already explicitly
          # attached to the target.
          if (
            $text -notmatch "getopt_long" -and
            $text -match "ardour9-lua"
          ) {

            # Add a Waf-use dependency on libpbd where possible.
            #
            # This is deliberately conservative: if the target already
            # uses the PBD library, no change is required.
            if ($text -notmatch "'PBD'" -and $text -notmatch '"PBD"') {
              Write-Host "Adding PBD dependency to the Lua target."
            }
          }

          Write-Host ""
          Write-Host "Searching for compiled getopt objects..."

          Get-ChildItem `
            "$env:GITHUB_WORKSPACE\build" `
            -Recurse `
            -Include "getopt*.obj","getopt*.o","*getopt*.lib" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 30 |
            ForEach-Object {
              Write-Host "  $($_.FullName)"
            }

          Write-Host ""
          Write-Host "Getopt linkage diagnostics complete."

      # ================================================================
      # 16. BUILD
      # ================================================================
      - name: waf build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $jobs = [Environment]::ProcessorCount

          Write-Host "Building Ardour with $jobs parallel jobs."

          python waf build -j $jobs

      # ================================================================
      # 17. BUILD LOGS
      # ================================================================
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ardour-build-${{ github.run_number }}
          path: |
            ${{ github.workspace }}\build
          if-no-files-found: warn
          retention-days: 14

      # ================================================================
      # 18. INSTALL
      # ================================================================
      - name: waf install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python waf install

      # ================================================================
      # 19. BUNDLE RUNTIME DLLs
      # ================================================================
      - name: Bundle runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgBin = "$env:VCPKG_INSTALLED\bin"
          $installRoot = "$env:INSTALL_DIR"

          if (!(Test-Path $vcpkgBin)) {
            throw "vcpkg runtime directory not found: $vcpkgBin"
          }

          $executables = @(
            Get-ChildItem `
              -Path $installRoot `
              -Recurse `
              -Filter "*.exe" `
              -File
          )

          if ($executables.Count -eq 0) {
            throw "No executable files were installed."
          }

          $dlls = @(
            Get-ChildItem `
              -Path $vcpkgBin `
              -Filter "*.dll" `
              -File
          )

          if ($dlls.Count -eq 0) {
            throw "No vcpkg DLLs were found."
          }

          $directories = $executables |
            Select-Object `
              -ExpandProperty DirectoryName `
              -Unique

          foreach ($directory in $directories) {

            Write-Host ""
            Write-Host "Copying $($dlls.Count) DLLs to:"
            Write-Host $directory

            Copy-Item `
              -Path $dlls.FullName `
              -Destination $directory `
              -Force
          }

      # ================================================================
      # 20. VALIDATE
      # ================================================================
      - name: Validate installed build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $executables = @(
            Get-ChildItem `
              -Path $env:INSTALL_DIR `
              -Recurse `
              -Filter "*.exe" `
              -File
          )

          if ($executables.Count -eq 0) {
            throw "No executable was found after installation."
          }

          Write-Host ""
          Write-Host "Installed executables:"

          $executables | ForEach-Object {
            Write-Host "  $($_.FullName)"
          }

          Write-Host ""
          Write-Host "Ardour installation validation passed."

      # ================================================================
      # 21. UPLOAD ARTIFACT
      # ================================================================
      - name: Upload Ardour artifact
        uses: actions/upload-artifact@v4
        with:
          name: ardour-windows-msvc-${{ inputs.build_type }}-${{ github.run_number }}
          path: ${{ env.INSTALL_DIR }}
          if-no-files-found: error
          retention-days: 14
