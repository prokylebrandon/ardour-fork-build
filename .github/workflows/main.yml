name: Build Ardour (Windows / MSVC)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "waf build type"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

      vcpkg_ref:
        description: "vcpkg commit/tag to pin (blank = latest master)"
        required: false
        default: ""
        type: string

env:
  # IMPORTANT:
  # Do not use VCPKG_ROOT here. Visual Studio on the GitHub runner
  # already defines VCPKG_ROOT and points it at VS's bundled vcpkg.
  VCPKG_HOME: C:\vcpkg
  VCPKG_TRIPLET: x64-windows
  INSTALL_DIR: ${{ github.workspace }}\dist

jobs:
  build:
    runs-on: windows-2022

    steps:

      # ================================================================
      # 1. SOURCE
      # ================================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: recursive

      # ================================================================
      # 2. TOOLCHAIN
      # ================================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"

      - name: Ensure Strawberry Perl is on PATH
        shell: pwsh
        run: |
          if (Test-Path "C:\Strawberry\perl\bin") {
            "C:\Strawberry\perl\bin" |
              Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      # ================================================================
      # 3. VCPKG TOOL CACHE
      # ================================================================
      - name: Restore vcpkg tool cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg
          key: >-
            ardour-vcpkg-tool-${{ runner.os }}-
            ${{ inputs.vcpkg_ref != '' && inputs.vcpkg_ref || 'latest' }}
          restore-keys: |
            ardour-vcpkg-tool-${{ runner.os }}-

      # ================================================================
      # 4. VCPKG SETUP
      # ================================================================
      - name: Bootstrap standalone vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkg = $env:VCPKG_HOME

          Write-Host "Using standalone vcpkg: $vcpkg"

          # Visual Studio sets VCPKG_ROOT to its own bundled copy.
          # Explicitly remove it so it cannot interfere.
          Remove-Item Env:VCPKG_ROOT -ErrorAction SilentlyContinue

          if (!(Test-Path "$vcpkg\.git")) {

            if (Test-Path $vcpkg) {
              Write-Host "C:\vcpkg exists but is not a Git repository."
              Write-Host "Removing it before cloning a clean copy."

              Remove-Item `
                -Path $vcpkg `
                -Recurse `
                -Force
            }

            Write-Host "Cloning standalone vcpkg..."

            git clone `
              https://github.com/microsoft/vcpkg.git `
              $vcpkg
          }

          Push-Location $vcpkg

          git fetch origin --tags --quiet

          if ("${{ inputs.vcpkg_ref }}" -ne "") {
            Write-Host "Using pinned vcpkg ref: ${{ inputs.vcpkg_ref }}"

            git checkout `
              "${{ inputs.vcpkg_ref }}"
          }
          else {
            Write-Host "Using latest vcpkg master"

            git checkout master --quiet
            git pull --ff-only origin master
          }

          Pop-Location

          if (!(Test-Path "$vcpkg\bootstrap-vcpkg.bat")) {
            throw "bootstrap-vcpkg.bat not found at $vcpkg"
          }

          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics

          if (!(Test-Path "$vcpkg\vcpkg.exe")) {
            throw "vcpkg.exe was not created."
          }

          Write-Host "vcpkg setup complete."

      # ================================================================
      # 5. CACHE DEPENDENCIES
      # ================================================================
      - name: Restore vcpkg dependency cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\downloads
          key: >-
            ardour-deps-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-
            ${{ inputs.vcpkg_ref != '' && inputs.vcpkg_ref || 'floating' }}-
            ${{ github.sha }}
          restore-keys: |
            ardour-deps-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-${{ inputs.vcpkg_ref != '' && inputs.vcpkg_ref || 'floating' }}-
            ardour-deps-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-

      # ================================================================
      # 6. DOWNLOAD THE ARDOUR MSVC VCPKG HELPER
      # ================================================================
      # This is the current helper published for the Ardour MSVC
      # dependency stack.
      #
      # It provides custom overlay ports for:
      #
      #   libsigcpp 2.12.1
      #   glibmm    2.66.8
      #   cairomm   1.14.5
      #   pangomm   2.42.2
      #
      # and performs several Windows-specific fixes:
      #
      #   aubio.pc
      #   JACK pkg-config version
      #   Vamp library names
      #   Vamp -ldl removal
      #   liblo -> lo.lib
      #
      # These fixes are part of the published Ardour MSVC dependency
      # helper itself.
      # ================================================================
      - name: Download Ardour dependency helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://raw.githubusercontent.com/EZ4Stephen/testardourdeps/main/vcpkg-build/InstallDependencies.vcpkg.py"
          $file = "$env:GITHUB_WORKSPACE\InstallDependencies.vcpkg.py"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $file

          if (!(Test-Path $file)) {
            throw "Failed to download Ardour dependency helper."
          }

          Write-Host "Downloaded dependency helper:"
          Write-Host $file

      # ================================================================
      # 7. PATCH HELPER TO USE OUR C:\vcpkg
      # ================================================================
      # The upstream helper expects its vcpkg checkout beside itself.
      # Our workflow already has a cached standalone vcpkg at C:\vcpkg,
      # so replace that path with our known-good location.
      # ================================================================
      - name: Configure dependency helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "$env:GITHUB_WORKSPACE\InstallDependencies.vcpkg.py"

          $text = Get-Content `
            -Path $file `
            -Raw

          $old = '_vcpkg_dir = _script_dir / "vcpkg"'
          $new = '_vcpkg_dir = Path(r"C:\vcpkg")'

          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
          }
          else {
            Write-Host "Expected vcpkg path line was not found."
            Write-Host "The helper may already use a custom vcpkg path."
          }

          Set-Content `
            -Path $file `
            -Value $text `
            -Encoding utf8

          Write-Host "Dependency helper configured."

      # ================================================================
      # 8. INSTALL ARDOUR DEPENDENCIES
      # ================================================================
      # The helper's actual package set includes the dependencies used
      # by the documented MSVC build, including aubio[core] and the
      # older GTKmm-family ports.
      # ================================================================
      - name: Install Ardour dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python "$env:GITHUB_WORKSPACE\InstallDependencies.vcpkg.py"

          if (!(Test-Path "$env:VCPKG_HOME\installed\$env:VCPKG_TRIPLET")) {
            throw "vcpkg did not create the expected installed triplet."
          }

          Write-Host "Ardour dependency installation completed."

      # ================================================================
      # 9. BUILD ENVIRONMENT
      # ================================================================
      - name: Configure build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installed = "$env:VCPKG_HOME\installed\$env:VCPKG_TRIPLET"
          $pkgconfDir = "$installed\tools\pkgconf"
          $pkgconfExe = "$pkgconfDir\pkgconf.exe"

          if (!(Test-Path $installed)) {
            throw "Installed dependency tree not found: $installed"
          }

          "VCPKG_INSTALLED=$installed" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          # MSVC include paths.
          #
          # vcpkg MUST come first so its dependency headers are found.
          "INCLUDE=$installed\include;$env:INCLUDE" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          # MSVC library paths.
          "LIB=$installed\lib;$env:LIB" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          # pkg-config paths.
          "PKG_CONFIG_PATH=$installed\lib\pkgconfig;$installed\share\pkgconfig" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          # pkgconf executable.
          if (!(Test-Path $pkgconfExe)) {
            throw "pkgconf.exe not found at $pkgconfExe"
          }

          "PKG_CONFIG=$pkgconfExe" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "$pkgconfDir" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          "$installed\bin" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          Write-Host "vcpkg environment configured."

      # ================================================================
      # 10. VERIFY ACTUAL ARDOUR DEPENDENCIES
      # ================================================================
      - name: Verify dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:VCPKG_INSTALLED
          $pc = $env:PKG_CONFIG

          Write-Host ""
          Write-Host "==============================================================="
          Write-Host "Checking dependency files"
          Write-Host "==============================================================="

          function Require-Header {
            param([string]$Path)

            $full = "$root\include\$Path"

            if (Test-Path $full) {
              Write-Host "OK  header: $Path"
            }
            else {
              throw "Missing required header: $Path"
            }
          }

          function Require-Pkg {
            param([string]$Name)

            $null = & $pc --exists $Name 2>&1

            if ($LASTEXITCODE -ne 0) {
              throw "Missing required pkg-config package: $Name"
            }

            $version = (& $pc --modversion $Name 2>&1) -join ""

            Write-Host "OK  pkg: $Name ($version)"
          }

          # Boost.
          Require-Header "boost/version.hpp"
          Require-Header "boost/ptr_container/ptr_list.hpp"

          # Headers whose exact vcpkg include subdirectory is stable.
          Require-Header "sndfile.h"
          Require-Header "samplerate.h"
          Require-Header "fftw3.h"
          Require-Header "FLAC/stream_encoder.h"
          Require-Header "lo/lo.h"
          Require-Header "portaudio.h"
          Require-Header "rubberband/RubberBandStretcher.h"
          Require-Header "aubio/aubio.h"
          Require-Header "pthread.h"

          # These should be tested through pkg-config because GLib/Lilv
          # use their own include-directory layouts.
          Require-Pkg "glib-2.0"
          Require-Pkg "sndfile"
          Require-Pkg "samplerate"
          Require-Pkg "fftw3"
          Require-Pkg "flac"
          Require-Pkg "lilv-0"
          Require-Pkg "rubberband"
          Require-Pkg "liblo"
          Require-Pkg "portaudio-2.0"
          Require-Pkg "aubio"

          # Ardour's GTKmm stack uses the legacy pkg-config names from
          # the older compatible versions supplied by the helper.
          Require-Pkg "glibmm-2.4"
          Require-Pkg "giomm-2.4"
          Require-Pkg "sigc++-2.0"
          Require-Pkg "cairomm-1.0"
          Require-Pkg "pangomm-1.4"

          Write-Host ""
          Write-Host "==============================================================="
          Write-Host "All required dependency checks passed."
          Write-Host "==============================================================="

      # ================================================================
      # 11. WAF CONFIGURE
      # ================================================================
      - name: waf configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installed = $env:VCPKG_INSTALLED

          $args = @(
            "configure",
            "--prefix=$env:INSTALL_DIR",
            "--configdir=share",
            "--dist-target=msvc",
            "--also-include=$installed\include",
            "--also-include=$installed\include\pthread",
            "--also-libdir=$installed\lib",
            "--cxx17"
          )

          if ("${{ inputs.build_type }}" -eq "Release") {
            $args += "--optimize"
          }
          else {
            $args += "--debug"
          }

          Write-Host ""
          Write-Host "Running:"
          Write-Host "python waf $($args -join ' ')"
          Write-Host ""

          python waf @args

      # ================================================================
      # 12. CONFIGURE LOGS
      # ================================================================
      - name: Upload configure logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ardour-config-${{ github.run_number }}
          path: |
            ${{ github.workspace }}\build\config.log
            ${{ github.workspace }}\build\config.summary
            ${{ github.workspace }}\build\config.errors
          if-no-files-found: warn
          retention-days: 14

      # ================================================================
      # 13. BUILD
      # ================================================================
      - name: waf build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $jobs = [Environment]::ProcessorCount

          Write-Host "Building Ardour with $jobs parallel jobs."

          python waf build -j $jobs

      # ================================================================
      # 14. BUILD LOGS
      # ================================================================
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ardour-build-${{ github.run_number }}
          path: |
            ${{ github.workspace }}\build
          if-no-files-found: warn
          retention-days: 14

      # ================================================================
      # 15. INSTALL
      # ================================================================
      - name: waf install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python waf install

      # ================================================================
      # 16. BUNDLE RUNTIME DLLs
      # ================================================================
      - name: Bundle runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installed = $env:VCPKG_INSTALLED
          $installRoot = $env:INSTALL_DIR
          $vcpkgBin = "$installed\bin"

          if (!(Test-Path $vcpkgBin)) {
            throw "vcpkg runtime directory not found: $vcpkgBin"
          }

          $executables = Get-ChildItem `
            -Path $installRoot `
            -Recurse `
            -Filter "*.exe" `
            -File

          if ($executables.Count -eq 0) {
            throw "No executable files were installed under $installRoot"
          }

          $dlls = Get-ChildItem `
            -Path $vcpkgBin `
            -Filter "*.dll" `
            -File

          if ($dlls.Count -eq 0) {
            throw "No vcpkg DLLs were found in $vcpkgBin"
          }

          $directories = $executables |
            Select-Object `
              -ExpandProperty DirectoryName `
              -Unique

          foreach ($directory in $directories) {
            Write-Host ""
            Write-Host "Copying $($dlls.Count) DLLs to:"
            Write-Host $directory

            Copy-Item `
              -Path $dlls.FullName `
              -Destination $directory `
              -Force
          }

      # ================================================================
      # 17. BASIC VALIDATION
      # ================================================================
      - name: Validate installed build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $executables = Get-ChildItem `
            -Path $env:INSTALL_DIR `
            -Recurse `
            -Filter "*.exe" `
            -File

          if ($executables.Count -eq 0) {
            throw "No executable was found in the installed Ardour tree."
          }

          Write-Host ""
          Write-Host "Installed executables:"
          $executables | ForEach-Object {
            Write-Host "  $($_.FullName)"
          }

          Write-Host ""
          Write-Host "Ardour installation validation passed."

      # ================================================================
      # 18. ARTIFACT
      # ================================================================
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ardour-windows-msvc-${{ inputs.build_type }}-${{ github.run_number }}
          path: ${{ env.INSTALL_DIR }}
          if-no-files-found: error
          retention-days: 14
