- name: Diagnose MSVC getopt
  shell: pwsh
  run: |
    $ErrorActionPreference = "Stop"

    $files = @(
      "libs\pbd\msvc\getopt.h",
      "libs\pbd\msvc\getopt.c",
      "libs\pbd\msvc\getopt_long.c"
    )

    Write-Host ""
    Write-Host "=========================================================="
    Write-Host "CHECKING GETOPT FILES"
    Write-Host "=========================================================="

    foreach ($f in $files) {
      Write-Host ""
      Write-Host "FILE: $f"

      if (Test-Path $f) {
        Write-Host "FOUND"
      } else {
        Write-Host "NOT FOUND"
      }
    }

    Write-Host ""
    Write-Host "=========================================================="
    Write-Host "SEARCHING ENTIRE REPOSITORY FOR getopt_long_a"
    Write-Host "=========================================================="

    Get-ChildItem -Recurse -File |
      Select-String `
        -Pattern "getopt_long_a" `
        -ErrorAction SilentlyContinue |
      ForEach-Object {
        Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
      }

    Write-Host ""
    Write-Host "=========================================================="
    Write-Host "SEARCHING FOR getopt_long MACRO DEFINITIONS"
    Write-Host "=========================================================="

    Get-ChildItem -Recurse -File `
      -Include *.h,*.hpp,*.c,*.cc,*.cpp |
      Select-String `
        -Pattern "#define\s+getopt_long" `
        -ErrorAction SilentlyContinue |
      ForEach-Object {
        Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
      }

    Write-Host ""
    Write-Host "=========================================================="
    Write-Host "SEARCHING FOR GETOPT_API"
    Write-Host "=========================================================="

    Get-ChildItem -Recurse -File `
      -Include *.h,*.hpp,*.c,*.cc,*.cpp |
      Select-String `
        -Pattern "GETOPT_API" `
        -ErrorAction SilentlyContinue |
      ForEach-Object {
        Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
      }

    Write-Host ""
    Write-Host "=========================================================="
    Write-Host "SEARCHING FOR dllimport / dllexport"
    Write-Host "=========================================================="

    Get-ChildItem -Recurse -File `
      -Include *.h,*.hpp,*.c,*.cc,*.cpp |
      Select-String `
        -Pattern "__declspec\(dllimport\)|__declspec\(dllexport\)" `
        -ErrorAction SilentlyContinue |
      ForEach-Object {
        Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
      }

    Write-Host ""
    Write-Host "=========================================================="
    Write-Host "LUASESSION.CC"
    Write-Host "=========================================================="

    $lua = "luasession\luasession.cc"

    if (Test-Path $lua) {
      Write-Host "Found $lua"
      Write-Host ""
      Get-Content $lua | Select-Object -First 100
    } else {
      Write-Host "NOT FOUND: $lua"
    }

    Write-Host ""
    Write-Host "=========================================================="
    Write-Host "DIAGNOSTIC COMPLETE"
    Write-Host "=========================================================="