name: Build Ardour (Windows / MSVC)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "waf build type"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

      vcpkg_ref:
        description: "vcpkg commit/tag to pin (blank = latest master)"
        required: false
        default: ""
        type: string

env:
  VCPKG_HOME: C:\vcpkg
  VCPKG_TRIPLET: x64-windows
  INSTALL_DIR: ${{ github.workspace }}\dist

jobs:
  build:
    runs-on: windows-2022

    steps:

      # ================================================================
      # 1. SOURCE
      # ================================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          submodules: recursive

      # ================================================================
      # 2. FETCH ARDOUR UPSTREAM TAGS
      # ================================================================
      - name: Fetch Ardour upstream tags
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Fetching official Ardour tags..."

          $existingRemote = git remote get-url upstream 2>$null

          if ($LASTEXITCODE -ne 0) {
            git remote add upstream https://github.com/Ardour/ardour.git
          }
          else {
            Write-Host "upstream remote already exists:"
            Write-Host $existingRemote
          }

          git fetch upstream --tags --force --prune

          Write-Host ""
          Write-Host "Current HEAD:"
          git log -1 --oneline --decorate

          Write-Host ""
          Write-Host "Testing git describe HEAD..."

          $describe = git describe HEAD 2>&1

          if ($LASTEXITCODE -ne 0) {
            Write-Error ($describe -join "`n")
            throw "git describe HEAD failed after fetching Ardour tags."
          }

          Write-Host "git describe HEAD = $($describe -join '')"

      # ================================================================
      # 2B. DIAGNOSTIC: FIND WHERE getopt_long_a COMES FROM
      # ================================================================
      - name: Diagnose MSVC getopt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=========================================================="
          Write-Host "CHECKING GETOPT FILES"
          Write-Host "=========================================================="

          $files = @(
            "libs\pbd\msvc\getopt.h",
            "libs\pbd\msvc\getopt.c",
            "libs\pbd\msvc\getopt_long.c"
          )

          foreach ($f in $files) {
            Write-Host ""
            Write-Host "FILE: $f"

            if (Test-Path $f) {
              Write-Host "FOUND"
            }
            else {
              Write-Host "NOT FOUND"
            }
          }

          Write-Host ""
          Write-Host "=========================================================="
          Write-Host "SEARCHING ENTIRE REPOSITORY FOR getopt_long_a"
          Write-Host "=========================================================="

          Get-ChildItem -Recurse -File |
            Select-String `
              -Pattern "getopt_long_a" `
              -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }

          Write-Host ""
          Write-Host "=========================================================="
          Write-Host "SEARCHING FOR getopt_long MACRO DEFINITIONS"
          Write-Host "=========================================================="

          Get-ChildItem -Recurse -File `
            -Include *.h,*.hpp,*.c,*.cc,*.cpp |
            Select-String `
              -Pattern "#define\s+getopt_long" `
              -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }

          Write-Host ""
          Write-Host "=========================================================="
          Write-Host "SEARCHING FOR GETOPT_API"
          Write-Host "=========================================================="

          Get-ChildItem -Recurse -File `
            -Include *.h,*.hpp,*.c,*.cc,*.cpp |
            Select-String `
              -Pattern "GETOPT_API" `
              -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }

          Write-Host ""
          Write-Host "=========================================================="
          Write-Host "SEARCHING FOR dllimport / dllexport"
          Write-Host "=========================================================="

          Get-ChildItem -Recurse -File `
            -Include *.h,*.hpp,*.c,*.cc,*.cpp |
            Select-String `
              -Pattern "__declspec\(dllimport\)|__declspec\(dllexport\)" `
              -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }

          Write-Host ""
          Write-Host "=========================================================="
          Write-Host "LUASESSION.CC - FIRST 100 LINES"
          Write-Host "=========================================================="

          $luaFile = "luasession\luasession.cc"

          if (Test-Path $luaFile) {
            Get-Content $luaFile |
              Select-Object -First 100 |
              ForEach-Object {
                Write-Host $_
              }
          }
          else {
            Write-Host "NOT FOUND: $luaFile"
          }

          Write-Host ""
          Write-Host "=========================================================="
          Write-Host "DIAGNOSTIC COMPLETE"
          Write-Host "=========================================================="

      # ================================================================
      # 3. PATCH LUASESSION MSVC GETOPT LINKING
      #
      # The observed linker error is:
      #
      #   unresolved external symbol __imp_getopt_long_a
      #
      # This means luasession is compiling getopt_long() as a DLL-imported
      # symbol instead of directly linking against the local implementation.
      #
      # Fix:
      #
      #   A. Create private getopt source copies for luasession.
      #
      #   B. Remove DLL export decoration from those private copies.
      #
      #   C. Define GETOPT_API directly in luasession.cc before headers
      #      are processed, preventing getopt.h from defining it as
      #      __declspec(dllimport).
      #
      #   D. Add the private getopt sources to luasession/wscript.
      #
      # We deliberately DO NOT use the previous obj.defines approach.
      # ================================================================
      - name: Patch luasession MSVC getopt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $msvcDir = "libs\pbd\msvc"

          if (!(Test-Path $msvcDir)) {
            throw "MSVC getopt directory not found: $msvcDir"
          }

          # ------------------------------------------------------------
          # A. Create private getopt sources for luasession
          # ------------------------------------------------------------

          $copies = @(
            @{
              Src = "getopt.c"
              Dst = "getopt_luasession.c"
            },
            @{
              Src = "getopt_long.c"
              Dst = "getopt_long_luasession.c"
            }
          )

          foreach ($copy in $copies) {

            $src = Join-Path $msvcDir $copy.Src
            $dst = Join-Path $msvcDir $copy.Dst

            if (!(Test-Path $src)) {
              throw "Missing source file: $src"
            }

            Copy-Item `
              -Path $src `
              -Destination $dst `
              -Force

            Write-Host "Created private getopt source:"
            Write-Host "  $dst"
          }

          # ------------------------------------------------------------
          # B. Patch the private getopt implementations
          #
          # These files are linked directly into ardour9-lua.exe.
          # They must therefore not export their symbols as DLL APIs.
          # ------------------------------------------------------------

          $privateSources = @(
            "$msvcDir\getopt_luasession.c",
            "$msvcDir\getopt_long_luasession.c"
          )

          foreach ($file in $privateSources) {

            $text = Get-Content `
              -Path $file `
              -Raw

            # Remove the WAF_BUILD DLL export.
            $text = $text.Replace(
              '#define GETOPT_API __declspec(dllexport)',
              '#define GETOPT_API'
            )

            # Make absolutely sure GETOPT_API exists before getopt.h.
            if ($text -notmatch '(?m)^#define GETOPT_API\s*$') {

              $text = @"
          #ifndef GETOPT_API
          #define GETOPT_API
          #endif

          $text
          "@
            }

            Set-Content `
              -Path $file `
              -Value $text `
              -Encoding UTF8

            Write-Host "Patched private getopt source:"
            Write-Host "  $file"
          }

          # ------------------------------------------------------------
          # C. Patch luasession.cc
          #
          # THIS IS THE IMPORTANT PART.
          #
          # getopt.h contains:
          #
          #   #define GETOPT_API __declspec(dllimport)
          #
          # when GETOPT_API has not already been defined.
          #
          # Defining GETOPT_API here prevents that import declaration
          # from being generated.
          # ------------------------------------------------------------

          $luaFile = "luasession\luasession.cc"

          if (!(Test-Path $luaFile)) {
            throw "Missing luasession source: $luaFile"
          }

          $luaText = Get-Content `
            -Path $luaFile `
            -Raw

          if ($luaText -notmatch "ARDOUR_MSVC_GETOPT_LOCAL") {

            $prefix = @"
          /*
           * Ardour MSVC build:
           *
           * luasession uses the local MSVC getopt implementation.
           * Do not mark getopt symbols as DLL imports.
           */
          #if defined(COMPILER_MSVC) && defined(WAF_BUILD)
          #ifndef GETOPT_API
          #define GETOPT_API
          #endif
          #define ARDOUR_MSVC_GETOPT_LOCAL
          #endif

          "@

            $luaText = $prefix + $luaText

            Set-Content `
              -Path $luaFile `
              -Value $luaText `
              -Encoding UTF8

            Write-Host "Patched luasession.cc."
          }
          else {
            Write-Host "luasession.cc already contains the MSVC getopt patch."
          }

          # ------------------------------------------------------------
          # D. Patch luasession/wscript
          # ------------------------------------------------------------

          $wscript = "luasession\wscript"

          if (!(Test-Path $wscript)) {
            throw "Missing file: $wscript"
          }

          $lines = Get-Content $wscript

          # Prevent duplicate insertion.
          if ($lines -match "getopt_luasession\.c") {
            Write-Host "luasession/wscript getopt patch already exists."
          }
          else {

            $pattern = '^(?<indent>\s*)obj\.source\s*=\s*[''"]luasession\.cc[''"]\s*$'

            $matchIndex = -1
            $indent = ""

            for ($i = 0; $i -lt $lines.Count; $i++) {

              if ($lines[$i] -match $pattern) {
                $matchIndex = $i
                $indent = $Matches["indent"]
                break
              }
            }

            if ($matchIndex -eq -1) {

              Write-Host ""
              Write-Host "=========================================================="
              Write-Host "luasession/wscript contents:"
              Write-Host "=========================================================="

              $lines | ForEach-Object {
                Write-Host $_
              }

              throw "Could not locate obj.source = 'luasession.cc'."
            }

            $inner = $indent + "    "
            $inner2 = $inner + "    "

            $insertion = @(
              "",
              "${indent}if bld.env['build_target'] == 'msvc':",
              "${inner}if isinstance(obj.source, str):",
              "${inner2}obj.source = obj.source.split()",
              "${inner}else:",
              "${inner2}obj.source = list(obj.source)",
              "${inner}obj.source += [",
              "${inner2}'../libs/pbd/msvc/getopt_luasession.c',",
              "${inner2}'../libs/pbd/msvc/getopt_long_luasession.c',",
              "${inner}]"
            )

            $newLines = @()

            if ($matchIndex -ge 0) {
              $newLines += $lines[0..$matchIndex]
            }

            $newLines += $insertion

            if ($matchIndex + 1 -lt $lines.Count) {
              $newLines += $lines[($matchIndex + 1)..($lines.Count - 1)]
            }

            Set-Content `
              -Path $wscript `
              -Value $newLines `
              -Encoding UTF8

            Write-Host "Patched luasession/wscript."
          }

          # ------------------------------------------------------------
          # E. Print final state
          # ------------------------------------------------------------

          Write-Host ""
          Write-Host "=========================================================="
          Write-Host "VERIFYING LUASESSION GETOPT PATCH"
          Write-Host "=========================================================="

          Write-Host ""
          Write-Host "--- luasession.cc ---"

          Get-Content "luasession\luasession.cc" |
            Select-String `
              -Pattern "ARDOUR_MSVC_GETOPT_LOCAL|GETOPT_API" `
              -Context 2,3

          Write-Host ""
          Write-Host "--- luasession/wscript ---"

          Get-Content "luasession\wscript" |
            Select-String `
              -Pattern "luasession\.cc|getopt_luasession|getopt_long_luasession" `
              -Context 2,4

          Write-Host ""
          Write-Host "--- private getopt files ---"

          foreach ($file in $privateSources) {
            Write-Host ""
            Write-Host $file

            Select-String `
              -Path $file `
              -Pattern "GETOPT_API|dllexport|dllimport" `
              -Context 1,1 `
              -ErrorAction SilentlyContinue
          }

          Write-Host ""
          Write-Host "MSVC luasession getopt patch completed."

      # ================================================================
      # 4. TOOLCHAIN
      # ================================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"

      - name: Ensure Strawberry Perl is on PATH
        shell: pwsh
        run: |
          if (Test-Path "C:\Strawberry\perl\bin") {
            "C:\Strawberry\perl\bin" |
              Out-File `
                -FilePath $env:GITHUB_PATH `
                -Encoding utf8 `
                -Append
          }

      # ================================================================
      # 5. VCPKG TOOL CACHE
      # ================================================================
      - name: Restore vcpkg tool cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg
          key: >-
            ardour-vcpkg-tool-${{ runner.os }}-
            ${{ inputs.vcpkg_ref != '' && inputs.vcpkg_ref || 'latest' }}
          restore-keys: |
            ardour-vcpkg-tool-${{ runner.os }}-

      # ================================================================
      # 6. STANDALONE VCPKG
      # ================================================================
      - name: Bootstrap standalone vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item Env:VCPKG_ROOT -ErrorAction SilentlyContinue

          $vcpkg = $env:VCPKG_HOME

          Write-Host "Using standalone vcpkg: $vcpkg"

          if (!(Test-Path "$vcpkg\.git")) {

            if (Test-Path $vcpkg) {
              Write-Host "Existing C:\vcpkg is not a Git repository."
              Write-Host "Removing it..."

              Remove-Item `
                -Path $vcpkg `
                -Recurse `
                -Force
            }

            Write-Host "Cloning standalone vcpkg..."

            git clone `
              https://github.com/microsoft/vcpkg.git `
              $vcpkg
          }

          Push-Location $vcpkg

          git fetch origin --tags --quiet

          if ("${{ inputs.vcpkg_ref }}" -ne "") {
            Write-Host "Using pinned vcpkg ref: ${{ inputs.vcpkg_ref }}"
            git checkout "${{ inputs.vcpkg_ref }}"
          }
          else {
            Write-Host "Using latest vcpkg master"
            git checkout master --quiet
            git pull --ff-only origin master
          }

          Pop-Location

          if (!(Test-Path "$vcpkg\bootstrap-vcpkg.bat")) {
            throw "bootstrap-vcpkg.bat not found at $vcpkg"
          }

          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics

          if (!(Test-Path "$vcpkg\vcpkg.exe")) {
            throw "vcpkg.exe was not created."
          }

          Write-Host "Standalone vcpkg is ready."

      # ================================================================
      # 7. VCPKG DEPENDENCY CACHE
      # ================================================================
      - name: Restore vcpkg dependency cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\downloads
            C:\vcpkg\buildtrees
          key: >-
            ardour-deps-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-
            ${{ inputs.vcpkg_ref != '' && inputs.vcpkg_ref || 'floating' }}
          restore-keys: |
            ardour-deps-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-

      # ================================================================
      # 8. DOWNLOAD ARDOUR MSVC DEPENDENCY HELPER
      # ================================================================
      - name: Download Ardour dependency helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://raw.githubusercontent.com/EZ4Stephen/testardourdeps/main/vcpkg-build/InstallDependencies.vcpkg.py"
          $file = "$env:GITHUB_WORKSPACE\InstallDependencies.vcpkg.py"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $file

          if (!(Test-Path $file)) {
            throw "Failed to download Ardour dependency helper."
          }

          Write-Host "Downloaded Ardour dependency helper."

      # ================================================================
      # 9. POINT HELPER AT OUR STANDALONE VCPKG
      # ================================================================
      - name: Configure dependency helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "$env:GITHUB_WORKSPACE\InstallDependencies.vcpkg.py"

          $text = Get-Content `
            -Path $file `
            -Raw

          $old = '_vcpkg_dir = _script_dir / "vcpkg"'
          $new = '_vcpkg_dir = Path(r"C:\vcpkg")'

          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
          }
          else {
            Write-Host "Helper does not contain the expected local-vcpkg path."
          }

          Set-Content `
            -Path $file `
            -Value $text `
            -Encoding utf8

          Write-Host "Dependency helper configured."

      # ================================================================
      # 10. INSTALL ARDOUR DEPENDENCIES
      # ================================================================
      - name: Install Ardour dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python "$env:GITHUB_WORKSPACE\InstallDependencies.vcpkg.py"

          if (!(Test-Path "$env:VCPKG_HOME\installed\$env:VCPKG_TRIPLET")) {
            throw "Expected vcpkg installed tree was not created."
          }

          Write-Host "Ardour dependency installation completed."

      # ================================================================
      # 11. CONFIGURE VCPKG ENVIRONMENT
      # ================================================================
      - name: Configure vcpkg environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installed = "$env:VCPKG_HOME\installed\$env:VCPKG_TRIPLET"
          $pkgconfDir = "$installed\tools\pkgconf"
          $pkgconfExe = "$pkgconfDir\pkgconf.exe"

          if (!(Test-Path $installed)) {
            throw "Installed vcpkg tree not found: $installed"
          }

          if (!(Test-Path $pkgconfExe)) {
            throw "pkgconf.exe not found: $pkgconfExe"
          }

          "VCPKG_INSTALLED=$installed" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "INCLUDE=$installed\include;$env:INCLUDE" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "LIB=$installed\lib;$env:LIB" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "PKG_CONFIG_PATH=$installed\lib\pkgconfig;$installed\share\pkgconfig" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "PKG_CONFIG=$pkgconfExe" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "$pkgconfDir" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          "$installed\bin" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          Write-Host "vcpkg environment configured."

      # ================================================================
      # 12. GENERATE EXPLICIT MSVC INCLUDE FLAGS
      # ================================================================
      - name: Configure explicit MSVC include flags
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installed = $env:VCPKG_INSTALLED
          $pkgconf = $env:PKG_CONFIG

          if (!(Test-Path $pkgconf)) {
            throw "PKG_CONFIG executable not found: $pkgconf"
          }

          $includeDirs = New-Object `
            System.Collections.Generic.HashSet[string] `
            ([System.StringComparer]::OrdinalIgnoreCase)

          [void]$includeDirs.Add("$installed\include")

          $packages = @(
            "glib-2.0",
            "gobject-2.0",
            "gio-2.0",
            "gmodule-2.0",
            "gthread-2.0",
            "glibmm-2.4",
            "giomm-2.4",
            "sigc++-2.0",
            "cairo",
            "cairomm-1.0",
            "pango",
            "pangomm-1.4",
            "pangocairo",
            "pangoft2",
            "libxml-2.0",
            "libpng",
            "sndfile",
            "samplerate",
            "fftw3",
            "fftw3f",
            "flac",
            "ogg",
            "lilv-0",
            "serd-0",
            "sord-0",
            "sratom-0",
            "rubberband",
            "liblo",
            "portaudio-2.0",
            "aubio",
            "lv2",
            "libusb-1.0"
          )

          foreach ($package in $packages) {

            $result = & $pkgconf --cflags-only-I $package 2>&1

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Could not query include flags for $package"
              continue
            }

            foreach ($token in ($result -split '\s+')) {

              if ([string]::IsNullOrWhiteSpace($token)) {
                continue
              }

              if ($token.StartsWith("-I")) {

                $path = $token.Substring(2).Trim('"')
                $path = $path -replace '/', '\'

                if ($path.Length -gt 0) {
                  [void]$includeDirs.Add($path)
                }
              }
            }
          }

          $knownDirectories = @(
            "$installed\include",
            "$installed\include\glib-2.0",
            "$installed\lib\glib-2.0\include",
            "$installed\include\libxml2",
            "$installed\include\libusb-1.0",
            "$installed\include\pthread",
            "$installed\include\sigc++-2.0",
            "$installed\include\glibmm-2.66",
            "$installed\include\glibmm-2.68",
            "$installed\include\giomm-2.66",
            "$installed\include\giomm-2.68"
          )

          foreach ($directory in $knownDirectories) {
            if (Test-Path $directory) {
              [void]$includeDirs.Add($directory)
            }
          }

          Write-Host ""
          Write-Host "==============================================================="
          Write-Host "Resolved include directories"
          Write-Host "==============================================================="

          foreach ($directory in $includeDirs) {
            Write-Host "  $directory"
          }

          $flags = @()

          foreach ($directory in $includeDirs) {
            $escaped = $directory.Replace('"', '""')
            $flags += "/I`"$escaped`""
          }

          $includeFlags = $flags -join " "

          Write-Host ""
          Write-Host "==============================================================="
          Write-Host "Generated MSVC include flags"
          Write-Host "==============================================================="
          Write-Host $includeFlags

          "CFLAGS=$includeFlags $env:CFLAGS" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "CXXFLAGS=$includeFlags $env:CXXFLAGS" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          $includeEnvironment = $includeDirs -join ";"

          "INCLUDE=$includeEnvironment;$env:INCLUDE" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ""
          Write-Host "MSVC include flags configured."

      # ================================================================
      # 13. VERIFY IMPORTANT MSVC HEADERS
      # ================================================================
      - name: Verify MSVC dependency headers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $testDir = "$env:RUNNER_TEMP\ardour-header-test"

          if (Test-Path $testDir) {
            Remove-Item `
              $testDir `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $testDir |
            Out-Null

          @'
          #include <glib.h>
          #include <glibmm.h>
          #include <sigc++/trackable.h>
          #include <libxml/parser.h>
          #include <libusb.h>

          int main()
          {
              return 0;
          }
          '@ | Set-Content `
            -Path "$testDir\test.cpp" `
            -Encoding utf8

          Write-Host "Testing MSVC dependency headers..."

          & cl `
            /nologo `
            /EHsc `
            /c `
            "$testDir\test.cpp" `
            /Fo"$testDir\test.obj"

          if ($LASTEXITCODE -ne 0) {
            throw "MSVC cannot see one or more required Ardour dependency headers."
          }

          Write-Host ""
          Write-Host "Header visibility test passed."
          Write-Host "  glib.h"
          Write-Host "  glibmm.h"
          Write-Host "  sigc++/trackable.h"
          Write-Host "  libxml/parser.h"
          Write-Host "  libusb.h"

      # ================================================================
      # 14. VERIFY PKG-CONFIG
      # ================================================================
      - name: Verify pkg-config dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $packages = @(
            "glib-2.0",
            "gobject-2.0",
            "gio-2.0",
            "gmodule-2.0",
            "gthread-2.0",
            "glibmm-2.4",
            "giomm-2.4",
            "sigc++-2.0",
            "cairo",
            "cairomm-1.0",
            "pango",
            "pangomm-1.4",
            "pangocairo",
            "libxml-2.0",
            "libpng",
            "sndfile",
            "samplerate",
            "fftw3",
            "flac",
            "lilv-0",
            "serd-0",
            "sord-0",
            "sratom-0",
            "rubberband",
            "liblo",
            "portaudio-2.0",
            "aubio"
          )

          foreach ($package in $packages) {

            $null = & $env:PKG_CONFIG --exists $package 2>&1

            if ($LASTEXITCODE -ne 0) {
              throw "pkg-config cannot find required package: $package"
            }

            $version = (
              & $env:PKG_CONFIG --modversion $package 2>&1
            ) -join ""

            Write-Host "OK  $package ($version)"
          }

          Write-Host ""
          Write-Host "All pkg-config dependency checks passed."

      # ================================================================
      # 15. CLEAN PREVIOUS WAF BUILD STATE
      # ================================================================
      - name: Clean Waf build state
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path ".waf3") {
            Remove-Item `
              -Recurse `
              -Force `
              ".waf3"
          }

          if (Test-Path "build") {
            Remove-Item `
              -Recurse `
              -Force `
              "build"
          }

          Write-Host "Waf build state cleaned."

      # ================================================================
      # 16. WAF CONFIGURE
      # ================================================================
      - name: waf configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installed = $env:VCPKG_INSTALLED

          $args = @(
            "configure",
            "--prefix=$env:INSTALL_DIR",
            "--configdir=share",
            "--dist-target=msvc",
            "--also-include=$installed\include",
            "--also-libdir=$installed\lib",
            "--cxx17"
          )

          if ("${{ inputs.build_type }}" -eq "Release") {
            $args += "--optimize"
          }
          else {
            $args += "--debug"
          }

          Write-Host ""
          Write-Host "Running:"
          Write-Host "python waf $($args -join ' ')"
          Write-Host ""

          python waf @args

      # ================================================================
      # 17. CONFIGURE LOGS
      # ================================================================
      - name: Upload configure logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ardour-config-${{ github.run_number }}
          path: |
            ${{ github.workspace }}\build\config.log
            ${{ github.workspace }}\build\config.summary
            ${{ github.workspace }}\build\config.errors
          if-no-files-found: warn
          retention-days: 14

      # ================================================================
      # 18. BUILD
      # ================================================================
      - name: waf build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $jobs = [Environment]::ProcessorCount

          Write-Host "Building Ardour with $jobs parallel jobs."

          python waf build -j $jobs

      # ================================================================
      # 19. BUILD LOGS
      # ================================================================
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ardour-build-${{ github.run_number }}
          path: |
            ${{ github.workspace }}\build
          if-no-files-found: warn
          retention-days: 14

      # ================================================================
      # 20. INSTALL
      # ================================================================
      - name: waf install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python waf install

      # ================================================================
      # 21. BUNDLE RUNTIME DLLS
      # ================================================================
      - name: Bundle runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgBin = "$env:VCPKG_INSTALLED\bin"
          $installRoot = "$env:INSTALL_DIR"

          if (!(Test-Path $vcpkgBin)) {
            throw "vcpkg runtime directory not found: $vcpkgBin"
          }

          $executables = @(
            Get-ChildItem `
              -Path $installRoot `
              -Recurse `
              -Filter "*.exe" `
              -File
          )

          if ($executables.Count -eq 0) {
            throw "No executable files were installed."
          }

          $dlls = @(
            Get-ChildItem `
              -Path $vcpkgBin `
              -Filter "*.dll" `
              -File
          )

          if ($dlls.Count -eq 0) {
            throw "No vcpkg runtime DLLs were found."
          }

          $directories = $executables |
            Select-Object `
              -ExpandProperty DirectoryName `
              -Unique

          foreach ($directory in $directories) {

            Write-Host ""
            Write-Host "Copying $($dlls.Count) DLLs to:"
            Write-Host $directory

            Copy-Item `
              -Path $dlls.FullName `
              -Destination $directory `
              -Force
          }

      # ================================================================
      # 22. VALIDATE
      # ================================================================
      - name: Validate installed build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $executables = @(
            Get-ChildItem `
              -Path $env:INSTALL_DIR `
              -Recurse `
              -Filter "*.exe" `
              -File
          )

          if ($executables.Count -eq 0) {
            throw "No executable was found after installation."
          }

          Write-Host ""
          Write-Host "Installed executables:"

          $executables | ForEach-Object {
            Write-Host "  $($_.FullName)"
          }

          Write-Host ""
          Write-Host "Ardour installation validation passed."

      # ================================================================
      # 23. UPLOAD ARTIFACT
      # ================================================================
      - name: Upload Ardour artifact
        uses: actions/upload-artifact@v4
        with:
          name: ardour-windows-msvc-${{ inputs.build_type }}-${{ github.run_number }}
          path: ${{ env.INSTALL_DIR }}
          if-no-files-found: error
          retention-days: 14