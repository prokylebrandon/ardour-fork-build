name: Build Ardour (Windows / MSVC)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "waf build type"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

      vcpkg_ref:
        description: "vcpkg commit/tag to pin (blank = latest master)"
        required: false
        default: ""
        type: string

env:
  VCPKG_HOME: C:\vcpkg
  VCPKG_TRIPLET: x64-windows
  INSTALL_DIR: ${{ github.workspace }}\dist

jobs:
  build:
    runs-on: windows-2022

    steps:

      # ================================================================
      # 1. SOURCE
      # ================================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          submodules: recursive

      # ================================================================
      # 2. FETCH ARDOUR UPSTREAM TAGS
      # ================================================================
      - name: Fetch Ardour upstream tags
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Fetching official Ardour tags..."

          $existingRemote = git remote get-url upstream 2>$null

          if ($LASTEXITCODE -ne 0) {
            git remote add upstream https://github.com/Ardour/ardour.git
          }
          else {
            Write-Host "upstream remote already exists:"
            Write-Host $existingRemote
          }

          git fetch upstream --tags --force --prune

          Write-Host ""
          Write-Host "Current HEAD:"
          git log -1 --oneline --decorate

          Write-Host ""
          Write-Host "Testing git describe HEAD..."

          $describe = git describe HEAD 2>&1

          if ($LASTEXITCODE -ne 0) {
            Write-Error ($describe -join "`n")
            throw "git describe HEAD failed after fetching Ardour tags."
          }

          Write-Host "git describe HEAD = $($describe -join '')"

      # ================================================================
      # 3. PATCH LUASESSION MSVC GETOPT LINKING
      #
      # Ardour's libpbd contains getopt.c/getopt_long.c for MSVC,
      # but ardour9-lua can still end up with:
      #
      #   unresolved external symbol __imp_getopt_long_a
      #
      # ROOT CAUSE
      # ----------
      # getopt.h emits __declspec(dllimport) on getopt_a / getopt_long_a
      # whenever LIBPBD_DLL is defined without LIBPBD_DLL_EXPORTS (i.e.
      # in every TU that is not libpbd itself, including luasession).
      # The compiler therefore generates *indirect* calls through the
      # IAT pointers __imp_getopt_a / __imp_getopt_long_a rather than
      # direct calls to the function symbols.  Compiling the getopt .c
      # sources into luasession provides getopt_long_a as a regular
      # symbol, but nothing provides the IAT pointer __imp_getopt_long_a,
      # so the linker fails with LNK2019.
      #
      # FIX OVERVIEW
      # ------------
      # Three private source files are compiled directly into luasession:
      #
      #   getopt_luasession.c          – private copy of getopt.c
      #   getopt_long_luasession.c     – private copy of getopt_long.c
      #   getopt_import_stubs_luasession.c  ← NEW
      #       Defines __imp_getopt_a and __imp_getopt_long_a as void*
      #       variables initialised with the addresses of the two
      #       functions above.  The linker sees these as data symbols and
      #       the compiler-generated indirect calls work correctly at
      #       runtime.
      #
      # FIX #1 (unchanged): private copies of the source files guarantee
      # luasession never shares an output .obj path with libpbd's own
      # compile of those same files under parallel jobs.
      #
      # FIX #2 (unchanged): obj.source is normalised from str to list
      # before appending so Python does not raise TypeError.
      # ================================================================
      - name: Patch luasession MSVC getopt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $msvcDir = "libs\pbd\msvc"

          # ----------------------------------------------------------
          # Step A: private copies of the two getopt source files
          # ----------------------------------------------------------
          $copies = @(
            @{ Src = "getopt.c";      Dst = "getopt_luasession.c" },
            @{ Src = "getopt_long.c"; Dst = "getopt_long_luasession.c" }
          )

          foreach ($copy in $copies) {
            $srcPath = Join-Path $msvcDir $copy.Src
            $dstPath = Join-Path $msvcDir $copy.Dst

            if (-not (Test-Path $srcPath)) {
              throw "$srcPath was not found; cannot create private copy for luasession."
            }

            if (-not (Test-Path $dstPath)) {
              Copy-Item -Path $srcPath -Destination $dstPath
              Write-Host "Created private copy: $dstPath"
            }
            else {
              Write-Host "Private copy already exists: $dstPath"
            }

            # getopt.h gates the real function bodies behind
            # LIBPBD_DLL_EXPORTS. luasession compiles with LIBPBD_DLL
            # defined but not LIBPBD_DLL_EXPORTS, so without this the
            # private copy's own getopt_a / getopt_long_a bodies never
            # get emitted, leaving them unresolved at link time even
            # though the file "compiles" cleanly.
            $dstContent = Get-Content -Path $dstPath -Raw

            if (-not $dstContent.Contains("#define LIBPBD_DLL_EXPORTS")) {
              $patched = "#define LIBPBD_DLL_EXPORTS`r`n" + $dstContent
              Set-Content -Path $dstPath -Value $patched -Encoding UTF8
              Write-Host "Injected LIBPBD_DLL_EXPORTS into: $dstPath"
            }
            else {
              Write-Host "LIBPBD_DLL_EXPORTS already present in: $dstPath"
            }
          }

          # ----------------------------------------------------------
          # Step B: create the __imp_ stub file
          #
          # getopt.h marks getopt_a / getopt_long_a as dllimport in
          # every TU outside libpbd, so the compiler emits indirect
          # calls through __imp_getopt_a / __imp_getopt_long_a (IAT
          # pointers).  We satisfy those linker symbols here by
          # defining them as void* variables that hold the addresses of
          # our locally compiled implementations.
          #
          # DO NOT include getopt.h in this file – the forward
          # declarations below intentionally omit __declspec(dllimport)
          # so that taking the function's address compiles without
          # C2496 / C2491.
          # ----------------------------------------------------------
          $stubPath = Join-Path $msvcDir "getopt_import_stubs_luasession.c"

          if (-not (Test-Path $stubPath)) {
            $stubContent = @'
          /*
           * getopt_import_stubs_luasession.c
           *
           * Purpose
           * -------
           * Ardour's libs/pbd/msvc/getopt.h marks getopt_a and getopt_long_a as
           * __declspec(dllimport) whenever LIBPBD_DLL is defined without
           * LIBPBD_DLL_EXPORTS (i.e. in any TU that is NOT part of libpbd itself,
           * including luasession).  The compiler therefore emits indirect-call code
           * that dereferences the import-address-table (IAT) pointers:
           *
           *   call QWORD PTR [__imp_getopt_long_a]   ; x64 example
           *
           * Because luasession compiles getopt sources directly (not through
           * libpbd.dll), no DLL import library provides those __imp_ symbols, and
           * the linker reports:
           *
           *   LNK2019: unresolved external symbol __imp_getopt_long_a
           *
           * Fix
           * ---
           * We define __imp_getopt_a and __imp_getopt_long_a here as plain void*
           * variables initialised with the addresses of our locally compiled
           * implementations (getopt_luasession.c / getopt_long_luasession.c).
           * The linker sees these as data symbols, satisfying the IAT-pointer
           * references, and the indirect calls work correctly at runtime.
           *
           * Important: do NOT #include getopt.h in this file.  The forward
           * declarations below intentionally omit __declspec(dllimport) so that
           * the address-of expressions compile without C2496/C2491.
           */

          #ifdef _MSC_VER

          /* Suppress: non-standard extension – function/data pointer conversion */
          #pragma warning(push)
          #pragma warning(disable: 4054)
          #pragma warning(disable: 4055)
          #pragma warning(disable: 4152)

          /*
           * Forward-declare using simplified but link-compatible signatures.
           * The real fourth parameter of getopt_long_a is 'const struct option *';
           * 'const void *' is sufficient here because we only need the function
           * address and want to avoid dragging in the struct option definition.
           */
          extern int getopt_a(int, char *const *, const char *);
          extern int getopt_long_a(int, char *const *, const char *,
                                   const void *, int *);

          /*
           * IAT-pointer symbols the compiler emits references to when it sees
           * __declspec(dllimport) on the two functions above.
           * Initialising them with our static implementations' addresses causes
           * the indirect calls to reach the locally compiled code.
           */
          void *__imp_getopt_a      = (void *)getopt_a;
          void *__imp_getopt_long_a = (void *)getopt_long_a;

          #pragma warning(pop)

          #endif /* _MSC_VER */
          '@

            Set-Content -Path $stubPath -Value $stubContent -Encoding UTF8
            Write-Host "Created import stub file: $stubPath"
          }
          else {
            Write-Host "Import stub file already exists: $stubPath"
          }

          # ----------------------------------------------------------
          # Step C: patch luasession/wscript
          # ----------------------------------------------------------
          $file = "luasession\wscript"

          if (-not (Test-Path $file)) {
            throw "$file was not found."
          }

          # Idempotency: keyed on the stub file name (new, unique string).
          # If only the old patch (without stubs) is present this check
          # will not match, causing the wscript to be re-patched with the
          # complete set of three source files.
          $existing = Get-Content $file -Raw

          if ($existing.Contains("../libs/pbd/msvc/getopt_import_stubs_luasession.c")) {
            Write-Host "luasession getopt patch already exists. Skipping."
            exit 0
          }

          $lines = Get-Content $file

          # Match the source line tolerant of whitespace/quote style, instead
          # of relying on one exact literal string that upstream formatting
          # changes can silently break.
          #   obj.source       = 'luasession.cc'
          #   obj.source = "luasession.cc"
          $pattern = "^(?<indent>\s*)obj\.source\s*=\s*['""]luasession\.cc['""]\s*$"

          $matchIndex = -1

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $pattern) {
              $matchIndex = $i
              break
            }
          }

          if ($matchIndex -eq -1) {
            Write-Host ""
            Write-Host "=========================================================="
            Write-Host "Could not find the expected luasession source line."
            Write-Host "Showing full file for diagnosis:"
            Write-Host "=========================================================="
            Get-Content $file | ForEach-Object { Write-Host $_ }

            throw (
              "Could not find expected luasession source marker " +
              "(obj.source = 'luasession.cc'). " +
              "Upstream luasession/wscript may have changed format; " +
              "see file dump above and update the patch step."
            )
          }

          $indent = $Matches['indent']
          $innerIndent = $indent + "    "
          $innerInnerIndent = $innerIndent + "    "

          # NOTE: obj.source upstream is a STRING, not a list, so we
          # must normalise it to a list before appending to it.
          #
          # Three files are added:
          #   getopt_luasession.c               – implements getopt_a
          #   getopt_long_luasession.c          – implements getopt_long_a
          #   getopt_import_stubs_luasession.c  – provides __imp_ IAT ptrs
          $insertion = @(
            "",
            "${indent}if bld.env['build_target'] == 'msvc':",
            "${innerIndent}if isinstance(obj.source, str):",
            "${innerInnerIndent}obj.source = obj.source.split()",
            "${innerIndent}else:",
            "${innerInnerIndent}obj.source = list(obj.source)",
            "${innerIndent}obj.source += [",
            "${innerInnerIndent}'../libs/pbd/msvc/getopt_luasession.c',",
            "${innerInnerIndent}'../libs/pbd/msvc/getopt_long_luasession.c',",
            "${innerInnerIndent}'../libs/pbd/msvc/getopt_import_stubs_luasession.c',",
            "${innerIndent}]"
          )

          $newLines = @()
          $newLines += $lines[0..$matchIndex]
          $newLines += $insertion
          if ($matchIndex + 1 -lt $lines.Count) {
            $newLines += $lines[($matchIndex + 1)..($lines.Count - 1)]
          }

          Set-Content -Path $file -Value $newLines -Encoding UTF8

          Write-Host "Added private MSVC getopt copies + IAT import stubs to luasession."
          Write-Host ""
          Write-Host "Resulting section:"
          Get-Content $file |
            Select-String -Pattern "getopt|obj.source" -Context 2,2

      # ================================================================
      # 4. TOOLCHAIN
      # ================================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"

      - name: Ensure Strawberry Perl is on PATH
        shell: pwsh
        run: |
          if (Test-Path "C:\Strawberry\perl\bin") {
            "C:\Strawberry\perl\bin" |
              Out-File `
                -FilePath $env:GITHUB_PATH `
                -Encoding utf8 `
                -Append
          }

      # ================================================================
      # 5. VCPKG TOOL CACHE
      # ================================================================
      - name: Restore vcpkg tool cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg
          key: >-
            ardour-vcpkg-tool-${{ runner.os }}-
            ${{ inputs.vcpkg_ref != '' && inputs.vcpkg_ref || 'latest' }}
          restore-keys: |
            ardour-vcpkg-tool-${{ runner.os }}-

      # ================================================================
      # 6. STANDALONE VCPKG
      # ================================================================
      - name: Bootstrap standalone vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Visual Studio may set VCPKG_ROOT to its own bundled copy.
          # We deliberately do not use that variable.
          Remove-Item Env:VCPKG_ROOT -ErrorAction SilentlyContinue

          $vcpkg = $env:VCPKG_HOME

          Write-Host "Using standalone vcpkg: $vcpkg"

          if (!(Test-Path "$vcpkg\.git")) {

            if (Test-Path $vcpkg) {
              Write-Host "Existing C:\vcpkg is not a Git repository."
              Write-Host "Removing it..."

              Remove-Item `
                -Path $vcpkg `
                -Recurse `
                -Force
            }

            Write-Host "Cloning standalone vcpkg..."

            git clone `
              https://github.com/microsoft/vcpkg.git `
              $vcpkg
          }

          Push-Location $vcpkg

          git fetch origin --tags --quiet

          if ("${{ inputs.vcpkg_ref }}" -ne "") {
            Write-Host "Using pinned vcpkg ref: ${{ inputs.vcpkg_ref }}"
            git checkout "${{ inputs.vcpkg_ref }}"
          }
          else {
            Write-Host "Using latest vcpkg master"
            git checkout master --quiet
            git pull --ff-only origin master
          }

          Pop-Location

          if (!(Test-Path "$vcpkg\bootstrap-vcpkg.bat")) {
            throw "bootstrap-vcpkg.bat not found at $vcpkg"
          }

          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics

          if (!(Test-Path "$vcpkg\vcpkg.exe")) {
            throw "vcpkg.exe was not created."
          }

          Write-Host "Standalone vcpkg is ready."

      # ================================================================
      # 7. VCPKG DEPENDENCY CACHE
      # ================================================================
      - name: Restore vcpkg dependency cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\downloads
            C:\vcpkg\buildtrees
          key: >-
            ardour-deps-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-
            ${{ inputs.vcpkg_ref != '' && inputs.vcpkg_ref || 'floating' }}
          restore-keys: |
            ardour-deps-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-

      # ================================================================
      # 8. DOWNLOAD ARDOUR MSVC DEPENDENCY HELPER
      # ================================================================
      - name: Download Ardour dependency helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://raw.githubusercontent.com/EZ4Stephen/testardourdeps/main/vcpkg-build/InstallDependencies.vcpkg.py"
          $file = "$env:GITHUB_WORKSPACE\InstallDependencies.vcpkg.py"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $file

          if (!(Test-Path $file)) {
            throw "Failed to download Ardour dependency helper."
          }

          Write-Host "Downloaded Ardour dependency helper."

      # ================================================================
      # 9. POINT HELPER AT OUR STANDALONE VCPKG
      # ================================================================
      - name: Configure dependency helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "$env:GITHUB_WORKSPACE\InstallDependencies.vcpkg.py"

          $text = Get-Content `
            -Path $file `
            -Raw

          $old = '_vcpkg_dir = _script_dir / "vcpkg"'
          $new = '_vcpkg_dir = Path(r"C:\vcpkg")'

          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
          }
          else {
            Write-Host "Helper does not contain the expected local-vcpkg path."
          }

          Set-Content `
            -Path $file `
            -Value $text `
            -Encoding utf8

          Write-Host "Dependency helper configured."

      # ================================================================
      # 10. INSTALL ARDOUR DEPENDENCIES
      # ================================================================
      - name: Install Ardour dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python "$env:GITHUB_WORKSPACE\InstallDependencies.vcpkg.py"

          if (!(Test-Path "$env:VCPKG_HOME\installed\$env:VCPKG_TRIPLET")) {
            throw "Expected vcpkg installed tree was not created."
          }

          Write-Host "Ardour dependency installation completed."

      # ================================================================
      # 11. CONFIGURE VCPKG ENVIRONMENT
      # ================================================================
      - name: Configure vcpkg environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installed = "$env:VCPKG_HOME\installed\$env:VCPKG_TRIPLET"
          $pkgconfDir = "$installed\tools\pkgconf"
          $pkgconfExe = "$pkgconfDir\pkgconf.exe"

          if (!(Test-Path $installed)) {
            throw "Installed vcpkg tree not found: $installed"
          }

          if (!(Test-Path $pkgconfExe)) {
            throw "pkgconf.exe not found: $pkgconfExe"
          }

          "VCPKG_INSTALLED=$installed" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "INCLUDE=$installed\include;$env:INCLUDE" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "LIB=$installed\lib;$env:LIB" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "PKG_CONFIG_PATH=$installed\lib\pkgconfig;$installed\share\pkgconfig" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "PKG_CONFIG=$pkgconfExe" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "$pkgconfDir" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          "$installed\bin" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          Write-Host "vcpkg environment configured."

      # ================================================================
      # 12. GENERATE EXPLICIT MSVC INCLUDE FLAGS
      # ================================================================
      - name: Configure explicit MSVC include flags
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installed = $env:VCPKG_INSTALLED
          $pkgconf = $env:PKG_CONFIG

          if (!(Test-Path $pkgconf)) {
            throw "PKG_CONFIG executable not found: $pkgconf"
          }

          $includeDirs = New-Object `
            System.Collections.Generic.HashSet[string] `
            ([System.StringComparer]::OrdinalIgnoreCase)

          [void]$includeDirs.Add("$installed\include")

          # Query pkg-config for package-specific include directories.
          $packages = @(
            "glib-2.0",
            "gobject-2.0",
            "gio-2.0",
            "gmodule-2.0",
            "gthread-2.0",
            "glibmm-2.4",
            "giomm-2.4",
            "sigc++-2.0",
            "cairo",
            "cairomm-1.0",
            "pango",
            "pangomm-1.4",
            "pangocairo",
            "pangoft2",
            "libxml-2.0",
            "libpng",
            "sndfile",
            "samplerate",
            "fftw3",
            "fftw3f",
            "flac",
            "ogg",
            "lilv-0",
            "serd-0",
            "sord-0",
            "sratom-0",
            "rubberband",
            "liblo",
            "portaudio-2.0",
            "aubio",
            "lv2",
            "libusb-1.0"
          )

          foreach ($package in $packages) {

            $result = & $pkgconf --cflags-only-I $package 2>&1

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Could not query include flags for $package"
              continue
            }

            foreach ($token in ($result -split '\s+')) {

              if ([string]::IsNullOrWhiteSpace($token)) {
                continue
              }

              if ($token.StartsWith("-I")) {

                $path = $token.Substring(2).Trim('"')

                $path = $path -replace '/', '\'

                if ($path.Length -gt 0) {
                  [void]$includeDirs.Add($path)
                }
              }
            }
          }

          # Explicit known include locations for Windows/vcpkg layouts.
          $knownDirectories = @(
            "$installed\include",
            "$installed\include\glib-2.0",
            "$installed\lib\glib-2.0\include",
            "$installed\include\libxml2",

            # FIX:
            # vcpkg/libusb places libusb.h under include\libusb-1.0.
            "$installed\include\libusb-1.0",

            "$installed\include\pthread",
            "$installed\include\sigc++-2.0",
            "$installed\include\glibmm-2.66",
            "$installed\include\glibmm-2.68",
            "$installed\include\giomm-2.66",
            "$installed\include\giomm-2.68"
          )

          foreach ($directory in $knownDirectories) {
            if (Test-Path $directory) {
              [void]$includeDirs.Add($directory)
            }
          }

          Write-Host ""
          Write-Host "==============================================================="
          Write-Host "Resolved include directories"
          Write-Host "==============================================================="

          foreach ($directory in $includeDirs) {
            Write-Host "  $directory"
          }

          $flags = @()

          foreach ($directory in $includeDirs) {
            $escaped = $directory.Replace('"', '""')
            $flags += "/I`"$escaped`""
          }

          $includeFlags = $flags -join " "

          Write-Host ""
          Write-Host "==============================================================="
          Write-Host "Generated MSVC include flags"
          Write-Host "==============================================================="
          Write-Host $includeFlags

          "CFLAGS=$includeFlags $env:CFLAGS" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "CXXFLAGS=$includeFlags $env:CXXFLAGS" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          $includeEnvironment = $includeDirs -join ";"

          "INCLUDE=$includeEnvironment;$env:INCLUDE" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ""
          Write-Host "MSVC include flags configured."

      # ================================================================
      # 13. VERIFY IMPORTANT MSVC HEADERS
      # ================================================================
      - name: Verify MSVC dependency headers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $testDir = "$env:RUNNER_TEMP\ardour-header-test"

          if (Test-Path $testDir) {
            Remove-Item `
              $testDir `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $testDir |
            Out-Null

          @'
          #include <glib.h>
          #include <glibmm.h>
          #include <sigc++/trackable.h>
          #include <libxml/parser.h>
          #include <libusb.h>

          int main()
          {
              return 0;
          }
          '@ | Set-Content `
            -Path "$testDir\test.cpp" `
            -Encoding utf8

          Write-Host "Testing MSVC dependency headers..."

          & cl `
            /nologo `
            /EHsc `
            /c `
            "$testDir\test.cpp" `
            /Fo"$testDir\test.obj"

          if ($LASTEXITCODE -ne 0) {
            throw "MSVC cannot see one or more required Ardour dependency headers."
          }

          Write-Host ""
          Write-Host "Header visibility test passed."
          Write-Host "  glib.h"
          Write-Host "  glibmm.h"
          Write-Host "  sigc++/trackable.h"
          Write-Host "  libxml/parser.h"
          Write-Host "  libusb.h"

      # ================================================================
      # 14. VERIFY PKG-CONFIG
      # ================================================================
      - name: Verify pkg-config dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $packages = @(
            "glib-2.0",
            "gobject-2.0",
            "gio-2.0",
            "gmodule-2.0",
            "gthread-2.0",
            "glibmm-2.4",
            "giomm-2.4",
            "sigc++-2.0",
            "cairo",
            "cairomm-1.0",
            "pango",
            "pangomm-1.4",
            "pangocairo",
            "libxml-2.0",
            "libpng",
            "sndfile",
            "samplerate",
            "fftw3",
            "flac",
            "lilv-0",
            "serd-0",
            "sord-0",
            "sratom-0",
            "rubberband",
            "liblo",
            "portaudio-2.0",
            "aubio"
          )

          foreach ($package in $packages) {

            $null = & $env:PKG_CONFIG --exists $package 2>&1

            if ($LASTEXITCODE -ne 0) {
              throw "pkg-config cannot find required package: $package"
            }

            $version = (
              & $env:PKG_CONFIG --modversion $package 2>&1
            ) -join ""

            Write-Host "OK  $package ($version)"
          }

          Write-Host ""
          Write-Host "All pkg-config dependency checks passed."

      # ================================================================
      # 15. CLEAN PREVIOUS WAF BUILD STATE
      #
      # Ensures a fully clean configure/build on every run. Slower than
      # an incremental build, but avoids stale Waf/MSVC configuration
      # left over from a prior cache restore or reused workspace.
      # ================================================================
      - name: Clean Waf build state
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path ".waf3") {
            Remove-Item -Recurse -Force ".waf3"
          }

          if (Test-Path "build") {
            Remove-Item -Recurse -Force "build"
          }

          Write-Host "Waf build state cleaned."

      # ================================================================
      # 16. WAF CONFIGURE
      # ================================================================
      - name: waf configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installed = $env:VCPKG_INSTALLED

          $args = @(
            "configure",
            "--prefix=$env:INSTALL_DIR",
            "--configdir=share",
            "--dist-target=msvc",
            "--also-include=$installed\include",
            "--also-libdir=$installed\lib",
            "--cxx17"
          )

          if ("${{ inputs.build_type }}" -eq "Release") {
            $args += "--optimize"
          }
          else {
            $args += "--debug"
          }

          Write-Host ""
          Write-Host "Running:"
          Write-Host "python waf $($args -join ' ')"
          Write-Host ""

          python waf @args

      # ================================================================
      # 17. CONFIGURE LOGS
      # ================================================================
      - name: Upload configure logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ardour-config-${{ github.run_number }}
          path: |
            ${{ github.workspace }}\build\config.log
            ${{ github.workspace }}\build\config.summary
            ${{ github.workspace }}\build\config.errors
          if-no-files-found: warn
          retention-days: 14

      # ================================================================
      # 18. BUILD
      # ================================================================
      - name: waf build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $jobs = [Environment]::ProcessorCount

          Write-Host "Building Ardour with $jobs parallel jobs."

          python waf build -j $jobs

      # ================================================================
      # 19. BUILD LOGS
      # ================================================================
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ardour-build-${{ github.run_number }}
          path: |
            ${{ github.workspace }}\build
          if-no-files-found: warn
          retention-days: 14

      # ================================================================
      # 20. INSTALL
      # ================================================================
      - name: waf install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python waf install

      # ================================================================
      # 21. BUNDLE RUNTIME DLLS
      # ================================================================
      - name: Bundle runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgBin = "$env:VCPKG_INSTALLED\bin"
          $installRoot = "$env:INSTALL_DIR"

          if (!(Test-Path $vcpkgBin)) {
            throw "vcpkg runtime directory not found: $vcpkgBin"
          }

          $executables = @(
            Get-ChildItem `
              -Path $installRoot `
              -Recurse `
              -Filter "*.exe" `
              -File
          )

          if ($executables.Count -eq 0) {
            throw "No executable files were installed."
          }

          $dlls = @(
            Get-ChildItem `
              -Path $vcpkgBin `
              -Filter "*.dll" `
              -File
          )

          if ($dlls.Count -eq 0) {
            throw "No vcpkg runtime DLLs were found."
          }

          $directories = $executables |
            Select-Object `
              -ExpandProperty DirectoryName `
              -Unique

          foreach ($directory in $directories) {

            Write-Host ""
            Write-Host "Copying $($dlls.Count) DLLs to:"
            Write-Host $directory

            Copy-Item `
              -Path $dlls.FullName `
              -Destination $directory `
              -Force
          }

      # ================================================================
      # 22. VALIDATE
      # ================================================================
      - name: Validate installed build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $executables = @(
            Get-ChildItem `
              -Path $env:INSTALL_DIR `
              -Recurse `
              -Filter "*.exe" `
              -File
          )

          if ($executables.Count -eq 0) {
            throw "No executable was found after installation."
          }

          Write-Host ""
          Write-Host "Installed executables:"

          $executables | ForEach-Object {
            Write-Host "  $($_.FullName)"
          }

          Write-Host ""
          Write-Host "Ardour installation validation passed."

      # ================================================================
      # 23. UPLOAD ARTIFACT
      # ================================================================
      - name: Upload Ardour artifact
        uses: actions/upload-artifact@v4
        with:
          name: ardour-windows-msvc-${{ inputs.build_type }}-${{ github.run_number }}
          path: ${{ env.INSTALL_DIR }}
          if-no-files-found: error
          retention-days: 14
